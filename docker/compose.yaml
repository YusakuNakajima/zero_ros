services:
  ros_study:
    container_name: ros_study_humble
    image: ros_study_humble
    build:
      context: ..
      dockerfile: docker/Dockerfile
    privileged: true
    network_mode: host
    environment:
      - DISPLAY
      - QT_X11_NO_MITSHM=1
      - ROS_DISTRO=humble
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-1}
      - ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    volumes:
      - ..:/home/ros/zero_ros
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev:/dev
    working_dir: /home/ros/ros2_ws
    tty: true
    stdin_open: true
