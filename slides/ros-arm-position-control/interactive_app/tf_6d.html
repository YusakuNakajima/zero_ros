<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROS TF 時系列管理ビジュアライザー (6D版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .control-panel-bg {
            background-color: rgba(255, 255, 255, 0.05);
        }
        .info-box {
            background-color: #1f2937; /* bg-gray-800 */
        }
        .joint-track {
            background-color: #374151; /* bg-gray-700 */
        }
        .current-pos {
            transition: width 0.1s linear;
        }
        .queried-pos {
            transition: left 0.1s linear;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-6xl">
        <header class="text-center mb-6">
            <h1 class="text-3xl font-bold text-cyan-400">ROS TF 時系列管理ビジュアライザー (6D版)</h1>
            <p class="text-gray-400 mt-2">
                各軸が<span class="font-bold text-cyan-300">非同期・別周期</span>で更新される状況をシミュレートします。<br>
                シミュレーションは<span class="font-bold text-cyan-300">5秒後</span>に自動停止します。指定時刻の<span class="font-bold text-cyan-300">前後0.1秒</span>以内にデータがある場合のみ座標を取得できます。
            </p>
        </header>

        <!-- Visualization Area -->
        <div class="w-full bg-gray-800 rounded-lg p-6 shadow-2xl border border-gray-700 mb-6">
            <h2 class="text-xl font-semibold mb-4 text-center text-gray-300">6軸アームの状態</h2>
            <div id="visualization-area" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-4">
                <!-- Joint displays will be generated by JS -->
            </div>
            <p id="lookup-status-message" class="text-center font-semibold mt-4 hidden"></p>
        </div>

        <!-- Control & Info Panel -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="control-panel-bg p-4 rounded-lg border border-gray-700">
                <h2 class="text-lg font-semibold mb-3 text-cyan-400">コントロール</h2>
                <div class="flex space-x-2 mb-4">
                    <button id="start-button" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">開始</button>
                    <button id="stop-button" class="w-full bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">停止</button>
                    <button id="reset-button" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">リセット</button>
                </div>
                <div>
                    <div class="mb-3">
                        <span class="font-medium text-gray-300">シミュレーション現在時刻: </span>
                        <span id="simulation-time-display" class="font-bold text-white text-lg">0.00</span> s
                    </div>
                    <label for="time-slider" class="block mb-2 font-medium text-gray-300">座標取得の時刻を指定: <span id="current-time-display" class="font-bold text-cyan-400">0.00</span> s</label>
                    <input id="time-slider" type="range" min="0" max="10" value="0" step="0.01" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>

            <div class="info-box p-4 rounded-lg flex-grow border border-gray-700">
                <h2 class="text-lg font-semibold mb-3 text-cyan-400">情報</h2>
                <div class="space-y-3 text-sm">
                    <div>
                        <h3 class="font-semibold text-gray-400">シミュレーションパラメータ</h3>
                        <div id="simulation-params" class="font-mono bg-gray-900 p-2 rounded grid grid-cols-1 sm:grid-cols-2 text-xs gap-x-4">
                            <!-- Parameters will be generated by JS -->
                        </div>
                    </div>
                    <div>
                        <h3 class="font-semibold text-gray-400">取得した座標 (Lookup Transform)</h3>
                        <div id="queried-transform" class="font-mono bg-gray-900 p-2 rounded grid grid-cols-3 gap-x-4">
                            <!-- Queried joint values will be generated by JS -->
                        </div>
                    </div>
                    <div>
                        <h3 class="font-semibold text-gray-400">TFバッファ更新ログ (最新5件)</h3>
                        <div id="buffer-content" class="font-mono bg-gray-900 p-2 rounded h-20 overflow-y-auto text-xs">
                            バッファは空です
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const NUM_JOINTS = 6;
            const PI = Math.PI;

            // DOM elements
            const startButton = document.getElementById('start-button');
            const stopButton = document.getElementById('stop-button');
            const resetButton = document.getElementById('reset-button');
            const timeSlider = document.getElementById('time-slider');
            const currentTimeDisplay = document.getElementById('current-time-display');
            const simulationTimeDisplay = document.getElementById('simulation-time-display');
            const visualizationArea = document.getElementById('visualization-area');
            const lookupStatusMessage = document.getElementById('lookup-status-message');
            const simulationParamsDisplay = document.getElementById('simulation-params');
            const queriedTransformDisplay = document.getElementById('queried-transform');
            const bufferContentDisplay = document.getElementById('buffer-content');

            // Simulation state
            let jointBuffers = [];
            let updateLog = [];
            let simulationTime = 0;
            let simulationIntervals = [];
            let timeUpdateInterval = null;
            let autoStopTimer = null;
            let isInitialized = false;

            // Random parameters
            let jointSpeeds = [];
            let jointOffsets = [];
            let timeSteps = [];

            // --- Initialization ---
            function setupUI() {
                visualizationArea.innerHTML = '';
                queriedTransformDisplay.innerHTML = '';
                for (let i = 0; i < NUM_JOINTS; i++) {
                    visualizationArea.innerHTML += `
                        <div class="flex items-center space-x-2">
                            <span class="font-mono text-sm text-gray-400 w-8">J${i + 1}</span>
                            <div class="w-full h-6 rounded joint-track relative overflow-hidden">
                                <div id="current-pos-${i}" class="h-full bg-cyan-500 rounded current-pos"></div>
                                <div id="queried-pos-${i}" class="absolute top-0 w-1 h-full bg-pink-500 queried-pos"></div>
                            </div>
                        </div>`;
                    queriedTransformDisplay.innerHTML += `<p id="queried-joint-${i}">J${i+1}: ---</p>`;
                }
            }
            
            function initializeRandomParameters() {
                jointSpeeds = [];
                jointOffsets = [];
                timeSteps = [];
                jointBuffers = Array(NUM_JOINTS).fill(0).map(() => []);
                for (let i = 0; i < NUM_JOINTS; i++) {
                    jointSpeeds.push(Math.random() * 1.5 + 0.5);
                    jointOffsets.push(Math.random() * 2 * PI);
                    // ★★★ 修正点: タイムステップのばらつきを減らす (75ms ~ 125ms) ★★★
                    timeSteps.push(Math.random() * 50 + 75);
                }
                isInitialized = true;
                displayParameters();
            }

            function displayParameters() {
                simulationParamsDisplay.innerHTML = '';
                for (let i = 0; i < NUM_JOINTS; i++) {
                    const speed = jointSpeeds[i];
                    const step = timeSteps[i];
                    simulationParamsDisplay.innerHTML += `<p>J${i+1}: ${speed.toFixed(2)} rad/s, ${step.toFixed(0)}ms</p>`;
                }
            }

            // --- Simulation Loop ---
            function createJointUpdater(jointIndex) {
                return () => {
                    const angle = Math.sin(simulationTime * jointSpeeds[jointIndex] + jointOffsets[jointIndex]) * PI;
                    const buffer = jointBuffers[jointIndex];
                    
                    buffer.push({ time: simulationTime, value: angle });

                    updateSingleLatestJointPosition(jointIndex, angle);
                    
                    updateLog.push(`t:${simulationTime.toFixed(2)} J${jointIndex+1} updated`);
                    if (updateLog.length > 50) updateLog.shift();
                    updateBufferDisplay();
                };
            }

            // --- TF Logic ---
            function lookupTransform(targetTime) {
                const interpolatedJoints = [];
                let allSucceeded = true;
                const MAX_DISTANCE = 0.1;

                for (let i = 0; i < NUM_JOINTS; i++) {
                    const buffer = jointBuffers[i];
                    
                    if (buffer.length < 2) {
                        interpolatedJoints.push(null);
                        allSucceeded = false;
                        continue;
                    }

                    let before = null;
                    let after = null;

                    for (const transform of buffer) {
                        if (transform.time <= targetTime) {
                            before = transform;
                        }
                        if (transform.time > targetTime) {
                            after = transform;
                            break;
                        }
                    }

                    if (!before || !after || (targetTime - before.time > MAX_DISTANCE) || (after.time - targetTime > MAX_DISTANCE)) {
                        interpolatedJoints.push(null);
                        allSucceeded = false;
                        continue;
                    }

                    const timeDiff = after.time - before.time;
                    if (timeDiff === 0) {
                         interpolatedJoints.push(before.value);
                         continue;
                    }
                    
                    const ratio = (targetTime - before.time) / timeDiff;
                    const interpolatedValue = before.value + (after.value - before.value) * ratio;
                    interpolatedJoints.push(interpolatedValue);
                }
                
                return { joints: interpolatedJoints, allSucceeded: allSucceeded };
            }

            // --- UI Update ---
            function updateUI() {
                const targetTime = parseFloat(timeSlider.value);
                currentTimeDisplay.textContent = targetTime.toFixed(2);

                const transform = lookupTransform(targetTime);

                updateQueriedRobotPosition(transform.joints);

                const successfulJoints = [];
                transform.joints.forEach((joint, i) => {
                    if (joint !== null) {
                        successfulJoints.push(`J${i + 1}`);
                    }
                });

                if (transform.allSucceeded) {
                    lookupStatusMessage.textContent = '座標取得に成功！ (全軸成功!)';
                    lookupStatusMessage.className = 'text-center font-semibold mt-4 text-green-400';
                } else if (successfulJoints.length > 0) {
                    lookupStatusMessage.textContent = `部分的に取得成功: ${successfulJoints.join(', ')}`;
                    lookupStatusMessage.className = 'text-center font-semibold mt-4 text-yellow-400';
                } else {
                    lookupStatusMessage.textContent = '座標変換不可';
                    lookupStatusMessage.className = 'text-center font-semibold mt-4 text-red-500';
                }
            }
            
            const angleToPercentage = (angle) => ((angle + PI) / (2 * PI)) * 100;

            function updateSingleLatestJointPosition(jointIndex, angle) {
                const el = document.getElementById(`current-pos-${jointIndex}`);
                if (el) el.style.width = `${angleToPercentage(angle)}%`;
            }
            
            function updateQueriedRobotPosition(joints) {
                joints.forEach((angle, i) => {
                    const el = document.getElementById(`queried-pos-${i}`);
                    const infoEl = document.getElementById(`queried-joint-${i}`);
                    if (angle !== null) {
                        if (el) {
                            el.style.left = `${angleToPercentage(angle)}%`;
                            el.style.opacity = '1';
                        }
                        if(infoEl) infoEl.textContent = `J${i+1}: ${angle.toFixed(2)}`;
                    } else {
                        if (el) el.style.opacity = '0';
                        if(infoEl) infoEl.textContent = `J${i+1}: ---`;
                    }
                });
            }

            function updateBufferDisplay() {
                if (updateLog.length === 0) {
                    bufferContentDisplay.innerHTML = 'バッファは空です';
                    return;
                }
                const latest = updateLog.slice(-5).reverse();
                bufferContentDisplay.innerHTML = latest.join('<br>');
            }

            // --- Control Functions ---
            function start() {
                if (!isInitialized) initializeRandomParameters();
                if (timeUpdateInterval) return;

                autoStopTimer = setTimeout(stop, 5000);

                timeUpdateInterval = setInterval(() => {
                    simulationTime += 0.01;
                    simulationTimeDisplay.textContent = simulationTime.toFixed(2);
                    timeSlider.max = simulationTime.toFixed(2);
                }, 10);

                for (let i = 0; i < NUM_JOINTS; i++) {
                    const interval = setInterval(createJointUpdater(i), timeSteps[i]);
                    simulationIntervals.push(interval);
                }
            }
            
            function stop() {
                if (timeUpdateInterval) {
                    clearInterval(timeUpdateInterval);
                    timeUpdateInterval = null;
                }
                if (autoStopTimer) {
                    clearTimeout(autoStopTimer);
                    autoStopTimer = null;
                }
                simulationIntervals.forEach(clearInterval);
                simulationIntervals = [];
            }
            
            function reset() {
                stop();
                simulationTime = 0;
                updateLog = [];
                isInitialized = false;
                
                simulationTimeDisplay.textContent = '0.00';
                timeSlider.value = 0;
                timeSlider.max = 10;
                
                simulationParamsDisplay.innerHTML = '';
                lookupStatusMessage.className = 'text-center font-semibold mt-4 hidden';

                for(let i=0; i<NUM_JOINTS; i++) {
                    updateSingleLatestJointPosition(i, 0);
                }
                updateBufferDisplay();
                updateUI();
            }

            // --- Event Listeners ---
            startButton.addEventListener('click', start);
            stopButton.addEventListener('click', stop);
            resetButton.addEventListener('click', reset);
            timeSlider.addEventListener('input', updateUI);

            // --- Initial Call ---
            setupUI();
            reset();
        });
    </script>
</body>
</html>
