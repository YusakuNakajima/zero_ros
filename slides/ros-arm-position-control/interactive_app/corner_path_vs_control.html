<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直角の角：経路か制御か</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #111827;
            --panel: #1f2937;
            --border: #374151;
            --text: #e5e7eb;
            --muted: #9ca3af;
            --path: #fb923c;
            --ctrl: #f472b6;
            --tip: #4fc3f7;
            --acc: #a3e635;
            --limit: #f87171;
            --ref: #6b7280;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 10px;
            background: var(--bg);
            color: var(--text);
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 14px;
        }

        h1 { font-size: 16px; margin: 0 0 6px; text-align: center; }

        .controls {
            display: grid;
            grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
            gap: 8px;
            margin-bottom: 8px;
        }

        .box {
            background: var(--panel);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 6px 10px;
            min-width: 0;
        }

        .box.path { border-color: var(--path); }
        .box.ctrl { border-color: var(--ctrl); }
        .box-title { font-size: 12px; font-weight: bold; margin: 0 0 4px; }
        .path .box-title { color: var(--path); }
        .ctrl .box-title { color: var(--ctrl); }

        .seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }

        .seg button {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 3px 8px;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
        }

        .seg button.active { border-color: var(--path); color: var(--path); font-weight: bold; }

        label { display: block; font-size: 12px; color: var(--muted); }
        label span { color: var(--text); font-weight: bold; }
        input[type="range"] { width: 100%; margin: 2px 0 0; }
        input:disabled { opacity: 0.35; }

        .main {
            display: grid;
            grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.5fr);
            gap: 8px;
        }

        @media (max-width: 640px) { .controls, .main { grid-template-columns: minmax(0, 1fr); } }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px;
            min-width: 0;
        }

        .card-title { font-size: 12px; color: var(--muted); margin: 0 0 4px 4px; }
        canvas { display: block; width: 100%; }
        #top { height: 175px; }
        .plot { height: 95px; }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 4px 8px;
            margin-top: 4px;
            font-size: 11px;
            color: var(--muted);
            text-align: center;
        }

        .stats span { display: block; color: var(--text); font-weight: bold; font-size: 14px; }
        .note { margin-top: 6px; font-size: 12px; color: #fde68a; text-align: center; min-height: 1.4em; }
    </style>
</head>
<body>
    <h1>直角の角を通るとき：経路を変える？ 制御を頑張る？</h1>

    <div class="controls">
        <div class="box path">
            <p class="box-title">① 経路を変える（軌道計画）</p>
            <div class="seg" id="mode">
                <button data-v="sharp" class="active">直角のまま通過</button>
                <button data-v="stop">直角で一度止まる</button>
                <button data-v="round">角を丸める</button>
            </div>
            <label>角の丸め半径 r <span id="r-val"></span>
                <input type="range" id="r" min="10" max="120" step="5" value="80">
            </label>
        </div>
        <div class="box ctrl">
            <p class="box-title">② 制御を頑張る（サーボのゲイン）</p>
            <label>制御の強さ <span id="c-val"></span>
                <input type="range" id="c" min="0" max="100" step="5" value="30">
            </label>
            <label style="margin-top: 4px;">モータが出せる加速度の上限 <span id="amax-val"></span>（どんな制御でも超えられない）</label>
        </div>
    </div>

    <div class="main">
        <div class="card">
            <p class="card-title">上から見た手先の通り道（実寸）</p>
            <canvas id="top"></canvas>
            <div class="stats">
                <div>角での行き過ぎ<span id="s-dev"></span></div>
                <div>上限に張り付き<span id="s-sat"></span></div>
                <div>動作時間<span id="s-time"></span></div>
            </div>
        </div>
        <div class="card">
            <p class="card-title">モータの加速度 [m/s²]　赤の点線：上限</p>
            <canvas id="acc" class="plot"></canvas>
            <p class="card-title" style="margin-top: 4px;">経路からのずれ [mm]　灰色の点線：直角のまま通過（同じ制御の強さ）</p>
            <canvas id="dev" class="plot"></canvas>
            <div class="note" id="note"></div>
        </div>
    </div>

    <script>
        // ---- シミュレーション ----
        // 手先は L 字の経路（右へ L 進んで、直角に曲がって上へ L）を速さ V で進む。
        // 手先の位置 p は「目標の加速度 + PD フィードバック」で動くが、加速度の大きさは AMAX で頭打ち。
        // 制御を強くすると PD のゲイン（サーボの帯域）が上がる。
        const L = 0.3, V = 0.5, AREF = 3.0, AMAX = 4.0, DT = 0.0005, T_AFTER = 0.6;
        const R_MIN = V * V / AMAX;   // これより小さい半径だと、曲がるのに上限を超える加速度が要る

        function geometry(mode, r) {
            const rr = mode === 'round' ? r : 0;
            const l1 = L - rr, arc = Math.PI / 2 * rr;
            return {
                r: rr, total: 2 * l1 + arc, corner: l1 + arc / 2,
                at(s) {
                    if (s <= l1) return [s, 0];
                    if (s <= l1 + arc) {
                        const th = (s - l1) / rr;
                        return [l1 + rr * Math.sin(th), rr - rr * Math.cos(th)];
                    }
                    return [L, rr + (s - l1 - arc)];
                },
                dist([x, y]) {
                    // 経路（直線＋円弧＋直線）までの距離
                    const d1 = Math.hypot(x - Math.min(Math.max(x, 0), l1), y);
                    const d3 = Math.hypot(x - L, y - Math.min(Math.max(y, rr), L));
                    let d2 = Infinity;
                    if (rr > 0) {
                        const cx = l1, cy = rr, ang = Math.atan2(y - cy, x - cx);
                        d2 = ang >= -Math.PI / 2 && ang <= 0 ? Math.abs(Math.hypot(x - cx, y - cy) - rr) : Infinity;
                    }
                    return Math.min(d1, d2, d3);
                }
            };
        }

        // 台形速度で距離 len を進む s(t)
        function trapezoid(len) {
            const tAcc = V / AREF, tCruise = (len - V * tAcc) / V, T = 2 * tAcc + tCruise, out = [];
            for (let t = 0; t <= T + 1e-9; t += DT) {
                out.push(t < tAcc ? AREF * t * t / 2
                    : t < tAcc + tCruise ? V * tAcc / 2 + V * (t - tAcc)
                    : len - AREF * (T - t) ** 2 / 2);
            }
            out.push(len);
            return out;
        }

        function simulate(mode, r, c) {
            const g = geometry(mode, r);
            const s = mode === 'stop'
                ? trapezoid(L).concat(trapezoid(L).map(x => x + L))
                : trapezoid(g.total);
            const nMove = s.length, n = nMove + Math.round(T_AFTER / DT);
            const ref = [];
            for (let i = 0; i < n; i++) ref.push(g.at(s[Math.min(i, nMove - 1)]));
            const wc = 2 * Math.PI * (5 + 15 * c);   // サーボの帯域 5〜20 Hz
            const p = [0, 0], v = [0, 0];
            const t = [], acc = [], dev = [], tip = [];
            let tCorner = 0;
            for (let i = 0; i < n; i++) {
                const pr = ref[i], pp = ref[Math.max(0, i - 1)], pn = ref[Math.min(n - 1, i + 1)];
                const a = [0, 0];
                for (let k = 0; k < 2; k++) {
                    const vr = (pn[k] - pp[k]) / (2 * DT);
                    const ar = (pn[k] - 2 * pr[k] + pp[k]) / (DT * DT);
                    a[k] = ar + wc * wc * (pr[k] - p[k]) + 2 * wc * (vr - v[k]);
                }
                const mag = Math.hypot(a[0], a[1]);
                if (mag > AMAX) { a[0] *= AMAX / mag; a[1] *= AMAX / mag; }
                t.push(i * DT); acc.push(Math.hypot(a[0], a[1]));
                tip.push([p[0], p[1]]); dev.push(g.dist(p) * 1000);
                if (i < nMove && s[i] <= g.corner) tCorner = i * DT;
                for (let k = 0; k < 2; k++) {
                    v[k] += a[k] * DT;
                    p[k] += v[k] * DT;
                }
            }
            // 角の前後（-0.2〜+0.5 s）での最大のずれと、上限に張り付いた時間
            let devMax = 0, sat = 0;
            for (let i = 0; i < n; i++) {
                if (acc[i] >= AMAX - 1e-6) sat += DT;
                if (t[i] < tCorner - 0.2 || t[i] > tCorner + 0.5) continue;
                devMax = Math.max(devMax, dev[i]);
            }
            return { g, t, acc, dev, tip, tCorner, tMove: (nMove - 1) * DT, T: t[n - 1], devMax, sat };
        }
        // ---- ここまでシミュレーション ----

        const state = { mode: 'sharp', r: 0.08, c: 0.3 };
        const $ = (id) => document.getElementById(id);
        const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        let sim = null, base = null, animStart = performance.now();

        function setupCanvas(canvas) {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = Math.round(rect.width * dpr);
            canvas.height = Math.round(rect.height * dpr);
            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            return { ctx, w: rect.width, h: rect.height };
        }

        function drawTop(i) {
            const { ctx, w, h } = setupCanvas($('top'));
            ctx.clearRect(0, 0, w, h);
            const span = L + 0.1, scale = Math.min((w - 20) / span, (h - 20) / span);
            const ox = (w - span * scale) / 2 + 0.03 * scale, oy = h - 10 - 0.03 * scale;
            const P = ([x, y]) => [ox + x * scale, oy - y * scale];
            const line = (pts, color, width, dash) => {
                ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []);
                ctx.beginPath();
                pts.forEach((q, k) => { const [X, Y] = P(q); k ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); });
                ctx.stroke(); ctx.setLineDash([]);
            };
            // 経路
            const g = sim.g, pts = [];
            for (let k = 0; k <= 200; k++) pts.push(g.at(g.total * k / 200));
            line(pts, css('--path'), 8, []);
            ctx.globalAlpha = 1;
            // 直角のまま通過した場合の通り道（比較）
            if (state.mode !== 'sharp') line(base.tip.filter((_, k) => k % 10 === 0), css('--ref'), 1.5, [4, 4]);
            // 手先の通り道
            line(sim.tip.slice(0, i + 1).filter((_, k) => k % 10 === 0), css('--tip'), 2, []);
            const [X, Y] = P(sim.tip[i]);
            ctx.fillStyle = css('--tip');
            ctx.beginPath(); ctx.arc(X, Y, 6, 0, Math.PI * 2); ctx.fill();
            ctx.font = '11px "Noto Sans JP", sans-serif';
            ctx.fillStyle = css('--muted');
            const [sx, sy] = P([0, 0]), [ex, ey] = P([L, L]);
            ctx.fillText('スタート', sx - 10, sy + 16 > h ? sy - 8 : sy + 16);
            ctx.fillText('ゴール', ex - 44, ey + 4);
            ctx.fillText('100 mm', sx + 4, sy - 22);
            ctx.strokeStyle = css('--muted'); ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(sx + 4, sy - 16); ctx.lineTo(sx + 4 + 0.1 * scale, sy - 16); ctx.stroke();
        }

        function drawPlot(id, series, tMax, yMax, cursor, extra) {
            const { ctx, w, h } = setupCanvas($(id));
            const left = 30, right = 6, top = 6, bottom = 14;
            const pw = w - left - right, ph = h - top - bottom;
            const X = (t) => left + t / tMax * pw;
            const Y = (y) => top + ph - Math.min(yMax, Math.max(0, y)) / yMax * ph;
            ctx.clearRect(0, 0, w, h);
            ctx.font = '10px "Noto Sans JP", sans-serif';
            ctx.fillStyle = css('--muted'); ctx.strokeStyle = css('--border'); ctx.lineWidth = 1;
            for (let k = 0; k <= 2; k++) {
                const y = yMax * k / 2;
                ctx.beginPath(); ctx.moveTo(left, Y(y)); ctx.lineTo(w - right, Y(y)); ctx.stroke();
                ctx.fillText(y.toFixed(yMax < 10 ? 1 : 0), 2, Y(y) + 3);
            }
            for (let tt = 0; tt <= tMax; tt += 0.5) ctx.fillText(tt.toFixed(1), X(tt) - 6, h - 2);
            // 角を通る時刻
            ctx.strokeStyle = css('--path'); ctx.setLineDash([2, 3]);
            ctx.beginPath(); ctx.moveTo(X(sim.tCorner), top); ctx.lineTo(X(sim.tCorner), top + ph); ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = css('--path');
            ctx.fillText('角', X(sim.tCorner) + 3, top + 10);
            if (extra) extra(ctx, X, Y);
            series.forEach(sr => {
                ctx.strokeStyle = sr.color; ctx.lineWidth = sr.width || 2; ctx.setLineDash(sr.dash || []);
                ctx.beginPath();
                for (let k = 0; k < sr.t.length; k += 4) {
                    k ? ctx.lineTo(X(sr.t[k]), Y(sr.y[k])) : ctx.moveTo(X(sr.t[k]), Y(sr.y[k]));
                }
                ctx.stroke();
            });
            ctx.setLineDash([]);
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.beginPath(); ctx.moveTo(X(cursor), top); ctx.lineTo(X(cursor), top + ph); ctx.stroke();
        }

        function frame(now) {
            const tt = Math.min(Math.max(0, (now - animStart) / 1000) % (sim.T + 0.4), sim.T);
            const i = Math.min(sim.t.length - 1, Math.round(tt / DT));
            drawTop(i);
            const tMax = Math.max(sim.T, base.T);
            drawPlot('acc', [{ t: sim.t, y: sim.acc, color: css('--acc') }], tMax, AMAX * 1.25, tt, (ctx, X, Y) => {
                ctx.strokeStyle = css('--limit'); ctx.setLineDash([5, 4]);
                ctx.beginPath(); ctx.moveTo(X(0), Y(AMAX)); ctx.lineTo(X(tMax), Y(AMAX)); ctx.stroke();
                ctx.setLineDash([]);
            });
            const dMax = Math.max(5, Math.ceil(base.devMax / 10) * 10);
            const series = [{ t: sim.t, y: sim.dev, color: css('--tip') }];
            if (state.mode !== 'sharp') series.unshift({ t: base.t, y: base.dev, color: css('--ref'), width: 1.5, dash: [5, 4] });
            drawPlot('dev', series, tMax, dMax, tt);
            requestAnimationFrame(frame);
        }

        function recompute() {
            state.r = parseFloat($('r').value) / 1000;
            state.c = parseFloat($('c').value) / 100;
            $('r-val').textContent = `${(state.r * 1000).toFixed(0)} mm`;
            $('r').disabled = state.mode !== 'round';
            $('c-val').textContent = `${(state.c * 100).toFixed(0)}%（サーボ帯域 ${(5 + 15 * state.c).toFixed(0)} Hz）`;
            $('amax-val').textContent = `${AMAX} m/s²`;
            sim = simulate(state.mode, state.r, state.c);
            base = simulate('sharp', 0, state.c);
            $('s-dev').textContent = `${sim.devMax.toFixed(1)} mm`;
            $('s-sat').textContent = `${sim.sat.toFixed(2)} s`;
            $('s-time').textContent = `${sim.tMove.toFixed(2)} s`;
            const rMin = (R_MIN * 1000).toFixed(0);
            $('note').textContent =
                state.mode === 'sharp' ? '直角を止まらずに曲がるには無限の加速度が要る → 上限に張り付き、制御を強くしても角での行き過ぎは減らない'
                : state.mode === 'stop' ? '角で止まれば経路は守れるが、止まって動き出す分だけ動作時間が伸びる'
                : state.r < R_MIN ? `半径がまだ小さい：曲がるのに V²/r が上限を超える（r ≥ ${rMin} mm で収まる）`
                : '角を丸めると必要な加速度が V²/r に収まり、弱い制御でも経路からほとんどずれない';
            animStart = performance.now();
        }

        document.querySelectorAll('#mode button').forEach(btn => btn.addEventListener('click', () => {
            document.querySelectorAll('#mode button').forEach(b => b.classList.toggle('active', b === btn));
            state.mode = btn.dataset.v;
            recompute();
        }));
        ['r', 'c'].forEach(id => $(id).addEventListener('input', recompute));
        window.addEventListener('resize', () => { animStart = performance.now(); });
        recompute();
        requestAnimationFrame(frame);
    </script>
</body>
</html>
