<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TFの時間管理</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --border: #334155; --text: #e2e8f0; --muted: #94a3b8; }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 8px; background: var(--bg); color: var(--text);
            font-family: 'Noto Sans JP', sans-serif; font-size: 13px; overscroll-behavior: none;
        }
        .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 8px; margin-bottom: 6px; }
        h3 { margin: 0 0 4px; font-size: 13px; color: var(--muted); font-weight: 400; }
        canvas { width: 100%; display: block; background: #0b1220; border-radius: 6px; }
        #cvArm { height: 175px; }
        #cvTl { height: 104px; }
        .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; margin-top: 4px; }
        .legend span::before { content: '●'; margin-right: 4px; }
        .g::before { color: #4ade80; } .r::before { color: #f87171; } .y::before { color: #fbbf24; }
        .ctrl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
        .ctrl input { flex: 1; min-width: 120px; }
        button {
            background: #0b1220; color: var(--text); border: 1px solid #475569; border-radius: 6px;
            padding: 3px 10px; font-family: inherit; font-size: 12px; cursor: pointer;
        }
        .msg { font-size: 12.5px; margin-top: 4px; min-height: 2.6em; }
        .msg b { color: #fbbf24; }
    </style>
</head>
<body>
    <div class="panel">
        <h3>力センサでタッチして物の高さを測る（触れたらすぐ引き上げる）</h3>
        <canvas id="cvArm"></canvas>
        <div class="legend">
            <span class="y">触れた点（本当の高さ）</span>
            <span class="r">届いた時の最新の姿勢で記録</span>
            <span class="g">センサの時刻の姿勢で記録（TF）</span>
        </div>
        <div class="ctrl">
            力センサの値が届くまでの遅れ <input type="range" id="delay" min="0" max="0.3" step="0.01" value="0.12"> <span id="delayV"></span>
            <button id="pause">一時停止</button>
        </div>
        <div class="msg" id="msg"></div>
    </div>
    <div class="panel">
        <h3>TFバッファ（時刻つきで保存。右端が「いま」）</h3>
        <canvas id="cvTl"></canvas>
    </div>

    <script>
        // 単位は m。2 リンクのアームを横から見た図。手先を下ろして物に触れたら、すぐ引き上げる
        const LINK = [0.45, 0.40];
                const Z_TOP = 0.42, VZ = 0.25;  // 下ろし始める高さと、上下の速さ [m/s]
        const VX = 0.06;                // 測りながら横にも動く [m/s]
        const OBJ = [                   // 机の上の物（x の範囲と高さ）
            { x0: 0.30, x1: 0.40, h: 0.16 },
            { x0: 0.45, x1: 0.55, h: 0.08 },
            { x0: 0.58, x1: 0.66, h: 0.22 },
        ];
        const BUFFER = 3.0;             // 表示するバッファの長さ [s]（ROS の既定は 10 s）
        const JS_DT = 0.05;             // 表示上の /joint_states の間隔（実機の UR は 2 ms = 500 Hz）

        // 1 回の測定 = 下ろす → 触れたら引き上げる → 次の物の上へ移動（TRANSIT 秒）
        const TRANSIT = 0.6, START = [0];
        const down = (k) => (Z_TOP - objOf(k).h) / VZ;
        for (let k = 0; k < 500; k++) START.push(START[k] + 2 * down(k) + TRANSIT);
        function objOf(k) { return OBJ[((k % OBJ.length) + OBJ.length) % OBJ.length]; }
        function cycleOf(t) { let k = 0; while (START[k + 1] <= t) k++; return k; }
        function contactTime(k) { return START[Math.max(0, k)] + down(k); }
        const xAt = (k, ts) => (objOf(k).x0 + objOf(k).x1) / 2 + VX * (ts - down(k));

        // 手先の位置（時間の関数）
        function tip(t) {
            const k = cycleOf(t), o = objOf(k), td = down(k), ts = t - START[k];
            if (ts < td) return [xAt(k, ts), Z_TOP - VZ * ts];
            if (ts < 2 * td) return [xAt(k, ts), o.h + VZ * (ts - td)];
            const w = (ts - 2 * td) / TRANSIT, x0 = xAt(k, 2 * td), x1 = xAt(k + 1, 0);
            return [x0 + (x1 - x0) * w, Z_TOP];
        }
        // 逆運動学（肘を上に）。実機では関節角が /joint_states で届き、それが TF になる
        function q(t) {
            const [x, z] = tip(t);
            const c2 = (x * x + z * z - LINK[0] ** 2 - LINK[1] ** 2) / (2 * LINK[0] * LINK[1]);
            const q2 = -Math.acos(Math.max(-1, Math.min(1, c2)));
            const q1 = Math.atan2(z, x) - Math.atan2(LINK[1] * Math.sin(q2), LINK[0] + LINK[1] * Math.cos(q2));
            return [q1, q2];
        }
        function fk(qq) {
            const e = [LINK[0] * Math.cos(qq[0]), LINK[0] * Math.sin(qq[0])];
            const a = qq[0] + qq[1];
            return { elbow: e, p: [e[0] + LINK[1] * Math.cos(a), e[1] + LINK[1] * Math.sin(a)] };
        }
        // TF の lookup：前後の /joint_states を補間して、その時刻の姿勢を返す
        function tfLookup(t) {
            const s0 = Math.floor(t / JS_DT) * JS_DT, w = (t - s0) / JS_DT;
            const a = q(s0), b = q(s0 + JS_DT);
            return [a[0] * (1 - w) + b[0] * w, a[1] * (1 - w) + b[1] * w];
        }

        function setup(cv) {
            const dpr = window.devicePixelRatio || 1;
            const r = cv.getBoundingClientRect();
            cv.width = r.width * dpr; cv.height = r.height * dpr;
            const ctx = cv.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            return { ctx, w: r.width, h: r.height };
        }

        let simT = 0, last = performance.now(), paused = false;
        const delayEl = document.getElementById('delay');

        function draw() {
            const delay = +delayEl.value;
            document.getElementById('delayV').textContent = (delay * 1000).toFixed(0) + ' ms';
            // 直近の接触と、その値が届く時刻
            let k = cycleOf(simT);
            if (simT < contactTime(k)) k -= 1;
            const tc = contactTime(k), arrive = tc + delay, arrived = simT >= arrive;
            const o = objOf(k);

            // ---------- アーム ----------
            {
                const { ctx, w, h } = setup(document.getElementById('cvArm'));
                const scale = Math.min(w / 1.05, h / 0.58);
                const ox = w * 0.5 - 0.38 * scale, oy = h - 14;
                const to = p => [ox + p[0] * scale, oy - p[1] * scale];
                ctx.clearRect(0, 0, w, h);
                // 机と物
                ctx.fillStyle = '#334155';
                const [tx0, ty] = to([-0.1, 0]), [tx1] = to([0.75, 0]);
                ctx.fillRect(tx0, ty, tx1 - tx0, 6);
                OBJ.forEach(ob => {
                    const [a, b] = to([ob.x0, ob.h]), [c, d] = to([ob.x1, 0]);
                    ctx.fillStyle = ob === o ? '#64748b' : '#475569';
                    ctx.fillRect(a, b, c - a, d - b);
                });
                // アーム（いま）
                const now = fk(q(simT));
                ctx.fillStyle = '#475569'; const b = to([0, 0]); ctx.fillRect(b[0] - 16, b[1] - 8, 32, 8);
                ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 8; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(...to([0, 0])); ctx.lineTo(...to(now.elbow)); ctx.lineTo(...to(now.p)); ctx.stroke();
                const cp = to(now.p);
                ctx.fillStyle = '#7dd3fc'; ctx.fillRect(cp[0] - 6, cp[1] - 4, 12, 8);

                const msg = document.getElementById('msg');
                if (simT - tc < 0.5) {
                    // 触れた点
                    const pc = to(tip(tc));
                    ctx.beginPath(); ctx.arc(pc[0], pc[1], 6, 0, 2 * Math.PI); ctx.fillStyle = '#fbbf24'; ctx.fill();
                }
                if (arrived) {
                    const wrong = fk(q(arrive)).p;          // 値が届いた時の最新の姿勢
                    const right = fk(tfLookup(tc)).p;      // センサの時刻の姿勢（TF）
                    const wp = to(wrong), rp = to(right), pc = to(tip(tc));
                    ctx.beginPath(); ctx.arc(pc[0], pc[1], 6, 0, 2 * Math.PI); ctx.fillStyle = '#fbbf24'; ctx.fill();
                    ctx.strokeStyle = '#f87171'; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(wp[0] - 7, wp[1] - 7); ctx.lineTo(wp[0] + 7, wp[1] + 7);
                    ctx.moveTo(wp[0] + 7, wp[1] - 7); ctx.lineTo(wp[0] - 7, wp[1] + 7); ctx.stroke();
                    ctx.strokeStyle = '#4ade80';
                    ctx.beginPath(); ctx.arc(rp[0], rp[1], 12, 0, 2 * Math.PI); ctx.stroke();
                    const errMm = (wrong[1] - o.h) * 1000;
                    msg.innerHTML =
                        `t=${tc.toFixed(2)}s に接触 → 値が届いたのは t=${arrive.toFixed(2)}s。最新の姿勢で記録すると高さが <b style="color:#f87171">${errMm.toFixed(0)} mm 高く</b>なる。` +
                        `TFで<b>センサの時刻 ${tc.toFixed(2)}s の姿勢</b>を引けば ${(o.h * 1000).toFixed(0)} mm と正しく測れる`;
                } else {
                    msg.innerHTML = `t=${tc.toFixed(2)}s に接触 → 力センサの値はまだ届いていない（その間もアームは引き上げている）`;
                }
                ctx.fillStyle = '#94a3b8'; ctx.font = '12px sans-serif';
                ctx.fillText(`いま t = ${simT.toFixed(2)} s`, 10, 18);
            }

            // ---------- タイムライン ----------
            {
                const { ctx, w, h } = setup(document.getElementById('cvTl'));
                ctx.clearRect(0, 0, w, h);
                const left = 120, right = w - 10;
                const X = t => left + (t - (simT - BUFFER - 0.6)) / (BUFFER + 0.6) * (right - left);
                const rowY = i => 20 + i * 30;
                ctx.fillStyle = 'rgba(148,163,184,0.12)';
                ctx.fillRect(left, 6, X(simT - BUFFER) - left, h - 30);
                ctx.fillStyle = '#64748b'; ctx.font = '11px sans-serif';
                ctx.fillText('古いデータは削除', left + 4, h - 10);
                // /joint_states → TF
                ctx.fillStyle = '#cbd5e1'; ctx.font = '12px sans-serif';
                ctx.fillText('関節角 → TF', 6, rowY(0) + 4);
                ctx.fillStyle = '#94a3b8'; ctx.font = '10px sans-serif';
                ctx.fillText('（実機は 500 Hz）', 6, rowY(0) + 16);
                for (let s = Math.floor(simT / JS_DT) * JS_DT; s > simT - BUFFER - 0.6; s -= JS_DT) {
                    ctx.fillStyle = s < simT - BUFFER ? '#334155' : '#4ade80';
                    ctx.fillRect(X(s) - 1, rowY(0) - 7, 2, 14);
                }
                // 力センサの接触イベント
                ctx.fillStyle = '#cbd5e1'; ctx.font = '12px sans-serif';
                ctx.fillText('力センサ（接触）', 6, rowY(1) + 4);
                ctx.strokeStyle = '#334155'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(left, rowY(1)); ctx.lineTo(right, rowY(1)); ctx.stroke();
                for (let j = k; j > k - 3; j--) {
                    const s = contactTime(j);
                    if (s < simT - BUFFER - 0.6) continue;
                    ctx.fillStyle = '#fbbf24';
                    ctx.fillRect(X(s) - 2, rowY(1) - 7, 4, 14);
                }
                // 「いま」
                ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.moveTo(X(simT), 6); ctx.lineTo(X(simT), h - 24); ctx.stroke();
                ctx.fillStyle = '#e2e8f0'; ctx.font = '11px sans-serif'; ctx.fillText('いま', X(simT) - 26, h - 10);
                // 値が届いたら、接触の時刻（センサのスタンプ）で lookup
                if (arrived) {
                    ctx.strokeStyle = '#f87171'; ctx.lineWidth = 1.5; ctx.setLineDash([2, 3]);
                    ctx.beginPath(); ctx.moveTo(X(arrive), 6); ctx.lineTo(X(arrive), h - 24); ctx.stroke();
                    ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
                    ctx.beginPath(); ctx.moveTo(X(tc), 6); ctx.lineTo(X(tc), h - 24); ctx.stroke(); ctx.setLineDash([]);
                    ctx.fillStyle = '#4ade80'; ctx.textAlign = 'right';
                    ctx.fillText('センサの時刻で lookup →', X(tc) - 4, rowY(1) + 20);
                    ctx.textAlign = 'left';
                }
            }
        }

        function loop(now) {
            const dt = Math.min(0.05, (now - last) / 1000);
            last = now;
            if (!paused) simT += dt * 0.5;   // 見やすいよう 0.5 倍速
            draw();
            requestAnimationFrame(loop);
        }
        document.getElementById('pause').onclick = e => {
            paused = !paused;
            e.target.textContent = paused ? '再開' : '一時停止';
        };
        delayEl.addEventListener('input', draw);
        window.addEventListener('resize', draw);
        simT = START[3] + 0.3;
        draw();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
