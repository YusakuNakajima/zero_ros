<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>軌道補間ビジュアライザー (台形補間対応)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.1/math.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .recharts-wrapper {
            width: 100% !important;
            height: 100% !important;
        }
        .recharts-surface {
            width: 100%;
            height: 100%;
        }
        /* Custom slider styles */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            background: #475569; /* bg-slate-600 */
            border-radius: 5px;
            outline: none;
            opacity: 0.7;
            transition: opacity .2s;
        }
        input[type="range"]:hover {
            opacity: 1;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #67e8f9; /* cyan-300 */
            cursor: pointer;
            border-radius: 50%;
        }
        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: #67e8f9; /* cyan-300 */
            cursor: pointer;
            border-radius: 50%;
        }
    </style>
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-900 text-white font-[Noto Sans JP]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, Label } = window.Recharts;

        // --- Polynomial Solver Functions ---
        function solveLinear(t0, tf, q0, qf) {
            if (tf - t0 === 0) return [0, 0, 0, 0, 0, q0];
            const c1 = (qf - q0) / (tf - t0);
            const c0 = q0 - c1 * t0;
            return [0, 0, 0, 0, c1, c0];
        }
        function solveCubic(t0, tf, q0, qf, v0, vf) {
            try {
                const A = math.matrix([[Math.pow(t0, 3), Math.pow(t0, 2), t0, 1], [Math.pow(tf, 3), Math.pow(tf, 2), tf, 1], [3 * Math.pow(t0, 2), 2 * t0, 1, 0], [3 * Math.pow(tf, 2), 2 * tf, 1, 0]]);
                const b = math.matrix([q0, qf, v0, vf]);
                const coeffs = math.lusolve(A, b).toArray().flat();
                return [0, 0, ...coeffs];
            } catch (error) { return [0, 0, 0, 0, 0, 0]; }
        }
        function solveQuintic(t0, tf, q0, qf, v0, vf, a0, af) {
            try {
                const A = math.matrix([[Math.pow(t0, 5), Math.pow(t0, 4), Math.pow(t0, 3), Math.pow(t0, 2), t0, 1], [Math.pow(tf, 5), Math.pow(tf, 4), Math.pow(tf, 3), Math.pow(tf, 2), tf, 1], [5 * Math.pow(t0, 4), 4 * Math.pow(t0, 3), 3 * Math.pow(t0, 2), 2 * t0, 1, 0], [5 * Math.pow(tf, 4), 4 * Math.pow(tf, 3), 3 * Math.pow(tf, 2), 2 * tf, 1, 0], [20 * Math.pow(t0, 3), 12 * Math.pow(t0, 2), 6 * t0, 2, 0, 0], [20 * Math.pow(tf, 3), 12 * Math.pow(tf, 2), 6 * tf, 2, 0, 0]]);
                const b = math.matrix([q0, qf, v0, vf, a0, af]);
                const coeffs = math.lusolve(A, b).toArray().flat();
                return coeffs;
            } catch (error) { return [0, 0, 0, 0, 0, 0]; }
        }
        function calculatePolynomialTrajectory(coeffs) {
            const [c5, c4, c3, c2, c1, c0] = coeffs;
            const q = t => c5*t**5 + c4*t**4 + c3*t**3 + c2*t**2 + c1*t + c0;
            const v = t => 5*c5*t**4 + 4*c4*t**3 + 3*c3*t**2 + 2*c2*t + c1;
            const a = t => 20*c5*t**3 + 12*c4*t**2 + 6*c3*t + 2*c2;
            return { q, v, a };
        }

        // NEW: Trapezoidal Trajectory Calculation
        function calculateTrapezoidalTrajectory(t0, tf, q0, qf, v_max_abs) {
            const T = tf - t0;
            const H = qf - q0;

            if (T <= 0 || H === 0) return t => ({ q: (t < tf ? q0 : qf), v: 0, a: 0 });
            
            const sgn = Math.sign(H);
            const H_abs = Math.abs(H);
            
            const v_avg = H_abs / T;

            // If max velocity is not achievable, it becomes a triangular profile.
            // The peak velocity of a triangular profile is 2 * v_avg.
            const v_peak_triangular = 2 * v_avg;

            let a_abs, tb, v_cruise_abs;

            if (v_max_abs >= v_peak_triangular) {
                // Triangular profile
                tb = T / 2.0;
                a_abs = 2 * v_peak_triangular / T;
                v_cruise_abs = v_peak_triangular;
            } else {
                // Trapezoidal profile
                if (v_max_abs <= v_avg) {
                    // This is physically impossible to reach in time T.
                    // Fallback to the fastest possible profile (triangular).
                    tb = T / 2.0;
                    a_abs = 2 * v_avg / tb;
                    v_cruise_abs = v_avg * 2;
                } else {
                    a_abs = v_max_abs**2 / (v_max_abs * T - H_abs);
                    tb = v_max_abs / a_abs;
                    v_cruise_abs = v_max_abs;
                }
            }

            const a = sgn * a_abs;
            const v_cruise = sgn * v_cruise_abs;

            return (t) => {
                const tau = t - t0;
                if (tau >= 0 && tau < tb) { // Acceleration
                    return { q: q0 + 0.5 * a * tau**2, v: a * tau, a: a };
                } else if (tau >= tb && tau < T - tb) { // Cruise
                    const q_accel_end = q0 + 0.5 * a * tb**2;
                    return { q: q_accel_end + v_cruise * (tau - tb), v: v_cruise, a: 0 };
                } else if (tau >= T - tb && tau <= T) { // Deceleration
                    const tau_d = tau - (T - tb);
                    const q_decel_start = (q0 + 0.5 * a * tb**2) + v_cruise * (T - 2*tb);
                    return { q: q_decel_start + v_cruise * tau_d - 0.5 * a * tau_d**2, v: v_cruise - a * tau_d, a: -a };
                } else { // Outside time range
                    return { q: (t < t0 ? q0 : qf), v: 0, a: 0 };
                }
            };
        }


        // --- UI Components ---
        const CustomTooltip = ({ active, payload, label }) => {
            if (active && payload && payload.length) {
                return (
                    <div className="bg-slate-700/80 backdrop-blur-sm p-4 border border-slate-500 rounded-lg shadow-lg">
                        <p className="label font-bold text-cyan-300">{`時間 : ${label.toFixed(2)} s`}</p>
                        {payload.map(pld => (<p key={pld.dataKey} style={{ color: pld.color }}>{`${pld.name}: ${pld.value.toFixed(3)}`}</p>))}
                    </div>
                );
            }
            return null;
        };
        
        const SliderField = ({ label, value, onChange, min, max, step, unit }) => (
            <div className="space-y-2">
                <div className="flex justify-between items-baseline">
                    <label className="block text-sm font-medium text-slate-300">{label} <span className="text-xs text-slate-400">{unit}</span></label>
                    <span className="text-sm font-mono bg-slate-700 px-2 py-1 rounded w-20 text-center">{value.toFixed(2)}</span>
                </div>
                <input type="range" min={min} max={max} step={step} value={value} onChange={e => onChange(parseFloat(e.target.value))} className="w-full" />
            </div>
        );

        const VisibilityToggle = ({ label, color, checked, onChange }) => (
            <label className="flex items-center justify-between cursor-pointer group">
                <span className="text-slate-300 group-hover:text-white transition-colors" style={{ color: checked ? color : '#94a3b8' }}>{label}</span>
                <div className="relative">
                    <input type="checkbox" checked={checked} onChange={onChange} className="sr-only" />
                    <div className={`w-12 h-6 rounded-full shadow-inner transition-colors ${checked ? 'bg-cyan-500' : 'bg-slate-600'}`}></div>
                    <div className={`absolute top-1 left-1 w-4 h-4 bg-white rounded-full shadow transform transition-transform ${checked ? 'translate-x-6' : 'translate-x-0'}`}></div>
                </div>
            </label>
        );


        const App = () => {
            const [params, setParams] = useState({
                t0: 0, tf: 5,
                q0: 0, qf: 10,
                v0: 0, vf: 0,
                a0: 0, af: 0,
                v_max: 3.0, // New param for trapezoidal
            });
            
            const [visibility, setVisibility] = useState({
                linear: true,
                trapezoidal: true, // New visibility
                cubic: true,
                quintic: true,
            });

            const handleParamChange = (key, value) => {
                setParams(prev => {
                    const newParams = { ...prev, [key]: value };
                    if (key === 't0' && value >= newParams.tf) { newParams.tf = value + 0.1; }
                    if (key === 'tf' && value <= newParams.t0) { newParams.t0 = value - 0.1; }
                    return newParams;
                });
            };

            const plotData = useMemo(() => {
                const { t0, tf, q0, qf, v0, vf, a0, af, v_max } = params;
                if (tf <= t0) return [];

                const linearCoeffs = solveLinear(t0, tf, q0, qf);
                const cubicCoeffs = solveCubic(t0, tf, q0, qf, v0, vf);
                const quinticCoeffs = solveQuintic(t0, tf, q0, qf, v0, vf, a0, af);

                const traj1 = calculatePolynomialTrajectory(linearCoeffs);
                const traj3 = calculatePolynomialTrajectory(cubicCoeffs);
                const traj5 = calculatePolynomialTrajectory(quinticCoeffs);
                const traj2Func = calculateTrapezoidalTrajectory(t0, tf, q0, qf, v_max);


                const data = [];
                const steps = 100;
                for (let i = 0; i <= steps; i++) {
                    const t = t0 + (tf - t0) * i / steps;
                    const traj2 = traj2Func(t);
                    data.push({
                        time: t,
                        pos1: traj1.q(t), vel1: traj1.v(t), acc1: traj1.a(t),
                        pos2: traj2.q,    vel2: traj2.v,    acc2: traj2.a,
                        pos3: traj3.q(t), vel3: traj3.v(t), acc3: traj3.a(t),
                        pos5: traj5.q(t), vel5: traj5.v(t), acc5: traj5.a(t),
                    });
                }
                return data;
            }, [params]);
            
            const renderChart = (title, yAxisLabel, dataKeys, colors) => (
                <div className="bg-slate-800 p-4 rounded-lg shadow-xl aspect-video flex flex-col">
                    <h3 className="text-lg font-bold text-center mb-4 text-cyan-300">{title}</h3>
                    <div className="flex-grow">
                        <ResponsiveContainer width="100%" height="100%">
                            <LineChart data={plotData} margin={{ top: 5, right: 20, left: 25, bottom: 20 }}>
                                <CartesianGrid strokeDasharray="3 3" stroke="#475569" />
                                <XAxis dataKey="time" stroke="#94a3b8" type="number" domain={[params.t0, params.tf]}>
                                    <Label value="時間 [s]" offset={-15} position="insideBottom" fill="#e2e8f0" />
                                </XAxis>
                                <YAxis stroke="#94a3b8" domain={['auto', 'auto']}>
                                     <Label value={yAxisLabel} angle={-90} position="insideLeft" style={{ textAnchor: 'middle', fill: '#e2e8f0' }} />
                                </YAxis>
                                <Tooltip content={<CustomTooltip />} />
                                <Legend wrapperStyle={{paddingTop: '20px'}} />
                                {visibility.linear && <Line type="monotone" dataKey={dataKeys[0]} name="1次 (線形)" stroke={colors[0]} strokeWidth={2} dot={false} />}
                                {visibility.trapezoidal && <Line type="monotone" dataKey={dataKeys[1]} name="台形" stroke={colors[1]} strokeWidth={2} dot={false} />}
                                {visibility.cubic && <Line type="monotone" dataKey={dataKeys[2]} name="3次 (Cubic)" stroke={colors[2]} strokeWidth={2} dot={false} />}
                                {visibility.quintic && <Line type="monotone" dataKey={dataKeys[3]} name="5次 (Quintic)" stroke={colors[3]} strokeWidth={2} dot={false} />}
                            </LineChart>
                        </ResponsiveContainer>
                    </div>
                </div>
            );

            return (
                <div className="container mx-auto p-4 md:p-8">
                    <header className="text-center mb-8">
                        <h1 className="text-4xl font-bold text-white">軌道補間ビジュアライザー</h1>
                        <p className="text-slate-400 mt-2">各種補間方式による軌道の滑らかさの比較</p>
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
                        <div className="lg:col-span-1 bg-slate-800 p-6 rounded-lg shadow-xl flex flex-col space-y-6">
                            <div>
                                <h2 className="text-2xl font-bold mb-4 border-b-2 border-slate-600 pb-2 text-cyan-300">共通設定</h2>
                                <div className="space-y-4">
                                    <SliderField label="終了時間" unit="s" value={params.tf} onChange={v => handleParamChange('tf', v)} min={0.1} max={10} step={0.1} />
                                    <SliderField label="開始位置" unit="rad" value={params.q0} onChange={v => handleParamChange('q0', v)} min={-10} max={10} step={0.5} />
                                    <SliderField label="終了位置" unit="rad" value={params.qf} onChange={v => handleParamChange('qf', v)} min={-10} max={10} step={0.5} />
                                    <h3 className="text-lg font-semibold pt-4 text-slate-200">3次/5次用 設定</h3>
                                    <SliderField label="開始速度" unit="rad/s" value={params.v0} onChange={v => handleParamChange('v0', v)} min={-10} max={10} step={0.2} />
                                    <SliderField label="終了速度" unit="rad/s" value={params.vf} onChange={v => handleParamChange('vf', v)} min={-10} max={10} step={0.2} />
                                    <h3 className="text-lg font-semibold pt-2 text-slate-200">5次用 設定</h3>
                                    <SliderField label="開始加速度" unit="rad/s²" value={params.a0} onChange={v => handleParamChange('a0', v)} min={-10} max={10} step={0.2} />
                                    <SliderField label="終了加速度" unit="rad/s²" value={params.af} onChange={v => handleParamChange('af', v)} min={-10} max={10} step={0.2} />
                                    <h3 className="text-lg font-semibold pt-2 text-slate-200">台形補間用 設定</h3>
                                    <SliderField label="最大速度" unit="rad/s" value={params.v_max} onChange={v => handleParamChange('v_max', v)} min={0.1} max={10} step={0.1} />
                                </div>
                            </div>
                            
                            <div>
                                <h2 className="text-2xl font-bold mb-4 border-b-2 border-slate-600 pb-2 text-cyan-300">表示切替</h2>
                                <div className="space-y-3">
                                    <VisibilityToggle label="1次 (線形)" color="#facc15" checked={visibility.linear} onChange={() => setVisibility(v => ({...v, linear: !v.linear}))} />
                                    <VisibilityToggle label="台形" color="#60a5fa" checked={visibility.trapezoidal} onChange={() => setVisibility(v => ({...v, trapezoidal: !v.trapezoidal}))} />
                                    <VisibilityToggle label="3次 (Cubic)" color="#4ade80" checked={visibility.cubic} onChange={() => setVisibility(v => ({...v, cubic: !v.cubic}))} />
                                    <VisibilityToggle label="5次 (Quintic)" color="#f472b6" checked={visibility.quintic} onChange={() => setVisibility(v => ({...v, quintic: !v.quintic}))} />
                                </div>
                            </div>

                            <div className="text-sm text-slate-400 space-y-3 mt-auto">
                                <p className="!mt-4 pt-3 border-t border-slate-700">
                                    <strong className="text-sky-400">注:</strong> 1次補間では、始点と終点で理論上は無限大の加速度が発生しますが、グラフ上では区間内の値である0として表示されます。
                                </p>
                            </div>
                        </div>

                        <div className="lg:col-span-3 grid grid-cols-1 gap-6">
                            {renderChart("位置", "位置 [rad]", ["pos1", "pos2", "pos3", "pos5"], ["#facc15", "#60a5fa", "#4ade80", "#f472b6"])}
                            {renderChart("速度", "速度 [rad/s]", ["vel1", "vel2", "vel3", "vel5"], ["#facc15", "#60a5fa", "#4ade80", "#f472b6"])}
                            {renderChart("加速度", "加速度 [rad/s²]", ["acc1", "acc2", "acc3", "acc5"], ["#facc15", "#60a5fa", "#4ade80", "#f472b6"])}
                        </div>
                    </div>
                     <footer className="text-center mt-8 text-slate-500 text-sm">
                        <p>Powered by React, Recharts, and math.js</p>
                    </footer>
                </div>
            );
        };

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
