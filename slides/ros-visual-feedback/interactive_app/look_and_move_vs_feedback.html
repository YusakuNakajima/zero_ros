<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>見てから動く vs 見ながら動く</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #111827; color: #e5e7eb; font-family: 'Noto Sans JP', sans-serif; }
        .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
        h1 { font-size: 1.5rem; color: #a5b4fc; margin: 0 0 4px; text-align: center; }
        .sub { color: #9ca3af; text-align: center; margin: 0 0 14px; font-size: 0.9rem; }
        .main { display: grid; grid-template-columns: 1.5fr 1fr; gap: 12px; }
        canvas { width: 100%; display: block; background: #0b1220; border-radius: 8px; cursor: crosshair; }
        .side { display: flex; flex-direction: column; gap: 10px; }
        .box { background: #1f2937; border-radius: 8px; padding: 8px 12px; }
        .box h3 { margin: 0 0 6px; font-size: 0.85rem; color: #fca5a5; }
        label { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; margin: 4px 0; }
        label span.n { width: 8.5em; flex: none; white-space: nowrap; }
        label span.v { width: 3.8em; text-align: right; color: #fde68a; flex: none; }
        input[type=range] { flex: 1; min-width: 0; }
        .modes { display: flex; gap: 6px; }
        button { flex: 1; background: #374151; color: #e5e7eb; border: 1px solid #4b5563; border-radius: 6px; padding: 6px 4px; font-size: 0.8rem; cursor: pointer; font-family: inherit; }
        button:hover { background: #4b5563; }
        button.on { background: #4f46e5; border-color: #6366f1; color: #fff; }
        #go { background: #059669; border-color: #10b981; color: #fff; font-weight: 700; }
        .result { text-align: center; }
        #err { font-size: 1.6rem; font-weight: 700; }
        #msg { font-size: 0.78rem; color: #9ca3af; margin-top: 2px; line-height: 1.5; }
        .ok { color: #4ade80; } .ng { color: #f87171; } .mid { color: #fbbf24; }
        .note { color: #9ca3af; font-size: 0.8rem; margin-top: 10px; line-height: 1.6; }
        .embed .wrap { padding: 6px; max-width: none; }
        .embed h1, .embed .sub, .embed .note { display: none; }
        @media (max-width: 700px) { .main { grid-template-columns: 1fr; } }
    </style>
    <script>if (window.self !== window.top) document.documentElement.classList.add('embed');</script>
</head>
<body>
<div class="wrap">
    <h1>見てから動く vs 見ながら動く</h1>
    <p class="sub">真上の固定カメラで部品を見て、ロボットの手先（緑の十字）を部品の穴（黄色の円）に合わせる</p>
    <div class="main">
        <canvas id="cv" width="640" height="440"></canvas>
        <div class="side">
            <div class="box">
                <h3>ずれ（実際とモデルの違い）</h3>
                <label><span class="n">リンク長の誤差</span><input id="eLink" type="range" min="0" max="5" step="0.1" value="1.5"><span class="v" id="vLink"></span></label>
                <label><span class="n">カメラ位置の誤差</span><input id="ePos" type="range" min="0" max="20" step="0.5" value="5"><span class="v" id="vPos"></span></label>
                <label><span class="n">カメラ角度の誤差</span><input id="eAng" type="range" min="0" max="5" step="0.1" value="1.5"><span class="v" id="vAng"></span></label>
            </div>
            <div class="box">
                <div class="modes">
                    <button id="mOpen" class="on">見てから動く</button>
                    <button id="mFb">見ながら動く（ビジュアルFB）</button>
                </div>
                <div class="modes" style="margin-top: 6px;">
                    <button id="go">▶ 実行</button>
                    <button id="reset">↺ 戻す</button>
                </div>
            </div>
            <div class="box result">
                <div style="font-size: 0.8rem; color: #cbd5e1;">手先と穴の実際のずれ</div>
                <div id="err">-</div>
                <div id="msg">部品はドラッグで動かせる</div>
            </div>
        </div>
    </div>
    <p class="note">
        「見てから動く」：画像から部品の位置を<strong>ロボット座標に換算</strong>し、その座標へ一度で動く。カメラ・ロボットのモデルの誤差がそのまま残る。<br>
        「見ながら動く」：画像の中で<strong>手先と穴のずれ</strong>を測り、ずれが 0 になるまで少しずつ動き続ける。モデルが多少違っていても最後は合う。
    </p>
</div>

<script>
// ---- 実世界（単位 mm）。ロボットの根元が原点 ----
const L_TRUE = [300, 250];
const PX = 1.0;                      // 1 mm あたりの画素（真値）
const CAM_TRUE = { x: 200, y: 195, th: 0 }; // カメラ中心が見る世界の点と回転（真値）
const W = 640, H = 440;
const Q0 = [1.9, -1.7];

let target = { x: 330, y: 300 };     // 穴の位置（mm）
let q = Q0.slice(), mode = 'open', running = false, trail = [], iter = 0;

const $ = id => document.getElementById(id);
function errs() {
    return { link: +$('eLink').value / 100, pos: +$('ePos').value, ang: +$('eAng').value * Math.PI / 180 };
}

// 世界 → 画像（真のカメラ）
function w2i(p, cam = CAM_TRUE) {
    const dx = p.x - cam.x, dy = p.y - cam.y, c = Math.cos(cam.th), s = Math.sin(cam.th);
    return { u: W / 2 + PX * (c * dx + s * dy), v: H / 2 - PX * (-s * dx + c * dy) };
}
// 画像 → 世界（ロボットが「思っている」カメラ）
function i2w(pt, cam) {
    const a = (pt.u - W / 2) / PX, b = -(pt.v - H / 2) / PX, c = Math.cos(cam.th), s = Math.sin(cam.th);
    return { x: cam.x + c * a - s * b, y: cam.y + s * a + c * b };
}
function camBelief() { const e = errs(); return { x: CAM_TRUE.x + e.pos, y: CAM_TRUE.y - 0.6 * e.pos, th: CAM_TRUE.th + e.ang }; }
function linksBelief() { const e = errs(); return [L_TRUE[0] * (1 - e.link), L_TRUE[1] * (1 + e.link)]; }

function fk(q, L) {
    const e = { x: L[0] * Math.cos(q[0]), y: L[0] * Math.sin(q[0]) };
    return { elbow: e, tip: { x: e.x + L[1] * Math.cos(q[0] + q[1]), y: e.y + L[1] * Math.sin(q[0] + q[1]) } };
}
function ik(p, L) {
    const d2 = p.x * p.x + p.y * p.y;
    let c2 = (d2 - L[0] * L[0] - L[1] * L[1]) / (2 * L[0] * L[1]);
    c2 = Math.max(-1, Math.min(1, c2));
    const q2 = -Math.acos(c2);
    const q1 = Math.atan2(p.y, p.x) - Math.atan2(L[1] * Math.sin(q2), L[0] + L[1] * Math.cos(q2));
    return [q1, q2];
}
function jac(q, L) {
    const s1 = Math.sin(q[0]), c1 = Math.cos(q[0]), s12 = Math.sin(q[0] + q[1]), c12 = Math.cos(q[0] + q[1]);
    return [[-L[0] * s1 - L[1] * s12, -L[1] * s12], [L[0] * c1 + L[1] * c12, L[1] * c12]];
}
function realErr() { const t = fk(q, L_TRUE).tip; return Math.hypot(t.x - target.x, t.y - target.y); }

// ---- 動作 ----
let anim = null;
function lookAndMove() {
    // 1 回だけ撮影：穴の画像位置 → 思っているカメラで世界座標へ → 思っているリンク長で IK
    const goalW = i2w(w2i(target), camBelief());
    const qGoal = ik(goalW, linksBelief());
    const q0 = q.slice(); let t = 0;
    trail = [];
    anim = () => {
        t = Math.min(1, t + 0.025);
        const k = 0.5 - 0.5 * Math.cos(Math.PI * t);
        q = [q0[0] + (qGoal[0] - q0[0]) * k, q0[1] + (qGoal[1] - q0[1]) * k];
        trail.push(fk(q, L_TRUE).tip);
        if (t >= 1) finish();
    };
}
function visualFeedback() {
    trail = []; iter = 0;
    const cam = camBelief(), L = linksBelief();
    anim = () => {
        // 毎周期：画像の中の手先と穴のずれを測る
        const pe = w2i(fk(q, L_TRUE).tip), pt = w2i(target);
        const du = pt.u - pe.u, dv = pt.v - pe.v;
        // 画像のずれ → 思っているカメラでロボット座標の移動量へ（回転と縮尺だけ）
        const a = du / PX, b = -dv / PX, c = Math.cos(cam.th), s = Math.sin(cam.th);
        const dx = c * a - s * b, dy = s * a + c * b;
        // 思っているリンク長のヤコビ行列で関節の動きへ
        const J = jac(q, L), det = J[0][0] * J[1][1] - J[0][1] * J[1][0];
        const gain = 0.12;
        q[0] += gain * (J[1][1] * dx - J[0][1] * dy) / det;
        q[1] += gain * (-J[1][0] * dx + J[0][0] * dy) / det;
        trail.push(fk(q, L_TRUE).tip); iter++;
        if (Math.hypot(du, dv) < 0.05 || iter > 400) finish();
    };
}
function finish() { anim = null; running = false; showResult(true); }

function showResult(done) {
    const e = realErr(), el = $('err');
    el.textContent = e.toFixed(2) + ' mm';
    el.className = e < 0.5 ? 'ok' : e < 3 ? 'mid' : 'ng';
    if (!done) { $('msg').textContent = '部品はドラッグで動かせる'; return; }
    $('msg').innerHTML = mode === 'open'
        ? '一度で動いて終わり。<strong>モデルの誤差がそのまま残る</strong>'
        : `${iter} 回見て直した。<strong>画像の一致が基準</strong>なので誤差が消える`;
}

// ---- 描画 ----
const cv = $('cv'), ctx = cv.getContext('2d');
function line(a, b, col, w) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(a.u, a.v); ctx.lineTo(b.u, b.v); ctx.stroke(); }
function draw() {
    ctx.clearRect(0, 0, W, H);
    // 作業台のグリッド（真の世界、50 mm 間隔）
    ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1;
    for (let x = -200; x <= 700; x += 50) line(w2i({ x, y: -100 }), w2i({ x, y: 600 }), '#1e293b', 1);
    for (let y = -100; y <= 600; y += 50) line(w2i({ x: -200, y }), w2i({ x: 700, y }), '#1e293b', 1);
    // 部品と穴
    const pt = w2i(target);
    ctx.fillStyle = '#475569'; ctx.fillRect(pt.u - 40, pt.v - 28, 80, 56);
    ctx.beginPath(); ctx.arc(pt.u, pt.v, 9, 0, Math.PI * 2); ctx.fillStyle = '#0b1220'; ctx.fill();
    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2.5; ctx.stroke();
    // 見てから動くの目標（ロボットが思っている穴の位置）
    if (mode === 'open') {
        const goalW = i2w(pt, camBelief());
        const g = fk(ik(goalW, linksBelief()), L_TRUE).tip, gi = w2i(g);
        ctx.setLineDash([4, 4]); ctx.strokeStyle = '#f87171'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(gi.u, gi.v, 12, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = '#f87171'; ctx.font = '12px "Noto Sans JP"'; ctx.fillText('実際に行き着く所', gi.u + 14, gi.v + 18);
    }
    // 軌跡
    if (trail.length > 1) {
        ctx.strokeStyle = '#60a5fa'; ctx.lineWidth = 1.5; ctx.beginPath();
        trail.forEach((p, i) => { const a = w2i(p); i ? ctx.lineTo(a.u, a.v) : ctx.moveTo(a.u, a.v); }); ctx.stroke();
    }
    // ロボット（真の姿）
    const f = fk(q, L_TRUE), b = w2i({ x: 0, y: 0 }), e = w2i(f.elbow), t = w2i(f.tip);
    ctx.fillStyle = '#64748b'; ctx.fillRect(b.u - 22, b.v - 6, 44, 30);
    line(b, e, '#94a3b8', 14); line(e, t, '#cbd5e1', 10);
    [b, e].forEach(p => { ctx.beginPath(); ctx.arc(p.u, p.v, 8, 0, Math.PI * 2); ctx.fillStyle = '#334155'; ctx.fill(); });
    ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(t.u - 10, t.v); ctx.lineTo(t.u + 10, t.v); ctx.moveTo(t.u, t.v - 10); ctx.lineTo(t.u, t.v + 10); ctx.stroke();
    // カメラ視野の表示
    ctx.fillStyle = '#94a3b8'; ctx.font = '12px "Noto Sans JP"'; ctx.fillText('固定カメラの画像（真上から）', 10, 18);
    if (mode === 'fb' && running) {
        ctx.setLineDash([3, 3]); line(t, pt, '#f472b6', 1.5); ctx.setLineDash([]);
        ctx.fillStyle = '#f472b6'; ctx.fillText('画像の中のずれ', (t.u + pt.u) / 2 + 8, (t.v + pt.v) / 2 - 8);
    }
}
function loop() { if (anim) anim(); draw(); requestAnimationFrame(loop); }

// ---- 操作 ----
function labels() {
    $('vLink').textContent = (+$('eLink').value).toFixed(1) + '%';
    $('vPos').textContent = (+$('ePos').value).toFixed(1) + 'mm';
    $('vAng').textContent = (+$('eAng').value).toFixed(1) + '°';
}
['eLink', 'ePos', 'eAng'].forEach(id => $(id).addEventListener('input', () => { labels(); }));
function setMode(m) { mode = m; $('mOpen').classList.toggle('on', m === 'open'); $('mFb').classList.toggle('on', m === 'fb'); }
$('mOpen').onclick = () => setMode('open');
$('mFb').onclick = () => setMode('fb');
$('go').onclick = () => { if (running) return; running = true; mode === 'open' ? lookAndMove() : visualFeedback(); };
$('reset').onclick = () => { anim = null; running = false; q = Q0.slice(); trail = []; showResult(false); };

let drag = false;
function evPt(ev) { const r = cv.getBoundingClientRect(); return { u: (ev.clientX - r.left) * W / r.width, v: (ev.clientY - r.top) * H / r.height }; }
cv.addEventListener('pointerdown', ev => { const p = evPt(ev), t = w2i(target); if (Math.abs(p.u - t.u) < 45 && Math.abs(p.v - t.v) < 35) { drag = true; cv.setPointerCapture(ev.pointerId); } });
cv.addEventListener('pointermove', ev => {
    if (!drag) return;
    const w = i2w(evPt(ev), CAM_TRUE), r = Math.hypot(w.x, w.y);
    if (r > 120 && r < 520 && w.y > 20) { target = w; showResult(false); }
});
cv.addEventListener('pointerup', () => { drag = false; });

labels(); showResult(false); loop();
// テスト用
window.__vf = { run: m => { setMode(m); q = Q0.slice(); m === 'open' ? lookAndMove() : visualFeedback(); running = true; let n = 0; while (anim && n++ < 1000) anim(); return realErr(); } };
</script>
</body>
</html>
