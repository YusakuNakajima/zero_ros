<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00b894"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#333">ROSノードの仕組み</text>
  
  <!-- Node 1: Camera -->
  <rect x="120" y="180" width="80" height="60" rx="10" fill="#74b9ff" stroke="#0984e3" stroke-width="2"/>
  <text x="160" y="200" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Camera</text>
  <text x="160" y="215" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Node</text>
  <text x="160" y="230" text-anchor="middle" font-family="Arial" font-size="10" fill="white">画像データ</text>
  
  <!-- Node 2: Image Processing -->
  <rect x="360" y="120" width="80" height="60" rx="10" fill="#00b894" stroke="#00a085" stroke-width="2"/>
  <text x="400" y="140" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Image</text>
  <text x="400" y="155" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Process</text>
  <text x="400" y="170" text-anchor="middle" font-family="Arial" font-size="10" fill="white">画像処理</text>
  
  <!-- Node 3: Robot Control -->
  <rect x="600" y="180" width="80" height="60" rx="10" fill="#fdcb6e" stroke="#e17055" stroke-width="2"/>
  <text x="640" y="200" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Robot</text>
  <text x="640" y="215" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Control</text>
  <text x="640" y="230" text-anchor="middle" font-family="Arial" font-size="10" fill="white">制御</text>
  
  <!-- Node 4: Sensor -->
  <rect x="240" y="320" width="80" height="60" rx="10" fill="#a29bfe" stroke="#6c5ce7" stroke-width="2"/>
  <text x="280" y="340" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Sensor</text>
  <text x="280" y="355" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Node</text>
  <text x="280" y="370" text-anchor="middle" font-family="Arial" font-size="10" fill="white">センサー</text>
  
  <!-- Topic arrows -->
  <!-- Camera to Image Process -->
  <path d="M 200 200 Q 280 160 360 150" fill="none" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="280" y="170" text-anchor="middle" font-family="Arial" font-size="11" fill="#e74c3c" font-weight="bold">/image_raw</text>
  
  <!-- Image Process to Robot Control -->
  <path d="M 440 150 Q 520 160 600 200" fill="none" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="520" y="170" text-anchor="middle" font-family="Arial" font-size="11" fill="#e74c3c" font-weight="bold">/processed_image</text>
  
  <!-- Sensor to Robot Control -->
  <path d="M 320 340 Q 460 280 600 220" fill="none" stroke="#00b894" stroke-width="3" marker-end="url(#arrowhead2)"/>
  <text x="460" y="270" text-anchor="middle" font-family="Arial" font-size="11" fill="#00b894" font-weight="bold">/sensor_data</text>
  
  <!-- Communication types labels -->
  <rect x="50" y="80" width="200" height="25" fill="#fff3cd" stroke="#ffc107" stroke-width="1" rx="3"/>
  <text x="150" y="97" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#856404">Publisher/Subscriber</text>
  
  <rect x="550" y="80" width="200" height="25" fill="#d4e6f1" stroke="#3498db" stroke-width="1" rx="3"/>
  <text x="650" y="97" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1f4e79">Service/Action</text>
  
  <!-- Legend -->
  <rect x="50" y="450" width="700" height="130" fill="white" stroke="#ddd" stroke-width="1" rx="5"/>
  <text x="60" y="470" font-family="Arial" font-size="14" font-weight="bold" fill="#333">ROSノード通信の特徴</text>
  
  <!-- Communication patterns -->
  <text x="60" y="490" font-family="Arial" font-size="12" font-weight="bold" fill="#e74c3c">● Publisher/Subscriber（トピック通信）</text>
  <text x="70" y="505" font-family="Arial" font-size="11" fill="#333">・一対多の非同期通信　・継続的なデータストリーム</text>
  
  <text x="60" y="525" font-family="Arial" font-size="12" font-weight="bold" fill="#00b894">● Service通信</text>
  <text x="70" y="540" font-family="Arial" font-size="11" fill="#333">・一対一の同期通信　・リクエスト/レスポンス形式</text>
  
  <text x="400" y="490" font-family="Arial" font-size="12" font-weight="bold" fill="#333">✓ ノード同士は直接通信</text>
  <text x="400" y="505" font-family="Arial" font-size="12" fill="#333">✓ 疎結合な分散システム</text>
  <text x="400" y="520" font-family="Arial" font-size="12" fill="#333">✓ 1つのノードが故障しても他は動作継続</text>
  <text x="400" y="535" font-family="Arial" font-size="12" fill="#333">✓ 再利用可能なコンポーネント</text>
  <text x="400" y="550" font-family="Arial" font-size="12" fill="#333">✓ 異なる言語で実装可能</text>
  <text x="400" y="565" font-family="Arial" font-size="12" fill="#333">✓ ROS1/ROS2両方で同じ概念</text>
</svg>