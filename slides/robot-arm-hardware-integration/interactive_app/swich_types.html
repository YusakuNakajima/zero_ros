<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スイッチ動作シミュレーター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
        }
        .light-bulb {
            transition: all 0.3s ease;
        }
        .light-bulb.off {
            fill: #d1d5db; /* gray-300 */
        }
        .light-bulb.on {
            fill: #fde047; /* yellow-300 */
            filter: drop-shadow(0 0 10px #facc15); /* yellow-400 */
        }
        .switch-lever {
            transition: transform 0.2s ease-in-out;
            transform-origin: 50px 50px;
        }
        .control-label {
            display: block;
            padding: 0.5rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        input[type="radio"]:checked + .control-label {
            background-color: #e0f2fe; /* sky-100 */
            border-color: #38bdf8; /* sky-400 */
            color: #0284c7; /* sky-600 */
            font-weight: 500;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-2xl bg-white rounded-xl shadow-lg p-6 md:p-8">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">スイッチ動作シミュレーター</h1>

        <!-- Controls -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div>
                <h2 class="text-lg font-semibold text-gray-700 mb-3 text-center">1. 動作方式を選択</h2>
                <div id="action-type-selector" class="flex justify-center gap-4">
                    <div class="relative">
                        <input type="radio" id="action-momentary" name="actionType" value="momentary" class="sr-only" checked>
                        <label for="action-momentary" class="control-label">モーメンタリ</label>
                    </div>
                    <div class="relative">
                        <input type="radio" id="action-alternate" name="actionType" value="alternate" class="sr-only">
                        <label for="action-alternate" class="control-label">オルタネイト</label>
                    </div>
                </div>
            </div>
            <div>
                <h2 class="text-lg font-semibold text-gray-700 mb-3 text-center">2. 接点構成を選択</h2>
                <div id="contact-type-selector" class="flex justify-center gap-2 sm:gap-4">
                    <div class="relative">
                        <input type="radio" id="contact-a" name="contactType" value="a" class="sr-only" checked>
                        <label for="contact-a" class="control-label">a接点</label>
                    </div>
                    <div class="relative">
                        <input type="radio" id="contact-b" name="contactType" value="b" class="sr-only">
                        <label for="contact-b" class="control-label">b接点</label>
                    </div>
                    <div class="relative">
                        <input type="radio" id="contact-c" name="contactType" value="c" class="sr-only">
                        <label for="contact-c" class="control-label">c接点</label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Simulation Area -->
        <div class="bg-gray-50 border border-gray-200 rounded-lg p-6">
            <div class="flex flex-col md:flex-row items-center justify-around gap-6">
                <!-- Circuit Diagram -->
                <div class="w-full md:w-1/2">
                    <svg id="circuit-svg" viewBox="0 0 250 150" class="w-full h-auto">
                        <!-- Common Parts -->
                        <line x1="10" y1="50" x2="50" y2="50" stroke="#4b5563" stroke-width="2"/>
                        <circle cx="50" cy="50" r="4" fill="#4b5563"/>
                        <text x="5" y="40" font-size="12px" fill="#4b5563">入力</text>

                        <!-- a-contact parts -->
                        <g id="a-contact-group">
                            <circle cx="100" cy="50" r="4" fill="#4b5563"/>
                            <line x1="100" y1="50" x2="150" y2="50" stroke="#4b5563" stroke-width="2"/>
                        </g>

                        <!-- b-contact parts -->
                        <g id="b-contact-group" class="hidden">
                             <line x1="80" y1="40" x2="80" y2="25" stroke="#4b5563" stroke-width="2" />
                             <line x1="75" y1="25" x2="85" y2="25" stroke="#4b5563" stroke-width="2" />
                        </g>

                        <!-- c-contact parts -->
                        <g id="c-contact-group" class="hidden">
                            <circle cx="100" cy="30" r="4" fill="#4b5563" />
                            <line x1="100" y1="30" x2="150" y2="30" stroke="#4b5563" stroke-width="2"/>
                            <text x="105" y="25" font-size="12px" fill="#4b5563">NO (B)</text>
                             <circle cx="100" cy="70" r="4" fill="#4b5563" />
                            <line x1="100" y1="70" x2="150" y2="70" stroke="#4b5563" stroke-width="2"/>
                            <text x="105" y="85" font-size="12px" fill="#4b5563">NC (A)</text>
                        </g>

                        <!-- Switch Lever -->
                        <line id="switch-lever" class="switch-lever" x1="50" y1="50" x2="100" y2="30" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>

                        <!-- Light Bulbs -->
                        <g id="bulb-a-group" transform="translate(170, 0)">
                             <circle id="bulb-a" class="light-bulb off" cx="0" cy="50" r="15"/>
                             <line x1="-7" y1="43" x2="7" y2="57" stroke="#a1a1aa" stroke-width="1.5"/>
                             <line x1="-7" y1="57" x2="7" y2="43" stroke="#a1a1aa" stroke-width="1.5"/>
                             <text id="bulb-a-label" x="-5" y="75" font-size="12px" fill="#4b5563">A</text>
                        </g>
                         <g id="bulb-b-group" transform="translate(170, 0)" class="hidden">
                             <circle id="bulb-b" class="light-bulb off" cx="0" cy="30" r="15"/>
                             <line x1="-7" y1="23" x2="7" y2="37" stroke="#a1a1aa" stroke-width="1.5"/>
                             <line x1="-7" y1="37" x2="7" y2="23" stroke="#a1a1aa" stroke-width="1.5"/>
                             <text id="bulb-b-label" x="-5" y="15" font-size="12px" fill="#4b5563">B</text>
                        </g>
                    </svg>
                </div>

                <!-- Controls and Status -->
                <div class="w-full md:w-1/2 flex flex-col items-center gap-4">
                    <button id="action-button" class="px-8 py-4 bg-blue-500 text-white font-bold rounded-lg shadow-md hover:bg-blue-600 active:bg-blue-700 active:shadow-inner transition-all w-48 text-lg">操作ボタン</button>
                    <div id="status-box" class="w-full bg-gray-100 p-4 rounded-md text-center">
                        <p id="status-text" class="text-gray-700 font-medium">説明がここに表示されます。</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- DOM Elements ---
        const actionTypeSelector = document.getElementById('action-type-selector');
        const contactTypeSelector = document.getElementById('contact-type-selector');
        const actionButton = document.getElementById('action-button');
        const statusText = document.getElementById('status-text');
        
        const lever = document.getElementById('switch-lever');
        const aContactGroup = document.getElementById('a-contact-group');
        const bContactGroup = document.getElementById('b-contact-group');
        const cContactGroup = document.getElementById('c-contact-group');
        
        const bulbAGroup = document.getElementById('bulb-a-group');
        const bulbA = document.getElementById('bulb-a');
        const bulbBGroup = document.getElementById('bulb-b-group');
        const bulbB = document.getElementById('bulb-b');

        // --- State ---
        let state = {
            actionType: 'momentary',
            contactType: 'a',
            isPressed: false, // For momentary
            isOn: false, // For alternate
        };

        // --- Logic ---
        function updateSimulation() {
            state.actionType = document.querySelector('input[name="actionType"]:checked').value;
            state.contactType = document.querySelector('input[name="contactType"]:checked').value;

            // Reset state on control change
            state.isPressed = false;
            state.isOn = false;

            render();
        }

        function render() {
            // Determine switch state based on action type
            const isSwitchActive = state.actionType === 'momentary' ? state.isPressed : state.isOn;

            // --- Update Visuals ---
            // 1. Configure SVG based on contact type
            aContactGroup.classList.toggle('hidden', state.contactType !== 'a');
            bContactGroup.classList.toggle('hidden', state.contactType !== 'b');
            cContactGroup.classList.toggle('hidden', state.contactType !== 'c');
            
            bulbAGroup.classList.toggle('hidden', state.contactType === 'c');
            bulbBGroup.classList.toggle('hidden', state.contactType !== 'c');

            // When C-contact, use both bulbs but reposition bulb A to match NC contact
            if (state.contactType === 'c') {
                bulbAGroup.classList.remove('hidden'); // Show A bulb as well
                bulbAGroup.style.transform = 'translate(170, 20px)'; // Move A bulb down to y=70
            } else {
                bulbAGroup.style.transform = 'translate(170, 0)'; // Reset A bulb position
            }
            
            // 2. Update lever, bulbs, and text based on switch state
            let description = '';
            
            switch (state.contactType) {
                case 'a': // a接点 (Normally Open)
                    lever.style.transform = isSwitchActive ? 'rotate(0deg)' : 'rotate(-25deg)';
                    bulbA.classList.toggle('on', isSwitchActive);
                    description = `通常時OFF。${state.actionType === 'momentary' ? '押している間' : '押すと'}ONになります。`;
                    break;
                case 'b': // b接点 (Normally Closed)
                    lever.style.transform = isSwitchActive ? 'rotate(-25deg)' : 'rotate(0deg)';
                    bulbA.classList.toggle('on', !isSwitchActive);
                    description = `通常時ON。${state.actionType === 'momentary' ? '押している間' : '押すと'}OFFになります。`;
                    break;
                case 'c': // c接点 (Changeover)
                    lever.style.transform = isSwitchActive ? 'rotate(-25deg)' : 'rotate(25deg)';
                    bulbA.classList.toggle('on', !isSwitchActive); // NC contact (Bulb A)
                    bulbB.classList.toggle('on', isSwitchActive);  // NO contact (Bulb B)
                    description = `通常時AがON。${state.actionType === 'momentary' ? '押している間' : '押すと'}BがONに切り替わります。`;
                    break;
            }
            statusText.textContent = description;
        }

        // --- Event Handlers ---
        actionTypeSelector.addEventListener('change', updateSimulation);
        contactTypeSelector.addEventListener('change', updateSimulation);

        // Momentary
        actionButton.addEventListener('mousedown', () => {
            if (state.actionType === 'momentary') {
                state.isPressed = true;
                render();
            }
        });
        actionButton.addEventListener('mouseup', () => {
            if (state.actionType === 'momentary') {
                state.isPressed = false;
                render();
            }
        });
        actionButton.addEventListener('mouseleave', () => { // Handle mouse leaving button while pressed
            if (state.actionType === 'momentary' && state.isPressed) {
                state.isPressed = false;
                render();
            }
        });

        // Alternate
        actionButton.addEventListener('click', () => {
            if (state.actionType === 'alternate') {
                state.isOn = !state.isOn;
                render();
            }
        });
        
        // --- Initial Load ---
        updateSimulation();
    });
    </script>
</body>
</html>
