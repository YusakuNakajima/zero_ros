<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTセンサのノイズ除去</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #111827;
            --panel: #1f2937;
            --line: #374151;
            --text: #e5e7eb;
            --muted: #9ca3af;
            --raw: #6b7280;
            --flt: #4ade80;
            --cut: #fbbf24;
            --true: #60a5fa;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 8px;
            background: var(--bg);
            color: var(--text);
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 12px;
            /* iframe の高さに収める: グラフが残りの高さを分け合う */
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .controls { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: end; }
        .controls > div { flex: 1 1 140px; }
        .controls > .buttons { flex: 0 0 auto; }
        label { display: block; color: var(--muted); }
        label { white-space: nowrap; }
        label b { color: var(--text); margin-left: 6px; }
        input[type="range"] { width: 100%; margin: 2px 0 0; }
        .buttons { display: flex; gap: 4px; }
        button {
            padding: 4px 8px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #374151;
            color: var(--text);
            font: inherit;
            cursor: pointer;
            white-space: nowrap;
        }
        button:hover { background: #4b5563; }
        button.primary { background: #2563eb; border-color: #2563eb; }
        button.on { background: #b45309; border-color: #b45309; }
        #filterBtn.on { background: #15803d; border-color: #15803d; }
        canvas { width: 100%; flex: 1 1 0; min-height: 60px; display: block; margin-top: 6px; background: var(--panel); border-radius: 6px; }
        .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4px; color: var(--muted); }
        .legend span::before { content: ""; display: inline-block; width: 16px; height: 3px; margin-right: 4px; vertical-align: middle; background: currentColor; }
        .raw { color: var(--raw); }
        .flt { color: var(--flt); }
        .cut { color: var(--cut); }
        .true { color: var(--true); }
    </style>
</head>
<body>
    <div class="controls">
        <div>
            <label>カットオフ周波数 <b id="fcVal"></b></label>
            <input type="range" id="fc" min="0" max="2.4" step="0.05" value="1.3">
        </div>
        <div>
            <label>フィルタ次数 <b id="orderVal"></b></label>
            <input type="range" id="order" min="1" max="4" step="1" value="2">
        </div>
        <div class="buttons">
            <button id="filterBtn" class="on">フィルタ ON</button>
            <button id="press">✋ 押す</button>
            <button id="playPause" class="primary">⏸</button>
            <button id="reset">⟲</button>
        </div>
    </div>
    <canvas id="wave"></canvas>
    <canvas id="spec"></canvas>
    <div class="legend">
        <span class="raw">生データ</span>
        <span class="flt">出力</span>
        <span class="true">本当の力</span>
        <span class="cut">ローパスフィルタの特性</span>
    </div>

    <script>
        // ---- 信号モデル ----
        // FTセンサ Fz を 1 kHz でサンプリング。無負荷でも
        //   ホワイトノイズ ＋ ロボットの振動 (120 Hz) が乗っている
        const FS = 1000;                 // サンプリング周波数 [Hz]
        const NOISE = 0.25;              // ホワイトノイズの標準偏差 [N]
        const VIB_F = 120, VIB_A = 0.3;  // 振動ノイズ [Hz], [N]
        const OFFSET = 0.0;              // 無負荷時の値 [N]
        const PRESS_F = 5;               // 押したときの力 [N]
        const WINDOW = 2.0;              // 波形の表示時間 [s]
        const NFFT = 1024;
        const PLAYBACK = 0.5;            // 実時間の 1/2 で再生

        const $ = id => document.getElementById(id);
        let running = true, pressed = false, filterOn = true;
        let n, trueF, buf, sections;

        function gauss() {
            let u = 0, v = 0;
            while (u === 0) u = Math.random();
            while (v === 0) v = Math.random();
            return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
        }

        // ---- 2次 Butterworth ローパスを order 段つなぐ (biquad, 双一次変換) ----
        function designFilter() {
            const fc = Math.pow(10, parseFloat($('fc').value));
            const order = parseInt($('order').value, 10);
            $('fcVal').textContent = fc < 10 ? fc.toFixed(1) + ' Hz' : fc.toFixed(0) + ' Hz';
            $('orderVal').textContent = (order * 2) + ' 次';
            const w0 = 2 * Math.PI * fc / FS, cw = Math.cos(w0), alpha = Math.sin(w0) / (2 * Math.SQRT1_2);
            const a0 = 1 + alpha;
            const c = {
                b0: (1 - cw) / 2 / a0, b1: (1 - cw) / a0, b2: (1 - cw) / 2 / a0,
                a1: -2 * cw / a0, a2: (1 - alpha) / a0,
            };
            const prev = sections || [];
            sections = Array.from({ length: order }, (_, i) => ({ ...c, z1: prev[i] ? prev[i].z1 : 0, z2: prev[i] ? prev[i].z2 : 0 }));
            return { fc, c, order };
        }

        function filterSample(x) {
            for (const s of sections) {
                const y = s.b0 * x + s.z1;
                s.z1 = s.b1 * x - s.a1 * y + s.z2;
                s.z2 = s.b2 * x - s.a2 * y;
                x = y;
            }
            return x;
        }

        function reset() {
            n = 0;
            trueF = OFFSET;
            buf = [];
            sections = null;
            designFilter();
        }

        function step() {
            const target = pressed ? PRESS_F : OFFSET;
            trueF += (target - trueF) * 0.02;    // 手で押すので少しなめらかに変化
            const t = n / FS;
            const raw = trueF + NOISE * gauss() + VIB_A * Math.sin(2 * Math.PI * VIB_F * t);
            const flt = filterSample(raw);   // OFF の間もフィルタは回しておき、ON にした瞬間に飛ばないようにする
            buf.push({ t, raw, flt, tr: trueF });
            if (buf.length > Math.max(WINDOW * FS, NFFT)) buf.shift();
            n++;
        }

        // ---- FFT (radix-2) ----
        function fftMag(x) {
            const N = x.length, re = x.slice(), im = new Array(N).fill(0);
            for (let i = 1, j = 0; i < N; i++) {
                let bit = N >> 1;
                for (; j & bit; bit >>= 1) j ^= bit;
                j ^= bit;
                if (i < j) { [re[i], re[j]] = [re[j], re[i]]; }
            }
            for (let len = 2; len <= N; len <<= 1) {
                const ang = -2 * Math.PI / len;
                for (let i = 0; i < N; i += len) {
                    for (let k = 0; k < len / 2; k++) {
                        const wr = Math.cos(ang * k), wi = Math.sin(ang * k);
                        const ur = re[i + k], ui = im[i + k];
                        const vr = re[i + k + len / 2] * wr - im[i + k + len / 2] * wi;
                        const vi = re[i + k + len / 2] * wi + im[i + k + len / 2] * wr;
                        re[i + k] = ur + vr; im[i + k] = ui + vi;
                        re[i + k + len / 2] = ur - vr; im[i + k + len / 2] = ui - vi;
                    }
                }
            }
            return re.slice(0, N / 2).map((r, i) => Math.hypot(r, im[i]) / N * 2);
        }

        // フィルタの振幅特性 |H(f)|
        function response(f, c, order) {
            const w = 2 * Math.PI * f / FS;
            const zr = Math.cos(w), zi = -Math.sin(w), z2r = Math.cos(2 * w), z2i = -Math.sin(2 * w);
            const nr = c.b0 + c.b1 * zr + c.b2 * z2r, ni = c.b1 * zi + c.b2 * z2i;
            const dr = 1 + c.a1 * zr + c.a2 * z2r, di = c.a1 * zi + c.a2 * z2i;
            return Math.pow(Math.hypot(nr, ni) / Math.hypot(dr, di), order);
        }

        // ---- 描画 ----
        const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
        function fitCanvas(c) {
            const ratio = window.devicePixelRatio || 1;
            const w = c.clientWidth, h = c.clientHeight;
            if (c.width !== Math.round(w * ratio) || c.height !== Math.round(h * ratio)) {
                c.width = Math.round(w * ratio);
                c.height = Math.round(h * ratio);
            }
            const ctx = c.getContext('2d');
            ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
            return { ctx, w, h };
        }

        function frame(ctx, pad, pw, ph, title) {
            ctx.strokeStyle = css('--line');
            ctx.strokeRect(pad.l, pad.t, pw, ph);
            ctx.fillStyle = css('--muted');
            ctx.font = '11px "Noto Sans JP", sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(title, pad.l, 11);
        }

        function drawWave() {
            const { ctx, w, h } = fitCanvas($('wave'));
            ctx.clearRect(0, 0, w, h);
            const pad = { l: 30, r: 8, t: 16, b: 16 };
            const pw = w - pad.l - pad.r, ph = h - pad.t - pad.b;
            const yMin = -2, yMax = 7;
            const tNow = buf.length ? buf[buf.length - 1].t : 0, t0 = tNow - WINDOW;
            const X = t => pad.l + (t - t0) / WINDOW * pw;
            const Y = v => pad.t + ph - (Math.min(Math.max(v, yMin), yMax) - yMin) / (yMax - yMin) * ph;
            frame(ctx, pad, pw, ph, '時間波形 Fz [N]');
            ctx.textAlign = 'right';
            ctx.fillText(yMax, pad.l - 4, pad.t + 8);
            ctx.fillText('0', pad.l - 4, Y(0) + 4);
            ctx.fillText('時間 →', pad.l + pw, h - 3);
            const view = buf.filter(p => p.t >= t0);
            const out = filterOn ? 'flt' : 'raw';
            for (const [key, col, lw] of [['raw', css('--raw'), 1], ['tr', css('--true'), 1.5], [out, css('--flt'), 2]]) {
                ctx.strokeStyle = col;
                ctx.lineWidth = lw;
                ctx.beginPath();
                view.forEach((p, i) => i ? ctx.lineTo(X(p.t), Y(p[key])) : ctx.moveTo(X(p.t), Y(p[key])));
                ctx.stroke();
            }
            ctx.lineWidth = 1;
        }

        function drawSpec(filter) {
            const { ctx, w, h } = fitCanvas($('spec'));
            ctx.clearRect(0, 0, w, h);
            const pad = { l: 30, r: 8, t: 16, b: 16 };
            const pw = w - pad.l - pad.r, ph = h - pad.t - pad.b;
            const fMin = 1, fMax = FS / 2;
            const X = f => pad.l + Math.log10(f / fMin) / Math.log10(fMax / fMin) * pw;
            const dbMin = -60, dbMax = 0;
            const Y = db => pad.t + ph - (Math.min(Math.max(db, dbMin), dbMax) - dbMin) / (dbMax - dbMin) * ph;
            frame(ctx, pad, pw, ph, '周波数成分（FFT, 直近 ' + NFFT + ' 点） [dB]');
            ctx.textAlign = 'center';
            for (const f of [1, 10, 100]) {
                ctx.fillText(f + ' Hz', X(f), h - 3);
                ctx.strokeStyle = css('--line');
                ctx.beginPath();
                ctx.moveTo(X(f), pad.t);
                ctx.lineTo(X(f), pad.t + ph);
                ctx.stroke();
            }
            ctx.fillText('500 Hz', X(500) - 14, h - 3);
            if (buf.length >= NFFT) {
                const seg = buf.slice(-NFFT);
                for (const [key, col, lw] of [['raw', css('--raw'), 1], [filterOn ? 'flt' : 'raw', css('--flt'), 1.5]]) {
                    // 直流分 (平均) を引き、ハン窓をかける
                    const mean = seg.reduce((a, p) => a + p[key], 0) / NFFT;
                    const x = seg.map((p, i) => (p[key] - mean) * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / (NFFT - 1))) * 2);
                    const mag = fftMag(x);
                    ctx.strokeStyle = col;
                    ctx.lineWidth = lw;
                    ctx.beginPath();
                    for (let k = 1; k < mag.length; k++) {
                        const f = k * FS / NFFT, db = 20 * Math.log10(mag[k] + 1e-9);
                        k > 1 ? ctx.lineTo(X(f), Y(db)) : ctx.moveTo(X(f), Y(db));
                    }
                    ctx.stroke();
                }
            }
            // フィルタ特性 (0 dB 基準を上端に)。OFF のときは薄く表示
            ctx.globalAlpha = filterOn ? 1 : 0.25;
            ctx.strokeStyle = css('--cut');
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i <= 200; i++) {
                const f = fMin * Math.pow(fMax / fMin, i / 200) * 0.999;
                const db = 20 * Math.log10(response(f, filter.c, filter.order) + 1e-12);
                i ? ctx.lineTo(X(f), Y(db)) : ctx.moveTo(X(f), Y(db));
            }
            ctx.stroke();
            ctx.lineWidth = 1;
            ctx.setLineDash([3, 3]);
            ctx.beginPath();
            ctx.moveTo(X(filter.fc), pad.t);
            ctx.lineTo(X(filter.fc), pad.t + ph);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = css('--cut');
            ctx.textAlign = 'left';
            ctx.fillText(filterOn ? 'カットオフ' : 'フィルタ OFF', X(filter.fc) + 4, pad.t + 12);
            ctx.globalAlpha = 1;
            ctx.fillStyle = css('--muted');
            ctx.textAlign = 'right';
            ctx.fillText('振動 120 Hz', X(VIB_F) - 4, pad.t + 26);
        }

        let filter, last = null;
        function loop(now) {
            if (last === null) last = now;
            const elapsed = Math.min((now - last) / 1000, 0.05);
            last = now;
            if (running) {
                const steps = Math.round(elapsed * PLAYBACK * FS);
                for (let i = 0; i < steps; i++) step();
            }
            drawWave();
            drawSpec(filter);
            requestAnimationFrame(loop);
        }

        $('fc').addEventListener('input', () => { filter = designFilter(); });
        $('order').addEventListener('input', () => { filter = designFilter(); });
        $('filterBtn').addEventListener('click', () => {
            filterOn = !filterOn;
            $('filterBtn').classList.toggle('on', filterOn);
            $('filterBtn').textContent = filterOn ? 'フィルタ ON' : 'フィルタ OFF';
        });
        $('press').addEventListener('click', () => {
            pressed = !pressed;
            $('press').classList.toggle('on', pressed);
            $('press').textContent = pressed ? '✋ 離す' : '✋ 押す';
        });
        $('playPause').addEventListener('click', () => {
            running = !running;
            $('playPause').textContent = running ? '⏸' : '▶';
        });
        $('reset').addEventListener('click', () => { reset(); filter = designFilter(); });

        reset();
        filter = designFilter();
        // 最初から FFT が見えるよう、少し溜めておく
        for (let i = 0; i < NFFT; i++) step();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
