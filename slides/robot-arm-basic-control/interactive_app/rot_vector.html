<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UR 回転表現の比較：回転ベクトル vs RPY (Universal Robot)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
        }
        .slider-thumb::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #3b82f6;
            cursor: pointer;
            border-radius: 50%;
        }
        .slider-thumb::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: #3b82f6;
            cursor: pointer;
            border-radius: 50%;
        }
        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.5rem center;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="container mx-auto p-4 md:p-8">
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900">URの回転表現の比較</h1>
            <p class="mt-2 text-lg text-gray-600"><b>Universal Robot</b>で採用されている回転ベクトルとRPYの違いを視覚的に理解する</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Rotation Vector Card -->
            <div class="bg-white p-6 rounded-xl shadow-lg">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-semibold text-blue-600">1. 回転ベクトル</h2>
                    <button id="reset-rv" class="px-4 py-2 bg-blue-500 text-white text-sm font-medium rounded-md hover:bg-blue-600 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">リセット</button>
                </div>
                <div class="mb-4">
                    <label for="rv-mode" class="block text-sm font-medium text-gray-700 mb-1">表現タイプ:</label>
                    <select id="rv-mode" class="w-full p-2 border border-gray-300 rounded-md bg-white">
                        <option value="rad">回転ベクトル [rad]</option>
                        <option value="deg">回転ベクトル [°]</option>
                    </select>
                </div>
                <p id="rv-desc" class="text-sm text-gray-600 mb-2">
                    <b>Universal Robot</b>の標準的な回転表現です。ベクトルの方向が回転軸、長さが<strong class="font-medium">ラジアン単位</strong>の回転角度になります。
                </p>
                <p class="text-sm text-gray-700 font-medium mb-4">ベクトルの長さ (ノルム): <span id="rv-norm" class="font-bold text-blue-600">0.0000</span></p>
                <div id="canvas-container1" class="w-full h-64 md:h-80 bg-gray-900 rounded-lg relative overflow-hidden"></div>
                <div id="controls1" class="mt-6 space-y-4">
                    <!-- Vector X -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label for="vec-x" class="text-sm font-medium text-gray-700">ベクトル X: <span id="vec-x-value" class="font-bold text-blue-600">0.00</span></label>
                            <input type="number" id="vec-x-input" min="-4" max="4" step="0.01" value="0" class="w-24 p-1 border border-gray-300 rounded-md text-right">
                        </div>
                        <input id="vec-x" type="range" min="-4" max="4" step="0.01" value="0" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer slider-thumb">
                    </div>
                    <!-- Vector Y -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label for="vec-y" class="text-sm font-medium text-gray-700">ベクトル Y: <span id="vec-y-value" class="font-bold text-blue-600">0.00</span></label>
                            <input type="number" id="vec-y-input" min="-4" max="4" step="0.01" value="0" class="w-24 p-1 border border-gray-300 rounded-md text-right">
                        </div>
                        <input id="vec-y" type="range" min="-4" max="4" step="0.01" value="0" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer slider-thumb">
                    </div>
                    <!-- Vector Z -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label for="vec-z" class="text-sm font-medium text-gray-700">ベクトル Z: <span id="vec-z-value" class="font-bold text-blue-600">0.00</span></label>
                            <input type="number" id="vec-z-input" min="-4" max="4" step="0.01" value="0" class="w-24 p-1 border border-gray-300 rounded-md text-right">
                        </div>
                        <input id="vec-z" type="range" min="-4" max="4" step="0.01" value="0" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer slider-thumb">
                    </div>
                </div>
            </div>

            <!-- RPY (Roll, Pitch, Yaw) Card -->
            <div class="bg-white p-6 rounded-xl shadow-lg">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-semibold text-green-600">2. ロール・ピッチ・ヨー</h2>
                    <button id="reset-rpy" class="px-4 py-2 bg-green-500 text-white text-sm font-medium rounded-md hover:bg-green-600 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">リセット</button>
                </div>
                 <div class="mb-4">
                    <label for="rpy-mode" class="block text-sm font-medium text-gray-700 mb-1">表現タイプ:</label>
                    <select id="rpy-mode" class="w-full p-2 border border-gray-300 rounded-md bg-white">
                        <option value="deg">RPY [°]</option>
                        <option value="rad">RPY [rad]</option>
                        <option value="pi">RPY [π rad]</option>
                    </select>
                </div>
                <p id="rpy-desc" class="text-sm text-gray-600 mb-4">
                    <b>Universal Robot</b>でも利用可能なRPY形式です。機体のX(Roll), Y(Pitch), Z(Yaw)軸周りの回転を<strong class="font-medium">度数単位</strong>で適用します。<strong class="font-medium text-red-600">Pitchが±90°に近づくとジンバルロックが発生します。</strong>
                </p>
                <div id="canvas-container2" class="w-full h-64 md:h-80 bg-gray-900 rounded-lg relative overflow-hidden"></div>
                <div id="controls2" class="mt-6 space-y-4">
                    <!-- Roll -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label for="roll" class="text-sm font-medium text-gray-700">Roll (X軸): <span id="roll-value" class="font-bold text-green-600">0</span><span id="roll-unit">°</span></label>
                            <input type="number" id="roll-input" min="-180" max="180" step="1" value="0" class="w-24 p-1 border border-gray-300 rounded-md text-right">
                        </div>
                        <input id="roll" type="range" min="-180" max="180" step="1" value="0" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer slider-thumb">
                    </div>
                    <!-- Pitch -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label for="pitch" class="text-sm font-medium text-gray-700">Pitch (Y軸): <span id="pitch-value" class="font-bold text-green-600">0</span><span id="pitch-unit">°</span></label>
                            <input type="number" id="pitch-input" min="-90" max="90" step="1" value="0" class="w-24 p-1 border border-gray-300 rounded-md text-right">
                        </div>
                        <input id="pitch" type="range" min="-90" max="90" step="1" value="0" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer slider-thumb">
                    </div>
                    <!-- Yaw -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label for="yaw" class="text-sm font-medium text-gray-700">Yaw (Z軸): <span id="yaw-value" class="font-bold text-green-600">0</span><span id="yaw-unit">°</span></label>
                            <input type="number" id="yaw-input" min="-180" max="180" step="1" value="0" class="w-24 p-1 border border-gray-300 rounded-md text-right">
                        </div>
                        <input id="yaw" type="range" min="-180" max="180" step="1" value="0" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer slider-thumb">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Initialization ---
        function initScene(containerId, addAxisLine = false) {
            const container = document.getElementById(containerId);
            if (!container) return null;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(2.5, 2.5, 4);
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7.5);
            scene.add(directionalLight);

            const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
            const material = new THREE.MeshNormalMaterial();
            const cube = new THREE.Mesh(geometry, material);
            scene.add(cube);

            const axesHelper = new THREE.AxesHelper(2.5);
            scene.add(axesHelper);

            let axisLine = null;
            if (addAxisLine) {
                const lineMaterial = new THREE.LineBasicMaterial({ color: 0xff00ff, linewidth: 2 }); // Magenta line
                const points = [new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, 0)];
                const lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
                axisLine = new THREE.Line(lineGeometry, lineMaterial);
                scene.add(axisLine);
            }

            window.addEventListener('resize', () => {
                if (!container.clientWidth || !container.clientHeight) return;
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            }, false);

            return { scene, camera, renderer, cube, axisLine };
        }

        // --- DOM Element Selection ---
        // Scene 1: Rotation Vector
        const scene1 = initScene('canvas-container1', true); // Add axis line to scene 1
        const rvModeSelect = document.getElementById('rv-mode');
        const rvDesc = document.getElementById('rv-desc');
        const rvNorm = document.getElementById('rv-norm');
        const vecXSlider = document.getElementById('vec-x');
        const vecYSlider = document.getElementById('vec-y');
        const vecZSlider = document.getElementById('vec-z');
        const vecXInput = document.getElementById('vec-x-input');
        const vecYInput = document.getElementById('vec-y-input');
        const vecZInput = document.getElementById('vec-z-input');
        const vecXValue = document.getElementById('vec-x-value');
        const vecYValue = document.getElementById('vec-y-value');
        const vecZValue = document.getElementById('vec-z-value');
        const resetRvButton = document.getElementById('reset-rv');

        // Scene 2: RPY
        const scene2 = initScene('canvas-container2');
        const rpyModeSelect = document.getElementById('rpy-mode');
        const rpyDesc = document.getElementById('rpy-desc');
        const rollSlider = document.getElementById('roll');
        const pitchSlider = document.getElementById('pitch');
        const yawSlider = document.getElementById('yaw');
        const rollInput = document.getElementById('roll-input');
        const pitchInput = document.getElementById('pitch-input');
        const yawInput = document.getElementById('yaw-input');
        const rollValue = document.getElementById('roll-value');
        const pitchValue = document.getElementById('pitch-value');
        const yawValue = document.getElementById('yaw-value');
        const rollUnit = document.getElementById('roll-unit');
        const pitchUnit = document.getElementById('pitch-unit');
        const yawUnit = document.getElementById('yaw-unit');
        const resetRpyButton = document.getElementById('reset-rpy');

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            if (scene1) {
                const vec = new THREE.Vector3(
                    parseFloat(vecXSlider.value),
                    parseFloat(vecYSlider.value),
                    parseFloat(vecZSlider.value)
                );
                
                const norm = vec.length();
                rvNorm.textContent = norm.toFixed(4);

                // Update axis line visualization to pass through the origin
                const positions = scene1.axisLine.geometry.attributes.position.array;
                if (norm > 0.0001) { // Check for non-zero vector
                    const axisDirection = vec.clone().normalize();
                    const lineLength = 5; // A fixed length to make it visible
                    
                    // Start point
                    positions[0] = axisDirection.x * -lineLength;
                    positions[1] = axisDirection.y * -lineLength;
                    positions[2] = axisDirection.z * -lineLength;
                    
                    // End point
                    positions[3] = axisDirection.x * lineLength;
                    positions[4] = axisDirection.y * lineLength;
                    positions[5] = axisDirection.z * lineLength;
                } else {
                    // If vector is zero, make the line disappear
                    for(let i = 0; i < 6; i++) positions[i] = 0;
                }
                scene1.axisLine.geometry.attributes.position.needsUpdate = true;

                let angle = norm;
                if (angle > 0) {
                    const axis = vec.clone().normalize();
                    if (rvModeSelect.value === 'deg') {
                        angle = THREE.MathUtils.degToRad(angle);
                    }
                    scene1.cube.setRotationFromAxisAngle(axis, angle);
                } else {
                    scene1.cube.rotation.set(0, 0, 0);
                }
                scene1.renderer.render(scene1.scene, scene1.camera);
            }

            if (scene2) {
                let roll = parseFloat(rollSlider.value);
                let pitch = parseFloat(pitchSlider.value);
                let yaw = parseFloat(yawSlider.value);
                const mode = rpyModeSelect.value;
                if (mode === 'deg') {
                    roll = THREE.MathUtils.degToRad(roll);
                    pitch = THREE.MathUtils.degToRad(pitch);
                    yaw = THREE.MathUtils.degToRad(yaw);
                } else if (mode === 'pi') {
                    roll *= Math.PI;
                    pitch *= Math.PI;
                    yaw *= Math.PI;
                }
                scene2.cube.rotation.set(roll, pitch, yaw, 'ZYX');
                scene2.renderer.render(scene2.scene, scene2.camera);
            }
        }

        // --- Control Update Functions ---
        function updateRvValues() {
            vecXValue.textContent = parseFloat(vecXSlider.value).toFixed(2);
            vecYValue.textContent = parseFloat(vecYSlider.value).toFixed(2);
            vecZValue.textContent = parseFloat(vecZSlider.value).toFixed(2);
        }

        function updateRpyValues() {
            const mode = rpyModeSelect.value;
            const format = (val) => (mode === 'deg' ? val : parseFloat(val).toFixed(2));
            rollValue.textContent = format(rollSlider.value);
            pitchValue.textContent = format(pitchSlider.value);
            yawValue.textContent = format(yawSlider.value);
        }

        function updateRpyControls() {
            const mode = rpyModeSelect.value;
            let unitLabel, min, max, step, descHtml;
            switch (mode) {
                case 'rad':
                    unitLabel = ' rad'; min = -Math.PI; max = Math.PI; step = 0.01;
                    descHtml = `<b>Universal Robot</b>でも利用可能なRPY形式です。機体のX(Roll), Y(Pitch), Z(Yaw)軸周りの回転を<strong class="font-medium">ラジアン単位</strong>で適用します。<strong class="font-medium text-red-600">Pitchが±π/2に近づくとジンバルロックが発生します。</strong>`;
                    break;
                case 'pi':
                    unitLabel = 'π rad'; min = -1; max = 1; step = 0.01;
                    descHtml = `<b>Universal Robot</b>でも利用可能なRPY形式です。機体のX(Roll), Y(Pitch), Z(Yaw)軸周りの回転を<strong class="font-medium">π単位</strong>で適用します。<strong class="font-medium text-red-600">Pitchが±0.5πに近づくとジンバルロックが発生します。</strong>`;
                    break;
                default: // deg
                    unitLabel = '°'; min = -180; max = 180; step = 1;
                    descHtml = `<b>Universal Robot</b>でも利用可能なRPY形式です。機体のX(Roll), Y(Pitch), Z(Yaw)軸周りの回転を<strong class="font-medium">度数単位</strong>で適用します。<strong class="font-medium text-red-600">Pitchが±90°に近づくとジンバルロックが発生します。</strong>`;
                    break;
            }
            rpyDesc.innerHTML = descHtml;
            [rollUnit, pitchUnit, yawUnit].forEach(u => u.textContent = unitLabel);
            
            [[rollSlider, rollInput], [yawSlider, yawInput]].forEach(([slider, input]) => {
                slider.min = min; slider.max = max; slider.step = step; slider.value = 0;
                input.min = min; input.max = max; input.step = step; input.value = 0;
            });
            pitchSlider.min = min / 2; pitchSlider.max = max / 2; pitchSlider.step = step; pitchSlider.value = 0;
            pitchInput.min = min / 2; pitchInput.max = max / 2; pitchInput.step = step; pitchInput.value = 0;

            updateRpyValues();
        }

        // --- Reset Functions ---
        function resetRvControls() {
            rvModeSelect.value = 'rad';
            [vecXSlider, vecYSlider, vecZSlider, vecXInput, vecYInput, vecZInput].forEach(el => el.value = 0);
            rvModeSelect.dispatchEvent(new Event('change'));
            updateRvValues();
        }

        function resetRpyControls() {
            rpyModeSelect.value = 'deg';
            rpyModeSelect.dispatchEvent(new Event('change'));
        }

        // --- Event Listener Setup ---
        function setupEventListeners() {
            // Helper to link a slider and a number input
            const linkSliderAndInput = (slider, input, updateFunc) => {
                slider.addEventListener('input', () => {
                    input.value = slider.value;
                    if(updateFunc) updateFunc();
                });
                input.addEventListener('input', () => {
                    const value = Math.max(parseFloat(slider.min), Math.min(parseFloat(slider.max), parseFloat(input.value) || 0));
                    slider.value = value;
                    if (input.value != value) input.value = value;
                    if(updateFunc) updateFunc();
                });
            };

            // Rotation Vector listeners
            rvModeSelect.addEventListener('change', () => {
                rvDesc.innerHTML = rvModeSelect.value === 'rad'
                    ? `<b>Universal Robot</b>の標準的な回転表現です。ベクトルの方向が回転軸、長さが<strong class="font-medium">ラジアン単位</strong>の回転角度になります。`
                    : `<b>Universal Robot</b>の標準的な回転表現です。ベクトルの方向が回転軸、長さが<strong class="font-medium">度数単位</strong>の回転角度になります。`;
            });
            linkSliderAndInput(vecXSlider, vecXInput, updateRvValues);
            linkSliderAndInput(vecYSlider, vecYInput, updateRvValues);
            linkSliderAndInput(vecZSlider, vecZInput, updateRvValues);
            resetRvButton.addEventListener('click', resetRvControls);

            // RPY listeners
            rpyModeSelect.addEventListener('change', updateRpyControls);
            linkSliderAndInput(rollSlider, rollInput, updateRpyValues);
            linkSliderAndInput(pitchSlider, pitchInput, updateRpyValues);
            linkSliderAndInput(yawSlider, yawInput, updateRpyValues);
            resetRpyButton.addEventListener('click', resetRpyControls);
        }

        // --- Start ---
        if (scene1 && scene2) {
            setupEventListeners();
            animate();
        } else {
            console.error("One or both scenes failed to initialize.");
        }
    </script>

</body>
</html>
