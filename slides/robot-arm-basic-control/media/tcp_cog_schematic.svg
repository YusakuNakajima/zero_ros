<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="Noto Sans JP, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4fc3f7"/>
    </marker>
    <marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffd54f"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bdbdbd"/>
    </marker>
  </defs>

  <!-- ロボット本体 -->
  <rect x="40" y="400" width="110" height="30" rx="4" fill="#555"/>
  <line x1="95" y1="400" x2="150" y2="230" stroke="#9e9e9e" stroke-width="24" stroke-linecap="round"/>
  <line x1="150" y1="230" x2="300" y2="110" stroke="#9e9e9e" stroke-width="20" stroke-linecap="round"/>
  <line x1="300" y1="110" x2="330" y2="140" stroke="#9e9e9e" stroke-width="16" stroke-linecap="round"/>
  <circle cx="95" cy="400" r="14" fill="#757575"/>
  <circle cx="150" cy="230" r="15" fill="#757575"/>
  <circle cx="300" cy="110" r="13" fill="#757575"/>
  <text x="40" y="452" fill="#bdbdbd" font-size="18">ロボット</text>

  <!-- フランジ -->
  <rect x="306" y="140" width="48" height="12" fill="#e0e0e0"/>
  <text x="362" y="152" fill="#e0e0e0" font-size="17">フランジ</text>

  <!-- エンドエフェクタ (ツール本体 + 乳棒) -->
  <rect x="304" y="152" width="52" height="88" rx="6" fill="#546e7a"/>
  <rect x="323" y="240" width="14" height="95" rx="5" fill="#90a4ae"/>
  <text x="362" y="180" fill="#90a4ae" font-size="17">エンドエフェクタ</text>

  <!-- 重心 -->
  <line x1="330" y1="200" x2="330" y2="262" stroke="#ffd54f" stroke-width="4" marker-end="url(#ay)"/>
  <circle cx="330" cy="200" r="11" fill="#263238" stroke="#ffd54f" stroke-width="3"/>
  <path d="M330,189 A11,11 0 0,1 341,200 L330,200 Z M330,211 A11,11 0 0,1 319,200 L330,200 Z" fill="#ffd54f"/>
  <text x="362" y="212" fill="#ffd54f" font-size="22" font-weight="bold">重心</text>
  <text x="362" y="236" fill="#ffd54f" font-size="16">質量 m がかかる点</text>
  <text x="342" y="262" fill="#ffd54f" font-size="15">重力</text>

  <!-- TCP 座標系 -->
  <line x1="330" y1="335" x2="384" y2="335" stroke="#ff6b6b" stroke-width="4" marker-end="url(#ar)"/>
  <line x1="330" y1="335" x2="330" y2="392" stroke="#4fc3f7" stroke-width="4" marker-end="url(#ab)"/>
  <circle cx="330" cy="335" r="7" fill="#ff6b6b"/>
  <text x="390" y="341" fill="#ff6b6b" font-size="16">X</text>
  <text x="338" y="408" fill="#4fc3f7" font-size="16">Z</text>
  <text x="316" y="378" fill="#ff6b6b" font-size="22" font-weight="bold" text-anchor="end">TCP</text>
  <text x="316" y="400" fill="#ff6b6b" font-size="15" text-anchor="end">(乳棒の先端)</text>

  <!-- フランジからのオフセット -->
  <line x1="275" y1="146" x2="300" y2="146" stroke="#bdbdbd" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="245" y1="335" x2="300" y2="335" stroke="#bdbdbd" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="280" y1="152" x2="280" y2="329" stroke="#bdbdbd" stroke-width="2" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <text x="268" y="242" fill="#bdbdbd" font-size="15" text-anchor="middle" transform="rotate(-90 268 242)">オフセット</text>
</svg>
