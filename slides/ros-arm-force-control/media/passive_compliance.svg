<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" font-family="Noto Sans JP, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/>
    </marker>
  </defs>
  <!-- base & arm -->
  <rect x="40" y="330" width="90" height="30" rx="4" fill="#555"/>
  <line x1="85" y1="330" x2="140" y2="170" stroke="#9e9e9e" stroke-width="22" stroke-linecap="round"/>
  <line x1="140" y1="170" x2="280" y2="120" stroke="#9e9e9e" stroke-width="18" stroke-linecap="round"/>
  <circle cx="140" cy="170" r="14" fill="#757575"/>
  <circle cx="280" cy="120" r="12" fill="#757575"/>
  <!-- flange -->
  <rect x="262" y="132" width="36" height="14" fill="#bdbdbd"/>
  <!-- spring (passive element) -->
  <polyline points="280,146 280,156 264,164 296,176 264,188 296,200 264,212 296,224 280,232 280,240"
            fill="none" stroke="#4dd0e1" stroke-width="5" stroke-linejoin="round"/>
  <!-- tool -->
  <rect x="266" y="240" width="28" height="56" rx="4" fill="#e0e0e0"/>
  <!-- surface -->
  <rect x="170" y="296" width="250" height="18" fill="#6d4c41"/>
  <!-- force arrow -->
  <line x1="330" y1="292" x2="330" y2="236" stroke="#ff6b6b" stroke-width="4" marker-end="url(#ah)"/>
  <text x="340" y="268" fill="#ff6b6b" font-size="22">反力</text>
  <!-- labels -->
  <text x="310" y="196" fill="#4dd0e1" font-size="22">ばね・ゲル</text>
  <text x="310" y="222" fill="#4dd0e1" font-size="18">(柔軟な機械要素)</text>
  <text x="150" y="96" fill="#eee" font-size="20">アームは位置制御のまま</text>
  <text x="245" y="344" fill="#bcaaa4" font-size="18">環境</text>
</svg>
