<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" font-family="Noto Sans JP, sans-serif">
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#eee"/>
    </marker>
  </defs>
  <!-- robot wrist -->
  <rect x="200" y="30" width="80" height="40" rx="6" fill="#9e9e9e"/>
  <text x="190" y="56" fill="#eee" font-size="18" text-anchor="end">ロボットアーム</text>
  <!-- passive compliance -->
  <polyline points="240,70 240,80 222,90 258,104 222,118 258,132 222,146 240,156 240,166"
            fill="none" stroke="#4dd0e1" stroke-width="5" stroke-linejoin="round"/>
  <text x="270" y="122" fill="#4dd0e1" font-size="18">受動コンプライアンス</text>
  <!-- pestle -->
  <rect x="230" y="166" width="20" height="120" rx="8" fill="#eeeeee"/>
  <ellipse cx="240" cy="290" rx="18" ry="12" fill="#eeeeee"/>
  <!-- mortar -->
  <path d="M130,260 Q240,380 350,260 Z" fill="#8d6e63" stroke="#bcaaa4" stroke-width="3"/>
  <ellipse cx="240" cy="300" rx="50" ry="8" fill="#ffe082" opacity="0.8"/>
  <text x="370" y="300" fill="#eee" font-size="18">乳鉢</text>
  <!-- force arrow -->
  <line x1="190" y1="190" x2="190" y2="268" stroke="#ff6b6b" stroke-width="4" marker-end="url(#d)"/>
  <text x="180" y="230" fill="#ff6b6b" font-size="18" text-anchor="end">粉砕力</text>
  <!-- rotation -->
  <path d="M150,372 A90,14 0 0 0 330,372" fill="none" stroke="#eee" stroke-width="2.5" marker-end="url(#r)"/>
  <text x="240" y="412" fill="#aaa" font-size="16" text-anchor="middle">すりつぶし (力と速度を調整)</text>
</svg>
