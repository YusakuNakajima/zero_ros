<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Noto Sans JP', sans-serif">
  <defs>
    <marker id="af" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e5e7eb"/></marker>
  </defs>
  <!-- 目標位置 x_d -->
  <line x1="60" y1="60" x2="60" y2="230" stroke="#f472b6" stroke-width="5"/>
  <text x="60" y="48" fill="#f472b6" font-size="20" text-anchor="middle" font-weight="bold">目標 x_d</text>
  <!-- ばね K -->
  <polyline points="60.0,110.0 72.0,110.0 86.7,122.0 116.1,98.0 145.6,122.0 175.0,98.0 204.4,122.0 233.9,98.0 263.3,122.0 278.0,110.0 290.0,110.0" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <text x="175" y="88" fill="#fbbf24" font-size="22" text-anchor="middle" font-weight="bold">K ばね</text>
  <!-- ダンパ D -->
  <line x1="60" y1="185" x2="160" y2="185" stroke="#60a5fa" stroke-width="3"/>
  <path d="M160,165 L220,165 L220,205 L160,205" fill="none" stroke="#60a5fa" stroke-width="3"/>
  <line x1="200" y1="172" x2="200" y2="198" stroke="#60a5fa" stroke-width="5"/>
  <line x1="200" y1="185" x2="290" y2="185" stroke="#60a5fa" stroke-width="3"/>
  <text x="175" y="238" fill="#60a5fa" font-size="22" text-anchor="middle" font-weight="bold">D ダンパ</text>
  <!-- 質量 M (手先) -->
  <rect x="290" y="80" width="110" height="140" rx="10" fill="#4b5563" stroke="#9ca3af" stroke-width="2"/>
  <text x="345" y="145" fill="#e5e7eb" font-size="26" text-anchor="middle" font-weight="bold">M</text>
  <text x="345" y="175" fill="#d1d5db" font-size="17" text-anchor="middle">手先（重さ）</text>
  <!-- 外力 -->
  <line x1="510" y1="150" x2="410" y2="150" stroke="#f87171" stroke-width="6" marker-end="url(#af)"/>
  <text x="470" y="132" fill="#f87171" font-size="20" text-anchor="middle" font-weight="bold">外力 F</text>
  <text x="470" y="185" fill="#f87171" font-size="15" text-anchor="middle">壁・人の手</text>
  <!-- 位置 x -->
  <line x1="290" y1="262" x2="420" y2="262" stroke="#e5e7eb" stroke-width="2" marker-end="url(#ax)"/>
  <line x1="345" y1="226" x2="345" y2="262" stroke="#e5e7eb" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="430" y="268" fill="#e5e7eb" font-size="18">x</text>
  <text x="280" y="292" fill="#e5e7eb" font-size="17" text-anchor="middle">M ẍ + D ẋ + K (x − x_d) = F</text>
</svg>
