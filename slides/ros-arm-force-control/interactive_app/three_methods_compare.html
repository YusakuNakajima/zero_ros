<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>力制御3方式の比較</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #111827;
            --panel: #1f2937;
            --line: #374151;
            --text: #e5e7eb;
            --muted: #9ca3af;
            --imp: #f472b6;
            --adm: #4fc3f7;
            --hyb: #fbbf24;
            --work: #a16207;
            --force: #ef4444;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 8px;
            background: var(--bg);
            color: var(--text);
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 12px;
        }
        .controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px 10px; align-items: end; }
        @media (max-width: 560px) { .controls { grid-template-columns: 1fr 1fr; } }
        label { display: block; color: var(--muted); white-space: nowrap; }
        label b { color: var(--text); float: right; }
        input[type="range"], select { width: 100%; margin: 2px 0 0; }
        select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 2px; font: inherit; }
        button {
            padding: 3px 8px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #374151;
            color: var(--text);
            font: inherit;
            cursor: pointer;
            white-space: nowrap;
        }
        button:hover { background: #4b5563; }
        button.primary { background: #2563eb; border-color: #2563eb; }
        button.on { background: #b45309; border-color: #b45309; }
        canvas { width: 100%; display: block; margin-top: 4px; background: var(--panel); border-radius: 6px; }
        .row { display: flex; gap: 6px; align-items: center; justify-content: space-between; margin-top: 4px; }
        .legend { display: flex; gap: 10px; flex-wrap: wrap; color: var(--muted); }
        .legend span::before { content: ""; display: inline-block; width: 14px; height: 3px; margin-right: 4px; vertical-align: middle; background: currentColor; }
        .imp { color: var(--imp); }
        .adm { color: var(--adm); }
        .hyb { color: var(--hyb); }
        .buttons { display: flex; gap: 4px; }
        .presets { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin-top: 4px; color: var(--muted); }
        .presets button { padding: 2px 6px; }
        .presets button.imp { color: var(--imp); }
        .presets button.adm { color: var(--adm); }
        .presets button.hyb { color: var(--hyb); }
        .presets button.sel { background: #4b5563; border-color: var(--text); }
        #presetNote { color: var(--text); }
    </style>
</head>
<body>
    <div class="controls">
        <div>
            <label>表面の凹凸 <b id="bumpVal"></b></label>
            <input type="range" id="bump" min="0" max="5" step="0.5" value="4">
        </div>
        <div>
            <label>ワークの硬さ <b id="keVal"></b></label>
            <input type="range" id="ke" min="3.5" max="5.5" step="0.1" value="3.6">
        </div>
        <div>
            <label>関節摩擦 <b id="fcVal"></b></label>
            <input type="range" id="fc" min="0" max="2" step="0.1" value="1">
        </div>
        <div>
            <label>制御周期</label>
            <select id="T">
                <option value="0.001">1 ms</option>
                <option value="0.004" selected>4 ms</option>
                <option value="0.008">8 ms</option>
            </select>
        </div>
    </div>
    <div class="presets">
        <span>苦手な条件：</span>
        <button data-preset="imp" class="imp">インピーダンス</button>
        <button data-preset="adm" class="adm">アドミッタンス</button>
        <button data-preset="hyb" class="hyb">ハイブリッド</button>
        <span id="presetNote"></span>
    </div>
    <canvas id="scene" height="135"></canvas>
    <canvas id="plot" height="100"></canvas>
    <div class="row">
        <div class="legend">
            <span class="imp">インピーダンス</span>
            <span class="adm">アドミッタンス</span>
            <span class="hyb">ハイブリッド</span>
        </div>
        <div class="buttons">
            <button id="push">→ 横から押す</button>
            <button id="playPause" class="primary">⏸</button>
            <button id="reset">⟲</button>
        </div>
    </div>

    <script>
        // ================= モデル =================
        // 水平面に置いた 3 リンクの平面アーム (重力なし)。手先を X 方向に往復させながら、
        // 下にあるワーク表面へ Y 方向に 10 N で押し付ける (研磨のイメージ)。
        // 関節の慣性は簡単のため対角 (連成なし) とする。
        const L = [0.35, 0.30, 0.12];         // リンク長 [m]
        const INERTIA = [0.5, 0.25, 0.03];    // 関節の慣性 [kg m^2]
        const TAU_MAX = [60, 40, 10];         // モータが出せるトルクの上限 [N m]
        const JOINT_VISC = 0.05;              // 関節粘性 [N m s/rad]
        const DT = 5e-5;                      // 物理シミュレーションの刻み [s]
        const PLAYBACK = 0.5;                 // 実時間の 1/2 で再生
        const WINDOW = 6;                     // プロットの時間幅 [s]
        const F_DES = 10;                     // 狙いの押し付け力 [N]
        const Y_SURF = -0.30;                 // ワーク表面の平均高さ [m]
        const PHI_D = -Math.PI / 2;           // 工具は真下向き
        const PUSH_F = 15, PUSH_TIME = 0.6;   // 「横から押す」の力 [N]・時間 [s]

        // 目標インピーダンス (インピーダンス / アドミッタンス共通)
        const KD = 1500, MD = 1.0, DD = 2 * 0.9 * Math.sqrt(KD * MD);
        const KPHI = 30, DPHI = 1.0;          // 工具の向きを保つ回転ばね
        // 内側の関節位置制御 (アドミッタンス / ハイブリッド): 帯域 30 Hz
        const WJ = 2 * Math.PI * 30;
        const KPJ = INERTIA.map(I => I * WJ * WJ), KVJ = INERTIA.map(I => 2 * I * WJ * 0.9);
        // ハイブリッドの力制御: 力の誤差 → Y 速度 (応答 8 Hz 相当)
        const HYB_BW = 2 * Math.PI * 8;
        // インピーダンス / アドミッタンスの目標 Y: 硬い表面なら 10 N になる深さ
        const Y_REF = Y_SURF - F_DES / KD;

        const $ = id => document.getElementById(id);
        let params, t, k, arms, history, running = true, pushUntil = -1, autoPush = false, groove = false;

        function readParams() {
            params = {
                bump: parseFloat($('bump').value) / 1000,
                ke: Math.pow(10, parseFloat($('ke').value)),
                fc: parseFloat($('fc').value),
                T: parseFloat($('T').value),
            };
            params.ctrlEvery = Math.round(params.T / DT);
            $('bumpVal').textContent = '±' + (params.bump * 1000).toFixed(1) + ' mm';
            $('keVal').textContent = (params.ke / 1000).toFixed(params.ke >= 1e5 ? 0 : 1) + ' kN/m';
            $('fcVal').textContent = params.fc.toFixed(1) + ' N·m';
        }

        // 溝: 中心 0.43 m、深さ 20 mm、壁は 45°
        const GROOVE_X = 0.43, GROOVE_D = 0.02, GROOVE_TOP = 0.03;
        function grooveDepth(x) {
            return groove ? Math.max(0, Math.min(GROOVE_D, GROOVE_TOP - Math.abs(x - GROOVE_X))) : 0;
        }
        // ワーク表面の高さ (場所によって凹凸や溝がある)
        function surfaceY(x) {
            const b = params.bump;
            return Y_SURF - grooveDepth(x) + b * (0.6 * Math.sin(2 * Math.PI * x / 0.09) + 0.4 * Math.sin(2 * Math.PI * x / 0.04 + 1));
        }
        // 手先の目標 X: ゆっくり往復
        function targetX(time) { return 0.40 + 0.10 * Math.sin(2 * Math.PI * time / 8); }
        function targetVX(time) { return 0.10 * 2 * Math.PI / 8 * Math.cos(2 * Math.PI * time / 8); }

        // ---- 運動学 ----
        function fk(q) {
            const a1 = q[0], a2 = a1 + q[1], a3 = a2 + q[2];
            const j1 = [L[0] * Math.cos(a1), L[0] * Math.sin(a1)];
            const j2 = [j1[0] + L[1] * Math.cos(a2), j1[1] + L[1] * Math.sin(a2)];
            const tip = [j2[0] + L[2] * Math.cos(a3), j2[1] + L[2] * Math.sin(a3)];
            return { j1, j2, tip, phi: a3 };
        }
        function jacobian(q) {
            const a1 = q[0], a2 = a1 + q[1], a3 = a2 + q[2];
            const s = [Math.sin(a1), Math.sin(a2), Math.sin(a3)], c = [Math.cos(a1), Math.cos(a2), Math.cos(a3)];
            return [
                [-L[0] * s[0] - L[1] * s[1] - L[2] * s[2], -L[1] * s[1] - L[2] * s[2], -L[2] * s[2]],
                [L[0] * c[0] + L[1] * c[1] + L[2] * c[2], L[1] * c[1] + L[2] * c[2], L[2] * c[2]],
                [1, 1, 1],
            ];
        }
        // 手先 (x, y, phi) → 関節角 (肘を上にした解)
        function ik(x, y, phi) {
            const wx = x - L[2] * Math.cos(phi), wy = y - L[2] * Math.sin(phi);
            const c2 = Math.max(-1, Math.min(1, (wx * wx + wy * wy - L[0] * L[0] - L[1] * L[1]) / (2 * L[0] * L[1])));
            const q2 = -Math.acos(c2);
            const q1 = Math.atan2(wy, wx) - Math.atan2(L[1] * Math.sin(q2), L[0] + L[1] * Math.cos(q2));
            return [q1, q2, phi - q1 - q2];
        }
        const jtMul = (J, f) => [0, 1, 2].map(i => J[0][i] * f[0] + J[1][i] * f[1] + J[2][i] * f[2]);

        function newArm(mode) {
            const x = targetX(0), y = surfaceY(x);
            const q = ik(x, y, PHI_D);
            return { mode, q, qd: [0, 0, 0], tau: [0, 0, 0], qc: q.slice(), qcPrev: q.slice(),
                     xc: [x, y], vc: [0, 0], sensor: [[0, 0], [0, 0]], fn: 0, err: 0 };
        }

        function reset() {
            readParams();
            t = 0;
            k = 0;
            pushUntil = -1;
            arms = [newArm('imp'), newArm('adm'), newArm('hyb')];
            history = [];
        }

        function control(a) {
            const T = params.T;
            const xd = targetX(t), vxd = targetVX(t);
            const fMeas = a.sensor[0];                       // 力センサ (1 周期遅れ)
            if (a.mode === 'imp') {
                // インピーダンス: 手先の位置・速度のずれ → 力 → 関節トルク (センサ不要)
                const p = fk(a.q), J = jacobian(a.q);
                const v = [0, 1, 2].map(r => J[r][0] * a.qd[0] + J[r][1] * a.qd[1] + J[r][2] * a.qd[2]);
                const F = [KD * (xd - p.tip[0]) + DD * (vxd - v[0]),
                           KD * (Y_REF - p.tip[1]) - DD * v[1],
                           KPHI * (PHI_D - p.phi) - DPHI * v[2]];
                a.tau = jtMul(J, F);
                return;
            }
            if (a.mode === 'adm') {
                // アドミッタンス: 測った力 → 仮想の質量・ダンパ・ばね → 手先の位置指令
                const ref = [xd, Y_REF], vref = [vxd, 0];
                for (let i = 0; i < 2; i++) {
                    const acc = (fMeas[i] - DD * (a.vc[i] - vref[i]) - KD * (a.xc[i] - ref[i])) / MD;
                    a.vc[i] += acc * T;
                    a.xc[i] += a.vc[i] * T;
                }
            } else {
                // ハイブリッド: X は位置 (軌道どおり)、Y は力を目標にする
                a.xc[0] = xd;
                const vy = Math.max(-0.05, Math.min(0.05, -HYB_BW / params.ke * (F_DES - fMeas[1])));
                a.xc[1] += vy * T;
            }
            // 位置指令 → IK → 関節の位置制御
            a.qcPrev = a.qc;
            a.qc = ik(a.xc[0], a.xc[1], PHI_D);
            const qcd = a.qc.map((v, i) => (v - a.qcPrev[i]) / T);
            a.tau = a.qc.map((v, i) => KPJ[i] * (v - a.q[i]) + KVJ[i] * (qcd[i] - a.qd[i]));
        }

        function step() {
            const doCtrl = k % params.ctrlEvery === 0;
            const push = t < pushUntil ? PUSH_F : 0;
            for (const a of arms) {
                const p = fk(a.q), J = jacobian(a.q);
                // ワークからの反力: 表面に食い込んだ分だけ、面に垂直な向きに押し返す
                const v = [0, 1, 2].map(r => J[r][0] * a.qd[0] + J[r][1] * a.qd[1] + J[r][2] * a.qd[2]);
                const h = 5e-4, slope = (surfaceY(p.tip[0] + h) - surfaceY(p.tip[0] - h)) / (2 * h);
                const nl = Math.hypot(slope, 1), n = [-slope / nl, 1 / nl];
                const pen = (surfaceY(p.tip[0]) - p.tip[1]) / nl;
                const vn = v[0] * n[0] + v[1] * n[1];
                const fn = pen > 0 ? Math.max(0, params.ke * pen - 2 * 0.05 * Math.sqrt(params.ke * 0.3) * vn) : 0;
                a.fn = fn;
                const fExt = [push + fn * n[0], fn * n[1]];
                if (doCtrl) {
                    a.sensor.shift();
                    a.sensor.push(fExt.slice());
                    control(a);
                }
                const tauExt = jtMul(J, [fExt[0], fExt[1], 0]);
                a.tau = a.tau.map((v, i) => Math.max(-TAU_MAX[i], Math.min(TAU_MAX[i], v)));
                for (let i = 0; i < 3; i++) {
                    const drive = a.tau[i] + tauExt[i];
                    let fr;
                    if (Math.abs(a.qd[i]) > 1e-4) fr = -params.fc * Math.sign(a.qd[i]);
                    else fr = -Math.max(-params.fc, Math.min(params.fc, drive));   // 静止摩擦
                    const acc = (drive + fr - JOINT_VISC * a.qd[i]) / INERTIA[i];
                    a.qd[i] += acc * DT;
                    a.q[i] += a.qd[i] * DT;
                }
                a.err = p.tip[0] - targetX(t);
            }
            if (k % 400 === 0) history.push({ t, f: arms.map(a => a.fn), e: arms.map(a => a.err) });
            t += DT;
            k++;
        }

        // ================= 描画 =================
        const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
        function fitCanvas(c) {
            const ratio = window.devicePixelRatio || 1;
            // 元の高さを覚えておく（height 属性は ratio 倍に書き換わるため）
            const w = c.clientWidth, h = +(c.dataset.h ||= c.getAttribute('height'));
            if (c.width !== Math.round(w * ratio)) {
                c.width = Math.round(w * ratio);
                c.height = Math.round(h * ratio);
                c.style.height = h + 'px';
            }
            const ctx = c.getContext('2d');
            ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
            return { ctx, w, h };
        }
        const NAMES = ['インピーダンス', 'アドミッタンス', 'ハイブリッド'];
        const COLS = ['--imp', '--adm', '--hyb'];

        function drawArmPanel(ctx, a, i, x0, pw, h) {
            const col = css(COLS[i]);
            // 表示範囲: x -0.05〜0.6 m、y -0.33〜+0.28 m (肘が上に来る)
            const s = Math.min((pw - 10) / 0.65, (h - 22) / 0.61);
            const bx = x0 + 6 + 0.05 * s, by = 20 + 0.28 * s;
            const P = (x, y) => [bx + x * s, by - y * s];
            // ワーク (実寸。凹凸は小さいので拡大窓で見る)
            ctx.fillStyle = css('--work');
            const [, ys] = P(0, Y_SURF);
            ctx.beginPath();
            ctx.moveTo(x0 + 2, h - 2);
            for (let px = x0 + 2; px <= x0 + pw - 2; px += 2) {
                const xw = (px - bx) / s;
                ctx.lineTo(px, P(xw, surfaceY(xw))[1]);
            }
            ctx.lineTo(x0 + pw - 2, h - 2);
            ctx.fill();
            // 目標 X
            const [txp] = P(targetX(t), 0);
            ctx.strokeStyle = css('--muted');
            ctx.setLineDash([3, 3]);
            ctx.beginPath();
            ctx.moveTo(txp, by + 8);
            ctx.lineTo(txp, ys);
            ctx.stroke();
            ctx.setLineDash([]);
            // アーム
            const f = fk(a.q);
            const pts = [[0, 0], f.j1, f.j2, f.tip].map(p => P(p[0], p[1]));
            ctx.strokeStyle = '#9ca3af';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            pts.forEach((p, k2) => k2 ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
            ctx.stroke();
            ctx.lineWidth = 1;
            ctx.fillStyle = '#4b5563';
            ctx.fillRect(pts[0][0] - 8, pts[0][1] - 6, 16, 12);
            ctx.fillStyle = col;
            for (const p of pts.slice(1, 3)) { ctx.beginPath(); ctx.arc(p[0], p[1], 3.5, 0, 7); ctx.fill(); }
            ctx.fillRect(pts[3][0] - 4, pts[3][1] - 6, 8, 6);
            // 横から押す力
            if (t < pushUntil) {
                ctx.strokeStyle = css('--force');
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(pts[3][0] - 26, pts[3][1] - 10);
                ctx.lineTo(pts[3][0] - 8, pts[3][1] - 10);
                ctx.stroke();
                ctx.lineWidth = 1;
            }
            // 名前
            ctx.fillStyle = col;
            ctx.font = 'bold 12px "Noto Sans JP", sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(NAMES[i], x0 + 6, 14);
            // 拡大窓 (×10): 手先まわりの凹凸と食い込み
            const zw = pw * 0.45, zh = 44, zx = x0 + 4, zy = ys - zh - 6;   // アームの無い左下に置く
            ctx.fillStyle = css('--bg');
            ctx.fillRect(zx, zy, zw, zh);
            ctx.save();
            ctx.beginPath();
            ctx.rect(zx, zy, zw, zh);
            ctx.clip();
            const Z = s * 10, cx = zx + zw / 2, cy = zy + zh * 0.45;
            const ZP = (x, y) => [cx + (x - f.tip[0]) * Z, cy - (y - Y_SURF) * Z];
            ctx.fillStyle = css('--work');
            ctx.beginPath();
            ctx.moveTo(zx, zy + zh);
            for (let px = 0; px <= zw; px += 2) {
                const xw = f.tip[0] + (zx + px - cx) / Z;
                const p = ZP(xw, surfaceY(xw));
                ctx.lineTo(p[0], p[1]);
            }
            ctx.lineTo(zx + zw, zy + zh);
            ctx.fill();
            const tp = ZP(f.tip[0], Math.max(f.tip[1], surfaceY(f.tip[0])));
            ctx.fillStyle = col;
            ctx.fillRect(tp[0] - 5, tp[1] - 10, 10, 10);
            ctx.restore();
            ctx.strokeStyle = css('--line');
            ctx.strokeRect(zx, zy, zw, zh);
            ctx.fillStyle = css('--muted');
            ctx.font = '10px "Noto Sans JP", sans-serif';
            ctx.fillText('×10', zx + 3, zy + 11);
            // 力の値
            ctx.fillStyle = a.fn > 2 * F_DES ? css('--force') : css('--text');
            ctx.font = '12px "Noto Sans JP", sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(a.fn.toFixed(1) + ' N', x0 + pw - 6, 14);
        }

        function drawScene() {
            const { ctx, w, h } = fitCanvas($('scene'));
            ctx.clearRect(0, 0, w, h);
            const pw = w / 3;
            arms.forEach((a, i) => drawArmPanel(ctx, a, i, i * pw, pw, h));
            ctx.fillStyle = css('--bg');
            ctx.fillRect(pw - 1, 0, 2, h);
            ctx.fillRect(2 * pw - 1, 0, 2, h);
        }

        function drawPlot() {
            const { ctx, w, h } = fitCanvas($('plot'));
            ctx.clearRect(0, 0, w, h);
            const t0 = Math.max(0, t - WINDOW);
            const panels = [
                { title: '押し付け力 [N]（点線 = 目標 10 N）', key: 'f', min: 0, max: 30, ref: F_DES, scale: 1 },
                { title: '横方向の位置ずれ [mm]', key: 'e', min: -15, max: 15, ref: 0, scale: 1000 },
            ];
            const ph0 = h / 2;
            panels.forEach((pn, j) => {
                const pad = { l: 28, r: 8, t: 14, b: 4 };
                const top = j * ph0;
                const pw = w - pad.l - pad.r, ph = ph0 - pad.t - pad.b;
                const X = tt => pad.l + (tt - t0) / WINDOW * pw;
                const Y = v => top + pad.t + ph - (Math.min(Math.max(v, pn.min), pn.max) - pn.min) / (pn.max - pn.min) * ph;
                ctx.strokeStyle = css('--line');
                ctx.strokeRect(pad.l, top + pad.t, pw, ph);
                ctx.fillStyle = css('--muted');
                ctx.font = '11px "Noto Sans JP", sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(pn.title, pad.l, top + 11);
                ctx.textAlign = 'right';
                ctx.fillText(pn.max, pad.l - 3, top + pad.t + 8);
                ctx.fillText(pn.min, pad.l - 3, top + pad.t + ph);
                ctx.strokeStyle = css('--muted');
                ctx.setLineDash([3, 4]);
                ctx.beginPath();
                ctx.moveTo(pad.l, Y(pn.ref));
                ctx.lineTo(pad.l + pw, Y(pn.ref));
                ctx.stroke();
                ctx.setLineDash([]);
                [0, 1, 2].forEach(i => {
                    ctx.strokeStyle = css(COLS[i]);
                    ctx.lineWidth = 1.8;
                    ctx.beginPath();
                    history.forEach((p, m) => {
                        const px = X(p.t), py = Y(p[pn.key][i] * pn.scale);
                        m ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
                    });
                    ctx.stroke();
                });
                ctx.lineWidth = 1;
            });
        }

        let last = null;
        function loop(now) {
            if (last === null) last = now;
            const elapsed = Math.min((now - last) / 1000, 0.05);
            last = now;
            if (running) {
                const n = Math.round(elapsed * PLAYBACK / DT);
                for (let i = 0; i < n; i++) {
                    // 「ハイブリッドが苦手」では 3 秒ごとに人が横から押す
                    if (autoPush && t % 3 < DT && t > 1) pushUntil = t + PUSH_TIME;
                    step();
                }
                while (history.length && history[0].t < t - WINDOW) history.shift();
                $('push').classList.toggle('on', t < pushUntil);
            }
            drawScene();
            drawPlot();
            requestAnimationFrame(loop);
        }

        // 実行中にスライダを動かすと、その場で条件が変わる
        for (const id of ['bump', 'ke', 'fc']) $(id).addEventListener('input', readParams);
        $('T').addEventListener('change', readParams);
        $('push').addEventListener('click', () => { pushUntil = t + PUSH_TIME; });
        $('playPause').addEventListener('click', () => {
            running = !running;
            $('playPause').textContent = running ? '⏸' : '▶';
        });
        $('reset').addEventListener('click', reset);

        // ---- 各方式が苦手な極端な条件 ----
        const PRESETS = {
            imp: { bump: 2, ke: 4, fc: 2, T: '0.004', push: false, groove: false,
                   note: '関節摩擦が大 → センサを使わないので位置がずれ、力も揺れる' },
            adm: { bump: 0, ke: 5.5, fc: 0.5, T: '0.004', push: false, groove: false,
                   note: '硬いワーク × 制御周期 → 力を測って動くまでの遅れで振動' },
            hyb: { bump: 0, ke: 4, fc: 0.5, T: '0.004', push: false, groove: true,
                   note: '溝がある → 接触が抜けると力を求めて沈み込み、X は位置固定なので斜面に激突' },
        };
        document.querySelectorAll('[data-preset]').forEach(btn => btn.addEventListener('click', () => {
            const pr = PRESETS[btn.dataset.preset];
            $('bump').value = pr.bump;
            $('ke').value = pr.ke;
            $('fc').value = pr.fc;
            $('T').value = pr.T;
            autoPush = pr.push;
            groove = pr.groove;
            $('presetNote').textContent = pr.note;
            document.querySelectorAll('[data-preset]').forEach(b => b.classList.toggle('sel', b === btn));
            reset();
        }));

        reset();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
