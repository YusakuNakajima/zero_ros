<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>力制御3方式の比較</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #111827;
            --panel: #1f2937;
            --line: #374151;
            --text: #e5e7eb;
            --muted: #9ca3af;
            --imp: #f472b6;
            --adm: #4fc3f7;
            --hyb: #fbbf24;
            --work: #a16207;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 8px;
            background: var(--bg);
            color: var(--text);
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 12px;
        }
        .controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 10px; align-items: end; }
        @media (max-width: 560px) { .controls { grid-template-columns: 1fr 1fr; } }
        label { display: block; color: var(--muted); white-space: nowrap; }
        label b { color: var(--text); float: right; }
        input[type="range"], select { width: 100%; margin: 2px 0 0; }
        select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 2px; font: inherit; }
        .buttons { display: flex; gap: 4px; justify-content: flex-end; margin-top: 4px; }
        button {
            padding: 3px 8px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #374151;
            color: var(--text);
            font: inherit;
            cursor: pointer;
            white-space: nowrap;
        }
        button:hover { background: #4b5563; }
        button.primary { background: #2563eb; border-color: #2563eb; }
        canvas { width: 100%; display: block; margin-top: 4px; background: var(--panel); border-radius: 6px; }
        .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-top: 4px; }
        .legend { display: flex; gap: 10px; flex-wrap: wrap; color: var(--muted); }
        .legend span::before { content: ""; display: inline-block; width: 14px; height: 3px; margin-right: 4px; vertical-align: middle; background: currentColor; }
        .imp { color: var(--imp); }
        .adm { color: var(--adm); }
        .hyb { color: var(--hyb); }
    </style>
</head>
<body>
    <div class="controls">
        <div>
            <label>表面の凹凸 <b id="bumpVal"></b></label>
            <input type="range" id="bump" min="0" max="3" step="0.1" value="2">
        </div>
        <div>
            <label>ワークの硬さ <b id="keVal"></b></label>
            <input type="range" id="ke" min="3.5" max="5.5" step="0.1" value="4">
        </div>
        <div>
            <label>関節摩擦 <b id="fcVal"></b></label>
            <input type="range" id="fc" min="0" max="10" step="0.5" value="4">
        </div>
        <div>
            <label>制御周期</label>
            <select id="T">
                <option value="0.001">1 ms</option>
                <option value="0.004" selected>4 ms</option>
                <option value="0.008">8 ms</option>
            </select>
        </div>
    </div>
    <canvas id="scene" height="135"></canvas>
    <canvas id="plot" height="105"></canvas>
    <div class="row">
        <div class="legend">
            <span class="imp">インピーダンス</span>
            <span class="adm">アドミッタンス</span>
            <span class="hyb">ハイブリッド（Z を力制御）</span>
        </div>
        <div class="buttons">
            <button id="playPause" class="primary">⏸</button>
            <button id="reset">⟲</button>
        </div>
    </div>

    <script>
        // ---- 1自由度 (押し付け方向) のモデル ----
        // 工具を凹凸のあるワークに 10 N で押し付けながら横に送る (研磨のイメージ)。
        // 3つの方式で押し付け方向だけを制御し、力の出方を比べる。
        const MASS = 2.0, VISCOUS = 2.0;     // ロボットの質量 [kg]・関節粘性 [N s/m]
        const F_DES = 10;                     // 狙いの押し付け力 [N]
        const DT = 1e-5;                      // 物理シミュレーションの刻み [s]
        const PLAYBACK = 0.5;                 // 実時間の 1/2 で再生
        const WINDOW = 4;                     // プロットの時間幅 [s]
        // インピーダンス / アドミッタンス共通の目標インピーダンス
        const KD = 2000, MD = 2.0, DD = 2 * 0.9 * Math.sqrt(KD * MD);
        // 目標位置: 硬い表面なら 10 N になるよう、表面の少し奥に置く (凹凸は知らない)
        const X_REF = F_DES / KD;
        // アドミッタンス / ハイブリッドの内側の位置制御 (帯域 20 Hz)
        const WP = 2 * Math.PI * 20;
        const KP_POS = MASS * WP * WP, KV_POS = 2 * MASS * WP * 0.9;
        // ハイブリッドの力制御: 力の誤差 → 速度。応答 6 Hz 相当、硬さに合わせて調整済み
        const HYB_BW = 2 * Math.PI * 6;

        const $ = id => document.getElementById(id);
        let params, t, step_i, robots, history, running = true;

        function readParams() {
            params = {
                bump: parseFloat($('bump').value) / 1000,
                ke: Math.pow(10, parseFloat($('ke').value)),
                fc: parseFloat($('fc').value),
                T: parseFloat($('T').value),
            };
            params.ctrlEvery = Math.round(params.T / DT);
            $('bumpVal').textContent = '±' + (params.bump * 1000).toFixed(1) + ' mm';
            $('keVal').textContent = params.ke >= 1e5 ? (params.ke / 1000).toFixed(0) + ' kN/m' : (params.ke / 1000).toFixed(1) + ' kN/m';
            $('fcVal').textContent = params.fc.toFixed(1) + ' N';
        }

        // ワーク表面の位置 [m] (押し付け方向が正、平均 0)
        function surface(time) {
            const b = params.bump;
            return b * (0.6 * Math.sin(2 * Math.PI * 0.5 * time) + 0.4 * Math.sin(2 * Math.PI * 1.3 * time + 1));
        }

        function newRobot(mode) {
            return { mode, x: surface(0), v: 0, u: 0, xc: surface(0), vc: 0, sensor: [0, 0], force: 0 };
        }

        function reset() {
            readParams();
            t = 0;
            step_i = 0;
            robots = [newRobot('imp'), newRobot('adm'), newRobot('hyb')];
            history = [];
        }

        function step() {
            const w = surface(t);
            const doCtrl = step_i % params.ctrlEvery === 0;
            for (const r of robots) {
                const pen = r.x - w;
                const fEnv = pen > 0 ? params.ke * pen : 0;
                if (doCtrl) {
                    r.sensor.shift();
                    r.sensor.push(fEnv);           // 力センサは 1 周期遅れ
                    const fMeas = r.sensor[0];
                    if (r.mode === 'imp') {
                        // 位置のずれ → トルク(力)指令。センサは使わない
                        r.u = KD * (X_REF - r.x) - DD * r.v;
                    } else if (r.mode === 'adm') {
                        // 測った力 → 位置指令 → 位置制御
                        const acc = (-fMeas - DD * r.vc - KD * (r.xc - X_REF)) / MD;
                        r.vc += acc * params.T;
                        r.xc += r.vc * params.T;
                        r.u = KP_POS * (r.xc - r.x) + KV_POS * (r.vc - r.v);
                    } else {
                        // ハイブリッド: 押し付け方向は「力」を目標にする (X は位置制御だがここでは省略)
                        r.vc = Math.max(-0.05, Math.min(0.05, HYB_BW / params.ke * (F_DES - fMeas)));
                        r.xc += r.vc * params.T;
                        r.u = KP_POS * (r.xc - r.x) + KV_POS * (r.vc - r.v);
                    }
                }
                const drive = r.u - fEnv;
                let fr;
                if (Math.abs(r.v) > 1e-4) fr = -params.fc * Math.sign(r.v);
                else fr = -Math.max(-params.fc, Math.min(params.fc, drive));
                const a = (drive + fr - VISCOUS * r.v) / MASS;
                r.v += a * DT;
                r.x += r.v * DT;
                r.force = fEnv;
            }
            if (step_i % 500 === 0) history.push({ t, f: robots.map(r => r.force) });
            t += DT;
            step_i++;
        }

        // ---- 描画 ----
        const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
        function fitCanvas(c) {
            const ratio = window.devicePixelRatio || 1;
            const w = c.clientWidth, h = parseInt(c.getAttribute('height'), 10);
            if (c.width !== Math.round(w * ratio)) {
                c.width = Math.round(w * ratio);
                c.height = Math.round(h * ratio);
                c.style.height = h + 'px';
            }
            const ctx = c.getContext('2d');
            ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
            return { ctx, w, h };
        }

        const LANES = [
            { name: 'インピーダンス', col: '--imp' },
            { name: 'アドミッタンス', col: '--adm' },
            { name: 'ハイブリッド', col: '--hyb' },
        ];

        function drawScene() {
            const { ctx, w, h } = fitCanvas($('scene'));
            ctx.clearRect(0, 0, w, h);
            const laneH = h / 3;
            const MM = 6;                         // 1 mm を何 px で描くか (押し付け方向は拡大)
            const toolX = w * 0.42, SPAN = 6;     // 画面幅に映る時間幅 [s] 分の表面
            robots.forEach((r, i) => {
                const y0 = i * laneH, base = y0 + laneH * 0.55;
                const yPx = x => base + x * 1000 * MM;
                // ワーク (工具の下を左へ流れる)
                ctx.fillStyle = css('--work');
                ctx.beginPath();
                ctx.moveTo(0, y0 + laneH);
                for (let px = 0; px <= w; px += 3) {
                    const tt = t + (px - toolX) / w * SPAN;
                    ctx.lineTo(px, yPx(surface(tt)));
                }
                ctx.lineTo(w, y0 + laneH);
                ctx.fill();
                // 工具
                const tip = Math.min(yPx(r.x), yPx(Math.max(r.x, surface(t))));
                ctx.fillStyle = '#6b7280';
                ctx.fillRect(toolX - 4, y0 + 2, 8, Math.max(0, tip - 12 - y0 - 2));
                ctx.fillStyle = css(LANES[i].col);
                ctx.fillRect(toolX - 12, tip - 12, 24, 12);
                // 名前と力
                ctx.font = 'bold 12px "Noto Sans JP", sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(LANES[i].name, 6, y0 + 15);
                ctx.textAlign = 'right';
                ctx.fillStyle = css('--text');
                ctx.font = '12px "Noto Sans JP", sans-serif';
                ctx.fillText(r.force.toFixed(1) + ' N', w - 8, y0 + 15);
                if (i > 0) {
                    ctx.fillStyle = css('--bg');
                    ctx.fillRect(0, y0 - 1, w, 2);
                }
            });
        }

        function drawPlot() {
            const { ctx, w, h } = fitCanvas($('plot'));
            ctx.clearRect(0, 0, w, h);
            const pad = { l: 28, r: 8, t: 16, b: 14 };
            const pw = w - pad.l - pad.r, ph = h - pad.t - pad.b;
            const t0 = Math.max(0, t - WINDOW);
            const X = tt => pad.l + (tt - t0) / WINDOW * pw;
            const yMax = 30;
            const Y = f => pad.t + ph - Math.min(Math.max(f, 0), yMax) / yMax * ph;
            ctx.strokeStyle = css('--line');
            ctx.strokeRect(pad.l, pad.t, pw, ph);
            ctx.fillStyle = css('--muted');
            ctx.font = '11px "Noto Sans JP", sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('押し付け力 [N]（点線 = 目標 10 N）', pad.l, 11);
            ctx.textAlign = 'right';
            ctx.fillText(yMax, pad.l - 4, pad.t + 8);
            ctx.fillText('0', pad.l - 4, pad.t + ph);
            ctx.fillText('時間 →', pad.l + pw, h - 2);
            ctx.strokeStyle = css('--muted');
            ctx.setLineDash([3, 4]);
            ctx.beginPath();
            ctx.moveTo(pad.l, Y(F_DES));
            ctx.lineTo(pad.l + pw, Y(F_DES));
            ctx.stroke();
            ctx.setLineDash([]);
            LANES.forEach((lane, i) => {
                ctx.strokeStyle = css(lane.col);
                ctx.lineWidth = 2;
                ctx.beginPath();
                history.forEach((p, k) => k ? ctx.lineTo(X(p.t), Y(p.f[i])) : ctx.moveTo(X(p.t), Y(p.f[i])));
                ctx.stroke();
            });
            ctx.lineWidth = 1;
        }

        let last = null;
        function loop(now) {
            if (last === null) last = now;
            const elapsed = Math.min((now - last) / 1000, 0.05);
            last = now;
            if (running) {
                const n = Math.round(elapsed * PLAYBACK / DT);
                for (let i = 0; i < n; i++) step();
                while (history.length && history[0].t < t - WINDOW) history.shift();
            }
            drawScene();
            drawPlot();
            requestAnimationFrame(loop);
        }

        // 実行中にスライダを動かすと、その場で条件が変わる
        for (const id of ['bump', 'ke', 'fc']) $(id).addEventListener('input', readParams);
        $('T').addEventListener('change', readParams);
        $('playPause').addEventListener('click', () => {
            running = !running;
            $('playPause').textContent = running ? '⏸' : '▶';
        });
        $('reset').addEventListener('click', reset);

        reset();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
