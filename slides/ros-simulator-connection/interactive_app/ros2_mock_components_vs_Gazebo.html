<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROS2シミュレータ比較 (Mock Components vs Gazebo)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            overflow: auto; /* スクロールを有効にする */
        }
        .label {
            -webkit-user-select: none; /* Safari */
            -ms-user-select: none; /* IE 10+ and Edge */
            user-select: none; /* Standard */
        }
    </style>
</head>
<body class="bg-gray-900 text-white">

    <div class="flex flex-col h-screen">
        <header class="text-center p-4 bg-gray-800 border-b border-gray-700">
            <h1 class="text-2xl md:text-3xl font-bold text-cyan-400">ROS2シミュレータ比較 (Mock Components vs Gazebo)</h1>
            <p class="text-sm md:text-base text-gray-300 mt-1">スライダーを動かして、2つのシミュレーターの動きの違いを比べてみましょう。</p>
        </header>

        <main class="flex-grow flex flex-col md:flex-row p-4 gap-4">
            <div class="flex-grow grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-gray-800 rounded-lg p-4 flex flex-col border border-gray-700">
                    <h2 class="text-xl font-bold text-center mb-2 text-green-400">簡易シミュレーション (Mock Components)</h2>
                    <p class="text-xs text-center text-gray-400 mb-2 h-10">
                        物理演算（重力や衝突）は行わず、ros2_controlの指令通りに動いたことにします。動作が非常に軽く、ロジック確認に最適です。
                    </p>
                    <div id="kinematics-container" class="flex-grow bg-gray-900 rounded-md overflow-hidden cursor-grab active:cursor-grabbing"></div>
                </div>

                <div class="bg-gray-800 rounded-lg p-4 flex flex-col border border-gray-700">
                    <h2 class="text-xl font-bold text-center mb-2 text-orange-400">物理シミュレーター (Gazebo)</h2>
                    <p class="text-xs text-center text-gray-400 mb-2 h-10">
                        ロボットと環境の接触等を含めた物理計算を行います。重力の影響を受け、障害物に衝突すると停止します。
                    </p>
                    <div id="dynamics-container" class="flex-grow bg-gray-900 rounded-md overflow-hidden cursor-grab active:cursor-grabbing"></div>
                </div>
            </div>

            <div class="w-full md:w-64 bg-gray-800 rounded-lg p-4 flex flex-col justify-center gap-4 border border-gray-700">
                <div>
                    <label for="joint1" class="font-bold text-gray-300 label">関節1 (根本 - 左右回転)</label>
                    <input type="range" id="joint1" min="-135" max="135" value="0" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    <p class="text-center text-sm text-cyan-400 mt-1"><span id="joint1-value">0</span>°</p>
                </div>
                <div>
                    <label for="joint2" class="font-bold text-gray-300 label">関節2 (肩 - 上下)</label>
                    <input type="range" id="joint2" min="-135" max="135" value="-30" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    <p class="text-center text-sm text-cyan-400 mt-1"><span id="joint2-value">-30</span>°</p>
                </div>
                <div>
                    <label for="joint3" class="font-bold text-gray-300 label">関節3 (肘 - 上下)</label>
                    <input type="range" id="joint3" min="-135" max="135" value="60" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    <p class="text-center text-sm text-cyan-400 mt-1"><span id="joint3-value">60</span>°</p>
                </div>
                <div class="pt-4 border-t border-gray-700">
                     <button id="obstacle-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition-colors duration-200">
                        障害物を設置 / 解除
                    </button>
                </div>
                 <div class="pt-2">
                     <button id="reset-btn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg transition-colors duration-200">
                        リセット
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- グローバル変数 ---
        let kinematicsScene, kinematicsCamera, kinematicsRenderer, kinematicsArm, kinematicsObstacle;
        let dynamicsScene, dynamicsCamera, dynamicsRenderer, dynamicsArm, dynamicsObstacle;
        
        let targetAngles = { j1: 0, j2: -30, j3: 60 };
        let kinematicsCurrentAngles = { j1: 0, j2: -30, j3: 60 };
        let dynamicsCurrentAngles = { j1: 0, j2: -30, j3: 60 };
        
        // --- 初期化 ---
        function init() {
            const kinematicsContainer = document.getElementById('kinematics-container');
            const dynamicsContainer = document.getElementById('dynamics-container');

            ({ scene: kinematicsScene, camera: kinematicsCamera, renderer: kinematicsRenderer, arm: kinematicsArm, obstacle: kinematicsObstacle } = setupSimulator(kinematicsContainer));
            ({ scene: dynamicsScene, camera: dynamicsCamera, renderer: dynamicsRenderer, arm: dynamicsArm, obstacle: dynamicsObstacle } = setupSimulator(dynamicsContainer));

            setupUI();
            resetSim();
            animate();
        }

        // --- シミュレーターのセットアップ ---
        function setupSimulator(container) {
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(4, 3, 4);
            camera.lookAt(0, 1, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setClearColor(0x111827);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);
            
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7.5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(20, 20),
                new THREE.MeshStandardMaterial({ color: 0x374151 })
            );
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            
            const arm = createRobotArm();
            scene.add(arm.base);

            // 障害物
            const obstacleGeo = new THREE.BoxGeometry(1, 1.5, 1);
            const obstacleMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6 }); // blue-500
            const obstacle = new THREE.Mesh(obstacleGeo, obstacleMat);
            obstacle.position.set(1.5, 0.75, 0);
            obstacle.castShadow = true;
            obstacle.visible = false;
            scene.add(obstacle);

            window.addEventListener('resize', () => {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });

            setupMouseControls(container, camera);

            return { scene, camera, renderer, arm, obstacle };
        }

        // --- マウス操作 ---
        function setupMouseControls(container, camera) {
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };

            container.addEventListener('mousedown', () => { isDragging = true; });
            container.addEventListener('mouseup', () => { isDragging = false; });
            container.addEventListener('mouseleave', () => { isDragging = false; });

            container.addEventListener('mousemove', (e) => {
                if (!isDragging) {
                    previousMousePosition = { x: e.offsetX, y: e.offsetY };
                    return;
                }
                
                const deltaMove = {
                    x: e.offsetX - previousMousePosition.x,
                    y: e.offsetY - previousMousePosition.y
                };

                const cameraTarget = new THREE.Vector3(0, 1, 0);
                const up = new THREE.Vector3(0, 1, 0);
                const right = new THREE.Vector3().crossVectors(up, camera.position.clone().sub(cameraTarget).normalize()).normalize();

                const phi = camera.position.clone().sub(cameraTarget).angleTo(up);
                const deltaY = -deltaMove.y * 0.01;
                if ((phi + deltaY > 0.1) && (phi + deltaY < Math.PI - 0.1)) {
                    camera.position.applyAxisAngle(right, deltaY);
                }
                
                camera.position.applyAxisAngle(up, -deltaMove.x * 0.01);
                camera.lookAt(cameraTarget);
                
                previousMousePosition = { x: e.offsetX, y: e.offsetY };
            });
            
            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomFactor = 1.1;
                const distance = camera.position.length();
                if (e.deltaY < 0) {
                    if (distance / zoomFactor > 2) camera.position.multiplyScalar(1 / zoomFactor);
                } else {
                    if (distance * zoomFactor < 20) camera.position.multiplyScalar(zoomFactor);
                }
            });
        }

        // --- ロボットアームの作成 ---
        function createRobotArm() {
            const linkMaterial = new THREE.MeshStandardMaterial({ color: 0x0e7490, roughness: 0.5 });
            const jointMaterial = new THREE.MeshStandardMaterial({ color: 0x6b7280, roughness: 0.3 });
            
            const base = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.2, 32), jointMaterial);
            base.castShadow = true;
            base.position.y = 0.1;

            const joint1 = new THREE.Group();
            base.add(joint1);

            const link1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.5, 0.2), linkMaterial);
            link1.castShadow = true;
            link1.position.y = 0.75;
            joint1.add(link1);

            const joint2 = new THREE.Group();
            joint2.position.y = 1.5;
            joint1.add(joint2);

            const link2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.2, 0.2), linkMaterial);
            link2.castShadow = true;
            link2.position.y = 0.6;
            joint2.add(link2);

            const joint3 = new THREE.Group();
            joint3.position.y = 1.2;
            joint2.add(joint3);

            const endEffector = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.3, 16), jointMaterial);
            endEffector.castShadow = true;
            endEffector.position.y = 0.15;
            joint3.add(endEffector);

            return { base, joint1, joint2, joint3, link1, link2 };
        }

        // --- UIのセットアップ ---
        function setupUI() {
            const sliders = ['joint1', 'joint2', 'joint3'];
            sliders.forEach(id => {
                const slider = document.getElementById(id);
                const valueLabel = document.getElementById(`${id}-value`);
                slider.addEventListener('input', (e) => {
                    const jointName = id.replace('joint', 'j');
                    targetAngles[jointName] = parseFloat(e.target.value);
                    valueLabel.textContent = e.target.value;
                });
            });

            document.getElementById('obstacle-btn').addEventListener('click', toggleObstacle);
            document.getElementById('reset-btn').addEventListener('click', resetSim);
        }
        
        // --- 障害物の表示/非表示 ---
        function toggleObstacle() {
            kinematicsObstacle.visible = !kinematicsObstacle.visible;
            dynamicsObstacle.visible = !dynamicsObstacle.visible;
        }

        // --- リセット処理 ---
        function resetSim() {
            targetAngles = { j1: 0, j2: -30, j3: 60 };
            kinematicsCurrentAngles = { ...targetAngles };
            dynamicsCurrentAngles = { ...targetAngles };

            document.getElementById('joint1').value = targetAngles.j1;
            document.getElementById('joint2').value = targetAngles.j2;
            document.getElementById('joint3').value = targetAngles.j3;
            document.getElementById('joint1-value').textContent = targetAngles.j1;
            document.getElementById('joint2-value').textContent = targetAngles.j2;
            document.getElementById('joint3-value').textContent = targetAngles.j3;

            kinematicsObstacle.visible = false;
            dynamicsObstacle.visible = false;
        }

        // --- アニメーションループ ---
        function animate() {
            requestAnimationFrame(animate);

            const degToRad = Math.PI / 180;
            const lerpFactor = 0.05;

            // --- 1. 位置決めシミュレーター(Mock Components)の更新 ---
            kinematicsCurrentAngles.j1 += (targetAngles.j1 - kinematicsCurrentAngles.j1) * lerpFactor;
            kinematicsCurrentAngles.j2 += (targetAngles.j2 - kinematicsCurrentAngles.j2) * lerpFactor;
            kinematicsCurrentAngles.j3 += (targetAngles.j3 - kinematicsCurrentAngles.j3) * lerpFactor;
            
            kinematicsArm.joint1.rotation.y = kinematicsCurrentAngles.j1 * degToRad;
            kinematicsArm.joint2.rotation.z = kinematicsCurrentAngles.j2 * degToRad;
            kinematicsArm.joint3.rotation.z = kinematicsCurrentAngles.j3 * degToRad;

            // --- 2. 物理シミュレーター(Gazebo)の更新 ---
            let nextAngles = { ...dynamicsCurrentAngles };
            // 制御力
            nextAngles.j1 += (targetAngles.j1 - nextAngles.j1) * lerpFactor;
            nextAngles.j2 += (targetAngles.j2 - nextAngles.j2) * lerpFactor;
            nextAngles.j3 += (targetAngles.j3 - nextAngles.j3) * lerpFactor;
            
            // 重力 (現在の姿勢に基づいて計算)
            const gravityEffectFactor = 0.03;
            const joint2WorldQuaternion = new THREE.Quaternion();
            dynamicsArm.joint2.getWorldQuaternion(joint2WorldQuaternion);
            const link1AngleZ = new THREE.Euler().setFromQuaternion(joint2WorldQuaternion, 'YXZ').z;
            nextAngles.j2 -= Math.cos(link1AngleZ) * gravityEffectFactor;
            const joint3WorldQuaternion = new THREE.Quaternion();
            dynamicsArm.joint3.getWorldQuaternion(joint3WorldQuaternion);
            const link2AngleZ = new THREE.Euler().setFromQuaternion(joint3WorldQuaternion, 'YXZ').z;
            nextAngles.j3 -= Math.cos(link2AngleZ) * gravityEffectFactor * 0.8;
            
            // 衝突検知
            let isColliding = false;
            if (dynamicsObstacle.visible) {
                // チェックのために次の角度を一時的に適用
                const prevRot1 = dynamicsArm.joint1.rotation.clone();
                const prevRot2 = dynamicsArm.joint2.rotation.clone();
                const prevRot3 = dynamicsArm.joint3.rotation.clone();

                dynamicsArm.joint1.rotation.y = nextAngles.j1 * degToRad;
                dynamicsArm.joint2.rotation.z = nextAngles.j2 * degToRad;
                dynamicsArm.joint3.rotation.z = nextAngles.j3 * degToRad;
                dynamicsArm.base.updateMatrixWorld(true); // リンクのワールド座標を更新

                const obstacleBox = new THREE.Box3().setFromObject(dynamicsObstacle);
                const armLinks = [dynamicsArm.link1, dynamicsArm.link2];

                for (const link of armLinks) {
                    const linkBox = new THREE.Box3().setFromObject(link);
                    if (linkBox.intersectsBox(obstacleBox)) {
                        isColliding = true;
                        break;
                    }
                }

                // チェック後に角度を元に戻す
                dynamicsArm.joint1.rotation.copy(prevRot1);
                dynamicsArm.joint2.rotation.copy(prevRot2);
                dynamicsArm.joint3.rotation.copy(prevRot3);
                dynamicsArm.base.updateMatrixWorld(true);
            }
            
            // 衝突していなければ、角度を更新
            if (!isColliding) {
                dynamicsCurrentAngles = nextAngles;
            }
            
            // 最終的な角度を適用
            dynamicsArm.joint1.rotation.y = dynamicsCurrentAngles.j1 * degToRad;
            dynamicsArm.joint2.rotation.z = dynamicsCurrentAngles.j2 * degToRad;
            dynamicsArm.joint3.rotation.z = dynamicsCurrentAngles.j3 * degToRad;


            // --- レンダリング ---
            kinematicsRenderer.render(kinematicsScene, kinematicsCamera);
            dynamicsRenderer.render(dynamicsScene, dynamicsCamera);
        }

        // --- 実行 ---
        init();
    </script>
</body>
</html>
