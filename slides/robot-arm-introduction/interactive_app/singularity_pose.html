<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>垂直多関節ロボット 特異点ビューア</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            overflow: hidden; /* Prevent scrollbars from appearing */
        }
        .label {
            width: 80px;
            text-align: right;
            padding-right: 10px;
            font-size: 0.875rem;
        }
        .slider-container {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        #status-panel {
            transition: all 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-900 text-white">
    <div id="container" class="w-full h-full absolute top-0 left-0 z-0"></div>

    <div class="absolute top-0 left-0 p-4 md:p-6 w-full md:w-auto">
        <div class="bg-gray-800 bg-opacity-80 backdrop-blur-sm p-4 rounded-lg shadow-lg">
            <h1 class="text-xl md:text-2xl font-bold mb-4 text-cyan-300">特異点ビューア</h1>
            <p class="text-sm text-gray-300 mb-4 max-w-sm">6軸ロボットの関節を動かし、特異点となる姿勢を視覚的に確認できます。</p>
            
            <!-- Joint Sliders -->
            <div id="controls">
                <!-- Sliders will be generated by JS here -->
            </div>

            <!-- Pre-set Buttons -->
            <div class="mt-4 pt-4 border-t border-gray-600">
                <h2 class="text-lg font-semibold mb-2 text-cyan-400">プリセット姿勢</h2>
                <div class="grid grid-cols-2 gap-2">
                    <button id="wristBtn" class="bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-2 px-4 rounded-lg text-sm transition-colors">手首特異点</button>
                    <button id="elbowBtn" class="bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-2 px-4 rounded-lg text-sm transition-colors">肘/肩特異点</button>
                    <button id="homeBtn" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg text-sm transition-colors col-span-2">初期姿勢</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Status Panel -->
    <div id="status-panel" class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-red-500 bg-opacity-90 backdrop-blur-sm text-white px-6 py-3 rounded-lg shadow-xl text-center font-bold text-lg hidden">
        <p id="status-text">特異点警告！</p>
        <p id="status-detail" class="text-sm font-normal"></p>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Global variables ---
        let scene, camera, renderer, controls;
        let robot;
        const jointAngles = [0, 0, 0, 0, 0, 0]; // J1 to J6 in radians
        const jointLimits = [
            { min: -170, max: 170 }, // J1
            { min: -90, max: 150 },  // J2
            { min: -90, max: 90 },   // J3
            { min: -180, max: 180 }, // J4
            { min: -120, max: 120 }, // J5
            { min: -360, max: 360 }, // J6
        ];

        // --- Robot parameters ---
        const linkLengths = {
            l1: 1.0, // Base to J2
            l2: 2.5, // J2 to J3
            l3: 0.5, // J3 offset from J2 axis
            l4: 2.0, // J3 to J5
            l5: 0.5  // J5 to J6/Flange
        };

        // --- DOM Elements ---
        const container = document.getElementById('container');
        const controlsContainer = document.getElementById('controls');
        const statusPanel = document.getElementById('status-panel');
        const statusText = document.getElementById('status-text');
        const statusDetail = document.getElementById('status-detail');

        // --- Initialization ---
        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111827); // bg-gray-900
            scene.fog = new THREE.Fog(0x111827, 20, 50);

            // Camera
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(8, 6, 8);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 5;
            controls.maxDistance = 50;
            controls.target.set(0, 2, 0);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(10, 15, 5);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);
            
            // Ground
            const groundGeo = new THREE.PlaneGeometry(100, 100);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.9 }); // bg-gray-800
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            
            // Grid
            const grid = new THREE.GridHelper(100, 100, 0x444444, 0x444444);
            scene.add(grid);

            // Robot
            createRobot();
            updateRobotPose();
            
            // UI
            createUI();

            // Event Listeners
            window.addEventListener('resize', onWindowResize, false);
            setupButtonListeners();
        }

        // --- Robot Creation ---
        function createRobot() {
            robot = {};
            const jointMaterial = new THREE.MeshStandardMaterial({ color: 0x0891b2 }); // cyan-600
            const linkMaterial = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.6 }); // slate-500
            const baseMaterial = new THREE.MeshStandardMaterial({ color: 0x334155 }); // slate-700
            const flangeMaterial = new THREE.MeshStandardMaterial({ color: 0xfacc15 }); // yellow-400

            // Helper function to create a mesh
            const createMesh = (geometry, material) => {
                const mesh = new THREE.Mesh(geometry, material);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                return mesh;
            };

            // J1 (Base and Rotation)
            robot.j1 = new THREE.Group();
            const base = createMesh(new THREE.CylinderGeometry(0.7, 0.7, 0.2, 32), baseMaterial);
            robot.j1.add(base);
            const j1_motor = createMesh(new THREE.CylinderGeometry(0.5, 0.5, linkLengths.l1, 32), jointMaterial);
            j1_motor.position.y = linkLengths.l1 / 2 + 0.1;
            robot.j1.add(j1_motor);
            scene.add(robot.j1);

            // J2
            robot.j2 = new THREE.Group();
            robot.j2.position.y = linkLengths.l1;
            const j2_motor = createMesh(new THREE.CylinderGeometry(0.4, 0.4, 0.6, 32), jointMaterial);
            j2_motor.rotation.z = Math.PI / 2;
            robot.j2.add(j2_motor);
            robot.j1.add(robot.j2);

            // Link 2
            const link2 = createMesh(new THREE.BoxGeometry(linkLengths.l2, 0.4, 0.4), linkMaterial);
            link2.position.x = linkLengths.l2 / 2;
            robot.j2.add(link2);

            // J3
            robot.j3 = new THREE.Group();
            robot.j3.position.x = linkLengths.l2;
            robot.j3.position.y = -linkLengths.l3;
            const j3_motor = createMesh(new THREE.CylinderGeometry(0.35, 0.35, 0.5, 32), jointMaterial);
            j3_motor.rotation.z = Math.PI / 2;
            robot.j3.add(j3_motor);
            robot.j2.add(robot.j3);

            // Link 3 (Forearm)
            const link3 = createMesh(new THREE.BoxGeometry(linkLengths.l4, 0.3, 0.3), linkMaterial);
            link3.position.x = linkLengths.l4 / 2;
            robot.j3.add(link3);

            // J4
            robot.j4 = new THREE.Group();
            robot.j4.position.x = linkLengths.l4;
            const j4_motor = createMesh(new THREE.CylinderGeometry(0.25, 0.25, 0.4, 32), jointMaterial);
            j4_motor.rotation.y = Math.PI / 2;
            robot.j4.add(j4_motor);
            robot.j3.add(robot.j4);

            // J5
            robot.j5 = new THREE.Group();
            const j5_motor = createMesh(new THREE.CylinderGeometry(0.2, 0.2, 0.4, 32), jointMaterial);
            j5_motor.rotation.z = Math.PI / 2;
            robot.j5.add(j5_motor);
            robot.j4.add(robot.j5);

            // J6
            robot.j6 = new THREE.Group();
            robot.j6.position.x = linkLengths.l5;
            const j6_motor = createMesh(new THREE.CylinderGeometry(0.15, 0.15, 0.3, 32), jointMaterial);
            j6_motor.rotation.y = Math.PI / 2;
            robot.j6.add(j6_motor);
            robot.j5.add(robot.j6);
            
            // Flange (End Effector)
            robot.flange = createMesh(new THREE.CylinderGeometry(0.2, 0.2, 0.1, 32), flangeMaterial);
            robot.flange.position.x = 0.2;
            robot.j6.add(robot.flange);
        }

        // --- UI Creation ---
        function createUI() {
            controlsContainer.innerHTML = '';
            for (let i = 0; i < 6; i++) {
                const div = document.createElement('div');
                div.className = 'slider-container';
                
                const label = document.createElement('label');
                label.className = 'label text-gray-300';
                label.innerText = `J${i + 1}`;
                div.appendChild(label);

                const slider = document.createElement('input');
                slider.type = 'range';
                slider.min = jointLimits[i].min;
                slider.max = jointLimits[i].max;
                slider.value = THREE.MathUtils.radToDeg(jointAngles[i]);
                slider.className = 'w-40 md:w-48';
                slider.dataset.index = i;
                slider.addEventListener('input', onSliderChange);
                div.appendChild(slider);

                const valueSpan = document.createElement('span');
                valueSpan.className = 'ml-3 text-sm w-12 text-right text-cyan-300';
                valueSpan.id = `j${i + 1}-value`;
                valueSpan.innerText = `${slider.value}°`;
                div.appendChild(valueSpan);
                
                controlsContainer.appendChild(div);
            }
            document.getElementById('elbowBtn').innerText = '肘/肩特異点';
        }
        
        function updateUI() {
            for (let i = 0; i < 6; i++) {
                const slider = controlsContainer.querySelector(`[data-index="${i}"]`);
                const valueSpan = document.getElementById(`j${i + 1}-value`);
                if(slider && valueSpan) {
                    const degValue = Math.round(THREE.MathUtils.radToDeg(jointAngles[i]));
                    slider.value = degValue;
                    valueSpan.innerText = `${degValue}°`;
                }
            }
        }

        // --- Event Handlers ---
        function onSliderChange(event) {
            const index = parseInt(event.target.dataset.index);
            const value = parseInt(event.target.value);
            jointAngles[index] = THREE.MathUtils.degToRad(value);
            document.getElementById(`j${index + 1}-value`).innerText = `${value}°`;
            updateRobotPose();
        }
        
        function setupButtonListeners() {
            document.getElementById('wristBtn').addEventListener('click', () => setPose('wrist'));
            document.getElementById('elbowBtn').addEventListener('click', () => setPose('elbow'));
            document.getElementById('homeBtn').addEventListener('click', () => setPose('home'));
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Robot Logic ---
        function updateRobotPose() {
            robot.j1.rotation.y = jointAngles[0];
            robot.j2.rotation.z = jointAngles[1];
            robot.j3.rotation.z = jointAngles[2];
            robot.j4.rotation.x = jointAngles[3];
            robot.j5.rotation.z = jointAngles[4];
            robot.j6.rotation.x = jointAngles[5];
            
            checkSingularity();
        }
        
        function setPose(poseName) {
            let targetAngles = [0,0,0,0,0,0];
            switch(poseName) {
                case 'home':
                    targetAngles = [0, 0, 0, 0, 0, 0];
                    break;
                case 'wrist':
                    // J5=0 causes wrist singularity
                    targetAngles = [0, Math.PI/4, Math.PI/4, 0, 0, 0];
                    break;
                case 'elbow':
                    // Arm is straight up, wrist center is near J1 axis
                    targetAngles = [0, Math.PI / 2, 0, 0, Math.PI / 4, 0];
                    break;
            }
            
            // Animate to the target pose
            const initialAngles = [...jointAngles];
            const duration = 1000; // 1 second
            let startTime = null;

            function animatePose(timestamp) {
                if (!startTime) startTime = timestamp;
                const progress = Math.min((timestamp - startTime) / duration, 1);
                
                for(let i=0; i<6; i++) {
                    jointAngles[i] = initialAngles[i] + (targetAngles[i] - initialAngles[i]) * progress;
                }

                updateRobotPose();
                updateUI();
                
                if (progress < 1) {
                    requestAnimationFrame(animatePose);
                }
            }
            requestAnimationFrame(animatePose);
        }

        // --- Singularity Detection ---
        function checkSingularity() {
            let isSingular = false;
            
            // 1. Wrist Singularity: J5 angle is close to 0
            // When J5 is 0, J4 and J6 axes align, losing a degree of freedom for wrist orientation.
            const j5_angle_deg = THREE.MathUtils.radToDeg(jointAngles[4]);
            if (Math.abs(j5_angle_deg) < 5) { // 5 degree threshold
                isSingular = true;
                statusPanel.classList.remove('hidden');
                statusPanel.classList.add('bg-red-500');
                statusText.innerText = "手首特異点 (Wrist Singularity)";
                statusDetail.innerText = "J5が0°に近く、J4軸とJ6軸が整列しています。";
                return; // Prioritize this singularity
            }
            
            // 2. Elbow/Shoulder Singularity: Wrist center is on or near the J1 axis
            // This happens when the arm is fully stretched or folded back on itself.
            const j2 = jointAngles[1];
            const j3 = jointAngles[2];
            const { l2, l3, l4 } = linkLengths;

            // Calculate the wrist center's X-coordinate in the J1 frame (ignoring J1 rotation)
            // This is the horizontal distance from the J1 axis.
            const wrist_x_in_j1_frame = (l2 + l4 * Math.cos(j3)) * Math.cos(j2) - (-l3 + l4 * Math.sin(j3)) * Math.sin(j2);
            
            // If the horizontal distance of the wrist from J1 axis is near zero
            if (Math.abs(wrist_x_in_j1_frame) < 0.6) { // Threshold adjusted for l3 offset
                isSingular = true;
                statusPanel.classList.remove('hidden');
                statusPanel.classList.add('bg-orange-500');
                statusText.innerText = "肘/肩特異点 (Elbow/Shoulder Singularity)";
                statusDetail.innerText = "手首中心がJ1軸に近づき、アームの可動性が制限されています。";
                return;
            }

            // If not singular
            if (!isSingular) {
                statusPanel.classList.add('hidden');
            }
        }

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // --- Start ---
        init();
        animate();

    </script>
</body>
</html>
