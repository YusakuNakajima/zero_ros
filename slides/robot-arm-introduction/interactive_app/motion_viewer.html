<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ロボット動作軌跡 比較シミュレーター (Z-up)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #111827;
            color: #f3f4f6;
        }

        #canvas-container {
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui-container {
            position: absolute;
            top: 1rem;
            left: 1rem;
            z-index: 10;
            pointer-events: none;
        }

        .control-panel {
            background-color: rgba(31, 41, 55, 0.8);
            backdrop-filter: blur(10px);
            padding: 1rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            pointer-events: auto;
            width: 500px;
            max-width: 90vw;
        }

        .control-panel button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .control-panel input[type="number"] {
            -moz-appearance: textfield;
        }

        .control-panel input::-webkit-outer-spin-button,
        .control-panel input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .radio-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            border-radius: 0.5rem;
            transition: background-color 0.2s;
        }
        input[type="radio"]:checked + .radio-label {
            background-color: #3b82f6;
        }
    </style>
</head>

<body>

    <div id="canvas-container"></div>

    <div id="ui-container">
        <div class="control-panel">
            <h1 class="text-xl font-bold text-center mb-4 text-white">ロボット動作軌跡 比較シミュレーター</h1>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <p class="text-sm font-bold text-gray-400">コントロール</p>
                    <div class="flex flex-col space-y-2 mt-2">
                        <button id="start-btn"
                            class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded-lg">アニメーション開始</button>
                        <button id="reset-btn"
                            class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-2 px-4 rounded-lg">リセット</button>
                    </div>
                </div>
                <div>
                    <p class="text-sm font-bold text-gray-400">動作モード選択</p>
                    <div id="mode-selector" class="mt-2 text-left bg-gray-800 p-2 rounded-lg h-full text-sm space-y-1">
                        <div>
                            <input type="radio" name="animation-mode" value="PTP" id="mode-ptp" class="hidden" checked>
                            <label for="mode-ptp" class="radio-label">PTP (関節補間)</label>
                        </div>
                        <div>
                            <input type="radio" name="animation-mode" value="LIN" id="mode-lin" class="hidden">
                            <label for="mode-lin" class="radio-label">LIN (直線補間)</label>
                        </div>
                        <div>
                            <input type="radio" name="animation-mode" value="CIRC" id="mode-circ" class="hidden">
                            <label for="mode-circ" class="radio-label">CIRC (円弧補間)</label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-4 pt-4 border-t border-gray-600">
                <h2 class="text-lg font-bold text-center mb-2 text-white">座標設定 (Z-up 右手系)</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <h3 class="font-semibold text-green-400 mb-2">開始点 (X, Y, Z)</h3>
                        <div class="grid grid-cols-3 gap-2">
                            <input type="number" id="start-x" class="bg-gray-700 text-white rounded p-1 text-center"
                                value="40">
                            <input type="number" id="start-y" class="bg-gray-700 text-white rounded p-1 text-center"
                                value="20">
                            <input type="number" id="start-z" class="bg-gray-700 text-white rounded p-1 text-center"
                                value="50">
                        </div>
                    </div>
                     <div>
                        <h3 class="font-semibold text-yellow-400 mb-2">中間点 (X, Y, Z)</h3>
                        <div class="grid grid-cols-3 gap-2">
                            <input type="number" id="via-x" class="bg-gray-700 text-white rounded p-1 text-center"
                                value="50">
                            <input type="number" id="via-y" class="bg-gray-700 text-white rounded p-1 text-center"
                                value="0">
                            <input type="number" id="via-z" class="bg-gray-700 text-white rounded p-1 text-center"
                                value="30">
                        </div>
                    </div>
                    <div>
                        <h3 class="font-semibold text-red-400 mb-2">終了点 (X, Y, Z)</h3>
                        <div class="grid grid-cols-3 gap-2">
                            <input type="number" id="end-x" class="bg-gray-700 text-white rounded p-1 text-center"
                                value="40">
                            <input type="number" id="end-y" class="bg-gray-700 text-white rounded p-1 text-center"
                                value="-20">
                            <input type="number" id="end-z" class="bg-gray-700 text-white rounded p-1 text-center"
                                value="10">
                        </div>
                    </div>
                </div>
                <div class="mt-4 flex justify-center">
                    <button id="update-pos-btn"
                        class="bg-green-600 hover:bg-green-500 text-white font-bold py-2 px-6 rounded-lg">座標を更新</button>
                </div>
                <p id="error-message" class="text-yellow-400 text-center mt-2 text-sm h-4"></p>
            </div>
            
            <div class="mt-4 pt-4 border-t border-gray-600">
                <h2 class="text-lg font-bold text-center mb-2 text-white">各関節のリアルタイム角速度 (rad/s)</h2>
                <div class="bg-gray-900 p-2 rounded-lg">
                    <canvas id="velocity-chart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script type="module">
        // --- 基本設定 ---
        let scene, camera, renderer, controls;
        let robot, endEffector;
        let isAnimating = false;
        let startMarkerGroup, endMarkerGroup, viaMarkerGroup;
        let pathLine;

        // --- ロボットの関節とリンク ---
        const joints = [];

        // --- ターゲット ---
        let startPos = new THREE.Vector3(40, 20, 50);
        let endPos = new THREE.Vector3(40, -20, 10);
        let viaPos = new THREE.Vector3(50, 0, 30);
        
        // --- 速度プロット用 ---
        let velocityChart;
        let lastAngles = { j1: 0, j2: 0, j3: 0 };
        let lastTime = 0;
        let animationStartTime = 0;

        // --- 初期化処理 ---
        function init() {
            THREE.Object3D.DefaultUp.set(0, 0, 1);
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111827);
            const axesHelper = new THREE.AxesHelper(50);
            scene.add(axesHelper);
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(60, -60, 80);
            const container = document.getElementById('canvas-container');
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(50, -50, 100);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(200, 200),
                new THREE.MeshStandardMaterial({ color: 0x1f2937 })
            );
            ground.receiveShadow = true;
            scene.add(ground);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            createRobot();
            createMarkers();
            setupUI();
            createJointVelocityChart();
            resetScene();
            animate();
        }

        // ロボットモデルの作成
        function createRobot() {
            robot = new THREE.Group();
            scene.add(robot);
            const linkMaterial = new THREE.MeshStandardMaterial({ color: 0x9ca3af, roughness: 0.5, metalness: 0.5 });
            const jointMaterial = new THREE.MeshStandardMaterial({ color: 0x60a5fa, roughness: 0.4, metalness: 0.6 });
            const baseHeight = 4;
            const base = new THREE.Mesh(new THREE.CylinderGeometry(10, 10, baseHeight, 32), new THREE.MeshStandardMaterial({ color: 0x4b5563 }));
            base.rotation.x = Math.PI / 2;
            base.position.z = baseHeight / 2;
            base.castShadow = true;
            robot.add(base);
            const j1 = new THREE.Group();
            j1.position.z = baseHeight;
            robot.add(j1);
            joints.push(j1);
            const j1VisualHeight = 6;
            const j1Visual = new THREE.Mesh(new THREE.CylinderGeometry(4, 4, j1VisualHeight, 32), jointMaterial);
            j1Visual.rotation.x = Math.PI / 2;
            j1Visual.position.z = j1VisualHeight / 2;
            j1Visual.castShadow = true;
            j1.add(j1Visual);
            const l1Height = 20;
            const l1 = new THREE.Group();
            l1.position.z = j1VisualHeight;
            j1.add(l1);
            const l1Visual = new THREE.Mesh(new THREE.BoxGeometry(6, 6, l1Height), linkMaterial);
            l1Visual.position.z = l1Height / 2;
            l1Visual.castShadow = true;
            l1.add(l1Visual);
            const j2 = new THREE.Group();
            j2.position.z = l1Height;
            l1.add(j2);
            joints.push(j2);
            const j2VisualWidth = 8;
            const j2Visual = new THREE.Mesh(new THREE.CylinderGeometry(5, 5, j2VisualWidth, 32), jointMaterial);
            j2Visual.castShadow = true;
            j2.add(j2Visual);
            const l2Length = 40;
            const l2 = new THREE.Group();
            j2.add(l2);
            const l2Visual = new THREE.Mesh(new THREE.BoxGeometry(l2Length, 5, 5), linkMaterial);
            l2Visual.position.x = l2Length / 2;
            l2Visual.castShadow = true;
            l2.add(l2Visual);
            const j3 = new THREE.Group();
            j3.position.x = l2Length;
            l2.add(j3);
            joints.push(j3);
            const j3VisualWidth = 7;
            const j3Visual = new THREE.Mesh(new THREE.CylinderGeometry(4, 4, j3VisualWidth, 32), jointMaterial);
            j3Visual.castShadow = true;
            j3.add(j3Visual);
            const l3Length = 29;
            const l3 = new THREE.Group();
            j3.add(l3);
            const l3Visual = new THREE.Mesh(new THREE.BoxGeometry(l3Length, 4, 4), linkMaterial);
            l3Visual.position.x = l3Length / 2;
            l3Visual.castShadow = true;
            l3.add(l3Visual);
            const flange = new THREE.Group();
            flange.position.x = l3Length;
            l3.add(flange);
            const eeVisualLength = 6;
            const eeVisual = new THREE.Mesh(new THREE.ConeGeometry(3, eeVisualLength, 16), new THREE.MeshStandardMaterial({ color: 0xfb923c }));
            eeVisual.rotation.z = -Math.PI / 2;
            eeVisual.position.x = eeVisualLength / 2;
            eeVisual.castShadow = true;
            flange.add(eeVisual);
            endEffector = new THREE.Group();
            endEffector.position.x = eeVisualLength;
            flange.add(endEffector);
            const tcpMarker = new THREE.AxesHelper(5);
            endEffector.add(tcpMarker);
        }

        function createLabeledMarker(text, position, color) {
            const group = new THREE.Group();
            group.position.copy(position);
            scene.add(group);
            const markerSphere = new THREE.Mesh(new THREE.SphereGeometry(1.5), new THREE.MeshBasicMaterial({ color: color }));
            group.add(markerSphere);
            return group;
        }

        function createMarkers() {
            startMarkerGroup = createLabeledMarker('開始', startPos, 0x22c55e);
            endMarkerGroup = createLabeledMarker('終了', endPos, 0xef4444);
            viaMarkerGroup = createLabeledMarker('中間', viaPos, 0xeab308);
        }

        function setupUI() {
            document.getElementById('start-btn').addEventListener('click', startComparison);
            document.getElementById('reset-btn').addEventListener('click', resetScene);
            document.getElementById('update-pos-btn').addEventListener('click', updatePositions);
        }

        function updatePositions() {
            if (isAnimating) return;
            const errorMessage = document.getElementById('error-message');
            errorMessage.textContent = '';
            const newStartPos = new THREE.Vector3(
                parseFloat(document.getElementById('start-x').value),
                parseFloat(document.getElementById('start-y').value),
                parseFloat(document.getElementById('start-z').value)
            );
            const newEndPos = new THREE.Vector3(
                parseFloat(document.getElementById('end-x').value),
                parseFloat(document.getElementById('end-y').value),
                parseFloat(document.getElementById('end-z').value)
            );
            const newViaPos = new THREE.Vector3(
                parseFloat(document.getElementById('via-x').value),
                parseFloat(document.getElementById('via-y').value),
                parseFloat(document.getElementById('via-z').value)
            );
            
            if (!calculateAnglesFor(newStartPos)) { errorMessage.textContent = '開始点が可動範囲外です。'; return; }
            if (!calculateAnglesFor(newEndPos)) { errorMessage.textContent = '終了点が可動範囲外です。'; return; }
            if (!calculateAnglesFor(newViaPos)) { errorMessage.textContent = '中間点が可動範囲外です。'; return; }
            
            startPos.copy(newStartPos);
            endPos.copy(newEndPos);
            viaPos.copy(newViaPos);
            
            startMarkerGroup.position.copy(startPos);
            endMarkerGroup.position.copy(endPos);
            viaMarkerGroup.position.copy(viaPos);
            
            resetScene();
        }

        function startComparison() {
            if (isAnimating) return;
            
            resetScene();
            isAnimating = true;
            document.getElementById('start-btn').disabled = true;
            document.getElementById('update-pos-btn').disabled = true;

            robot.visible = true;
            resetVelocityChart();
            animationStartTime = performance.now();
            
            const startAngles = calculateAnglesFor(startPos);
            if (!startAngles) {
                document.getElementById('error-message').textContent = '開始点が可動範囲外です。';
                resetScene();
                return;
            }

            setJointAngles(startAngles);
            lastAngles = { ...startAngles };
            lastTime = animationStartTime;

            const duration = 4000;
            let animationTween;

            const selectedMode = document.querySelector('input[name="animation-mode"]:checked').value;
            
            // Create path line for visualization
            pathLine = createPathLine();

            const onComplete = () => {
                isAnimating = false;
                document.getElementById('start-btn').disabled = false;
                document.getElementById('update-pos-btn').disabled = false;
            };

            switch(selectedMode) {
                case 'PTP': {
                    const endAngles = calculateAnglesFor(endPos);
                    if (!endAngles) {
                        document.getElementById('error-message').textContent = '終了点が可動範囲外です。';
                        resetScene();
                        return;
                    }
                    animationTween = new TWEEN.Tween(startAngles)
                        .to(endAngles, duration)
                        .easing(TWEEN.Easing.Quadratic.InOut)
                        .onUpdate((angles) => {
                            setJointAngles(angles);
                            updatePath(pathLine);
                        })
                        .onComplete(onComplete);
                    break;
                }
                case 'LIN': {
                    const lineCurve = new THREE.Line3(startPos, endPos);
                    animationTween = new TWEEN.Tween({ t: 0 }).to({ t: 1 }, duration)
                        .easing(TWEEN.Easing.Sinusoidal.InOut)
                        .onUpdate(({ t }) => {
                            const targetPoint = new THREE.Vector3();
                            lineCurve.at(t, targetPoint);
                            if (solveIK(targetPoint)) {
                                updatePath(pathLine);
                            }
                        })
                        .onComplete(onComplete);
                    break;
                }
                case 'CIRC': {
                    const colinearityCheck = new THREE.Vector3().crossVectors(
                        new THREE.Vector3().subVectors(viaPos, startPos),
                        new THREE.Vector3().subVectors(endPos, startPos)
                    ).length();

                    if (colinearityCheck < 0.01) {
                         document.getElementById('error-message').textContent = 'CIRC: 各点が直線状のためLINで動作します。';
                         const lineCurve = new THREE.Line3(startPos, endPos);
                         animationTween = new TWEEN.Tween({ t: 0 }).to({ t: 1 }, duration)
                            .onUpdate(({t}) => {
                                const targetPoint = new THREE.Vector3();
                                lineCurve.at(t, targetPoint);
                                if(solveIK(targetPoint)) updatePath(pathLine);
                            }).onComplete(onComplete);

                    } else {
                        const circleCurve = new THREE.CatmullRomCurve3([startPos, viaPos, endPos]);
                        animationTween = new TWEEN.Tween({ t: 0 }).to({ t: 1 }, duration)
                            .easing(TWEEN.Easing.Sinusoidal.InOut)
                            .onUpdate(({ t }) => {
                                const targetPoint = circleCurve.getPoint(t);
                                if (solveIK(targetPoint)) {
                                    updatePath(pathLine);
                                }
                            })
                            .onComplete(onComplete);
                    }
                    break;
                }
            }

            if (animationTween) {
                animationTween.start();
            } else {
                resetScene();
            }
        }

        function createPathLine() {
            const material = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 3 });
            const geometry = new THREE.BufferGeometry();
            const line = new THREE.Line(geometry, material);
            scene.add(line);
            return line;
        }

        function updatePath(line) {
            if (!line) return;
            const currentPoints = line.geometry.getAttribute('position')?.array || [];
            const newPoint = new THREE.Vector3();
            endEffector.getWorldPosition(newPoint);
            const newPoints = new Float32Array(currentPoints.length + 3);
            newPoints.set(currentPoints);
            newPoints.set([newPoint.x, newPoint.y, newPoint.z], currentPoints.length);
            line.geometry.setAttribute('position', new THREE.BufferAttribute(newPoints, 3));
            line.geometry.attributes.position.needsUpdate = true;
        }

        function resetScene() {
            if (isAnimating) {
                TWEEN.removeAll();
                isAnimating = false;
            }
            if (pathLine) {
                scene.remove(pathLine);
                pathLine.geometry.dispose();
                pathLine.material.dispose();
                pathLine = null;
            }
            document.getElementById('start-btn').disabled = false;
            document.getElementById('update-pos-btn').disabled = false;
            document.getElementById('error-message').textContent = '';
            robot.visible = true;
            
            resetVelocityChart();
            solveIK(startPos);
        }

        function solveIK(target) {
            const angles = calculateAnglesFor(target);
            if (angles) {
                setJointAngles(angles);
                return true;
            }
            return false;
        }
        
        function setJointAngles(angles) {
            joints[0].rotation.z = angles.j1;
            joints[1].rotation.y = -angles.j2;
            joints[2].rotation.y = angles.j3;
        }
        
        function calculateAnglesFor(targetWorldPos) {
            const L2 = 40;
            const L3 = 35; // l3(29) + ee(6)
            const j2PivotZ = 30; // baseHeight(4) + j1VisualHeight(6) + l1Height(20)
            const theta1 = Math.atan2(targetWorldPos.y, targetWorldPos.x);
            const r = Math.sqrt(targetWorldPos.x ** 2 + targetWorldPos.y ** 2);
            const h = targetWorldPos.z - j2PivotZ;
            const distSq = r ** 2 + h ** 2;
            const dist = Math.sqrt(distSq);
            if (dist > L2 + L3 || dist < Math.abs(L2 - L3)) { return null; }
            const cos_val_theta3 = (distSq - L2 ** 2 - L3 ** 2) / (2 * L2 * L3);
            if (Math.abs(cos_val_theta3) > 1) return null;
            const theta3 = Math.acos(cos_val_theta3);
            const alpha = Math.atan2(h, r);
            const beta_cos_val = (L2 ** 2 + distSq - L3 ** 2) / (2 * L2 * dist);
             if (Math.abs(beta_cos_val) > 1) return null;
            const beta = Math.acos(beta_cos_val);
            const theta2 = alpha + beta;
            return { j1: theta1, j2: theta2, j3: theta3 };
        }
        
        function createJointVelocityChart() {
            const ctx = document.getElementById('velocity-chart').getContext('2d');
            velocityChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'J1 (θ1)',
                        data: [],
                        borderColor: '#ef4444',
                        borderWidth: 1.5,
                        pointRadius: 0
                    }, {
                        label: 'J2 (θ2)',
                        data: [],
                        borderColor: '#22c55e',
                        borderWidth: 1.5,
                        pointRadius: 0
                    }, {
                        label: 'J3 (θ3)',
                        data: [],
                        borderColor: '#3b82f6',
                        borderWidth: 1.5,
                        pointRadius: 0
                    }]
                },
                options: {
                    animation: false,
                    scales: {
                        x: {
                            type: 'linear',
                            title: { display: true, text: 'Time (s)', color: '#9ca3af' },
                            ticks: { color: '#9ca3af', maxRotation: 0, minRotation: 0 },
                            grid: { color: 'rgba(75, 85, 99, 0.5)' }
                        },
                        y: {
                            title: { display: true, text: 'Angular Velocity (rad/s)', color: '#9ca3af' },
                            ticks: { color: '#9ca3af' },
                            grid: { color: 'rgba(75, 85, 99, 0.5)' }
                        }
                    },
                    plugins: {
                        legend: { labels: { color: '#f3f4f6' } }
                    }
                }
            });
        }
        
        function updateJointVelocityPlot() {
            if (!isAnimating) return;

            const currentTime = performance.now();
            const deltaTime = (currentTime - lastTime) / 1000.0;

            if (deltaTime < 1e-5) return;

            const currentAngles = {
                j1: joints[0].rotation.z,
                j2: -joints[1].rotation.y,
                j3: joints[2].rotation.y,
            };

            const angularVelocities = {
                j1: (currentAngles.j1 - lastAngles.j1) / deltaTime,
                j2: (currentAngles.j2 - lastAngles.j2) / deltaTime,
                j3: (currentAngles.j3 - lastAngles.j3) / deltaTime,
            };

            const chartTime = (currentTime - animationStartTime) / 1000.0;
            velocityChart.data.labels.push(chartTime.toFixed(2));
            velocityChart.data.datasets[0].data.push(angularVelocities.j1);
            velocityChart.data.datasets[1].data.push(angularVelocities.j2);
            velocityChart.data.datasets[2].data.push(angularVelocities.j3);
            
            velocityChart.update('none');

            lastAngles = { ...currentAngles };
            lastTime = currentTime;
        }
        
        function resetVelocityChart() {
            if (velocityChart) {
                velocityChart.data.labels = [];
                velocityChart.data.datasets.forEach(dataset => {
                    dataset.data = [];
                });
                velocityChart.update();
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            TWEEN.update();
            controls.update();
            updateJointVelocityPlot();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }, false);

        init();
    </script>
</body>
